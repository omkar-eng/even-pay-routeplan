// ── (old RM-assignment route plan removed — replaced by sheet-based Clinic Health view) ─────
function _oldRoutePlan_DELETED(){const getEffectiveClinics=(r)=>{
    const ovs=assignments.overrides||{};
    const added=(assignments.added||{})[r.rm]||[];
    const base=r.clinics.filter(c=>!ovs[clinicKey(r.rm,c.name)]?.removed).map(c=>{const ov=ovs[clinicKey(r.rm,c.name)]||{};return{...c,...ov};});
    return[...base,...added.map((c,idx)=>({...c,_added:true,_addedIdx:idx}))];
  };
  const getCKey=(r,c)=>c._added?`${clinicKey(r.rm,c.name)}_a${c._addedIdx}`:clinicKey(r.rm,c.name);

  const handleSync=async()=>{
    const url=_cache.route_settings?.sheetUrl;
    if(!url){setSyncMsg('No sheet configured. Admin must set it in Admin > Route Sync.');return;}
    setSyncing(true);setSyncMsg('');
    try{
      const res=await syncLeadsFromSheet(url);
      setLiveLeads({...res});
      const n=Object.keys(res).filter(k=>!k.startsWith('_')).length;
      setSyncMsg('Synced '+n+' clinics');
    }catch(e){setSyncMsg('Sync failed — check sheet URL or publish settings');}
    setSyncing(false);
    setTimeout(()=>setSyncMsg(''),6000);
  };

  const handleSaveNote=async()=>{
    if(!editingNote||!editingNote.text.trim())return;
    const key=clinicKey(editingNote.rmName,editingNote.clinicName);
    await saveClinicNote(key,editingNote.text,user.name,editingNote.rmName);
    setNotes(p=>({...p,[key]:{note:editingNote.text.trim(),tlName:user.name,updatedAt:new Date().toISOString()}}));
    setEditingNote(null);
  };

  const handleStatusChange=async(rmName,clinicName,newStatus,oldStatus)=>{
    const key=clinicKey(rmName,clinicName);
    setStatuses(p=>({...p,[key]:newStatus}));
    await updateClinicStatus(rmName,clinicName,newStatus,oldStatus);
  };

  const handleFreqChange=async(r,c,newFreq)=>{
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex[c._addedIdx]={...ex[c._addedIdx],freq:newFreq};await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],freq:newFreq}}});}
  };
  const handleSlotSave=async(r,c,newSlot)=>{
    if(!newSlot.trim()){setEditingSlot(null);return;}
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex[c._addedIdx]={...ex[c._addedIdx],slot:newSlot.trim()};await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],slot:newSlot.trim()}}});}
    setEditingSlot(null);
  };
  const handleRemoveClinic=async(r,c)=>{
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex.splice(c._addedIdx,1);await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],removed:true}}});}
  };
  const handleAddClinic=async(rmName)=>{
    if(!newClinic.name.trim()||!newClinic.slot.trim())return;
    const ex=(assignments.added||{})[rmName]||[];
    await saveAssignments({...assignments,added:{...(assignments.added||{}),[rmName]:[...ex,{...newClinic,name:newClinic.name.trim(),locality:newClinic.locality.trim(),reason:newClinic.reason.trim()}]}});
    setAddingTo(null);setNewClinic({name:'',locality:'',slot:'',freq:'Daily',status:'Stable',reason:'',leads:0});
  };

  const handleShare=(r)=>{
    const clinics=getEffectiveClinics(r);
    const cluster=[...new Set(clinics.map(c=>c.locality).filter(Boolean))].join(' · ');
    const lines=[`*Route Plan — ${r.rm}*`,`TL: ${r.tl} | City: ${r.city} | Cluster: ${cluster}`,``];
    clinics.forEach(c=>{
      const leads=getLeads(r.rm,c.name)??c.leads;
      const status=getStatus(r.rm,c.name,c.status);
      lines.push(`*${c.name}* (${c.locality})`);
      lines.push(`Leads: ${leads} | ${status} | ${c.freq} | ${c.slot}`);
      if(c.reason)lines.push(c.reason);
      lines.push(``);
    });
    window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
  };

  const lastSync=_cache.route_settings?.lastSynced;
  const lastSyncStr=lastSync?new Date(lastSync).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Never synced';

  const filtered=ALL_RMS.filter(r=>!r.inactive).filter(r=>{
    if(cityF!=='All'&&r.city!==cityF)return false;
    if(tlF!=='All'&&r.tl!==tlF)return false;
    if(search&&!r.rm.toLowerCase().includes(search.toLowerCase())&&!r.clinics.some(c=>c.name.toLowerCase().includes(search.toLowerCase())))return false;
    return true;
  });

  const totalClinics=filtered.reduce((s,r)=>s+getEffectiveClinics(r).length,0);
  const cityLabel=cityF!=='All'?cityF:'All Cities';

  const fmtSlot=(slot)=>{
    if(!slot)return '—';
    const m=slot.match(/^(\d+:\d+)\s*[–—]\s*(\d+:\d+)$/);
    if(!m)return slot;
    const fmtTime=(t)=>{
      const[h,min]=t.split(':').map(Number);
      const suffix=(h>=9&&h<=11)?'AM':'PM';
      return `${h}:${min.toString().padStart(2,'0')} ${suffix}`;
    };
    return `${fmtTime(m[1])} – ${fmtTime(m[2])}`;
  };

  const renderDays=(freq)=>{
    const map={'Daily':['Mon','Tue','Wed','Thu','Fri','Sat'],'Tri-weekly':['Mon','Wed','Fri'],'Bi-weekly':['Mon','Thu'],'Weekly':['Mon']};
    const days=map[freq]||[];
    if(!days.length)return <span style={{color:B.muted,fontSize:11}}>—</span>;
    const allDays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const isRange=days.length>2&&days.every((d,i)=>i===0||allDays.indexOf(d)===allDays.indexOf(days[i-1])+1);
    if(isRange)return <span style={{background:'#F1F5F9',color:B.ink,padding:'3px 8px',borderRadius:6,fontSize:11,fontWeight:500}}>{days[0]}–{days[days.length-1]}</span>;
    return <>{days.map(d=><span key={d} style={{background:'#F1F5F9',color:B.ink,padding:'3px 7px',borderRadius:6,fontSize:11,fontWeight:500,marginRight:3}}>{d}</span>)}</>;
  };

  const freqColors={Daily:{b:'#7B1D1D',t:'#7B1D1D'},'Tri-weekly':{b:'#5B21B6',t:'#5B21B6'},'Bi-weekly':{b:'#0E7490',t:'#0E7490'},'Weekly':{b:'#065F46',t:'#065F46'}};
  const freqStyle=(freq)=>{const c=freqColors[freq]||{b:B.muted,t:B.muted};return{border:`1.5px solid ${c.b}`,color:c.t,background:'transparent',padding:'3px 10px',borderRadius:6,fontSize:11,fontWeight:600,whiteSpace:'nowrap',display:'inline-block'};};
  const ss=(status)=>({Growing:{bg:B.greenBg,c:B.green},Stable:{bg:B.blueBg,c:B.blue2},Declining:{bg:B.redBg,c:B.red}}[status]||{bg:'#F1F5F9',c:B.muted});

  return(
    <div style={{background:'#F8F9FB',minHeight:'100vh',paddingBottom:isMobile?80:20}}>
      <div style={{background:B.white,borderBottom:`1px solid ${B.line}`,padding:'20px 20px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12,marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontSize:26,fontWeight:800,color:B.ink}}>{cityLabel}</div>
            <span style={{background:B.brandLight,color:B.brand,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:'.3px'}}>
              {filtered.length} RMS · {totalClinics} CLINICS
            </span>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={handleSync} disabled={syncing}
              style={{background:syncing?B.line:B.brand,border:'none',color:'#fff',borderRadius:8,padding:'7px 14px',fontSize:12,fontWeight:600,cursor:syncing?'default':'pointer'}}>
              {syncing?'Syncing…':'↻ Sync Leads'}
            </button>
            <span style={{color:B.muted,fontSize:11}}>Last sync: {lastSyncStr}</span>
          </div>
        </div>
        {syncMsg&&<div style={{fontSize:12,color:B.green,fontWeight:600,marginBottom:8}}>{syncMsg}</div>}
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search RM or clinic..."
            style={{flex:1,minWidth:140,padding:'7px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,outline:'none'}}/>
          {[['City',['All','Pune','Mumbai','Nagpur'],cityF,setCityF],['TL',tls,tlF,setTlF]].map(([l,opts,v,s])=>(
            <select key={l} value={v} onChange={e=>s(e.target.value)} style={{padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,fontWeight:600,background:B.white,outline:'none',cursor:'pointer'}}>
              {opts.map(o=><option key={o}>{o}</option>)}
            </select>
          ))}
        </div>
      </div>

      <div style={{padding:'16px 20px'}}>
        {filtered.length===0&&(
          <div style={{textAlign:'center',padding:'48px 20px',color:B.muted}}>
            <div style={{fontSize:32,marginBottom:8}}>🗺️</div>
            <div style={{fontSize:14,fontWeight:600}}>No RMs match your filters</div>
          </div>
        )}
        {filtered.map((r,i)=>{
          const effectiveClinics=getEffectiveClinics(r);
          const cluster=[...new Set(effectiveClinics.map(c=>c.locality).filter(Boolean))].join(' · ');
          const isAdding=addingTo===r.rm;
          return(
            <div key={i} style={{background:B.white,borderRadius:16,border:`1px solid ${B.line}`,marginBottom:20,overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
              <div style={{padding:'16px 20px',display:'flex',justifyContent:'space-between',alignItems:'flex-start',borderBottom:`1px solid ${B.line}`}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <div style={{fontWeight:700,fontSize:16,color:B.ink}}>{r.rm}</div>
                    <span style={{background:'#EDE9FE',color:'#6D28D9',padding:'3px 9px',borderRadius:6,fontSize:11,fontWeight:700}}>TL: {r.tl.toUpperCase()}</span>
                  </div>
                  <div style={{fontSize:12,color:B.muted,marginTop:4}}><span style={{fontWeight:600,color:B.ink}}>Cluster:</span> {cluster||'—'}</div>
                </div>
                <button onClick={()=>handleShare(r)}
                  style={{background:'#25D366',border:'none',color:'#fff',borderRadius:10,padding:'8px 16px',fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6,flexShrink:0,marginLeft:12}}>
                  <span>📱</span> Share
                </button>
              </div>
              <div style={{overflowX:'auto'}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead>
                    <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${B.line}`}}>
                      {['CLINIC','LEADS','STATUS','DAYS','FREQUENCY','TIMESLOT','REASON'].map(h=>(
                        <th key={h} style={{padding:'10px 16px',textAlign:'left',fontSize:10,fontWeight:700,color:B.muted,textTransform:'uppercase',letterSpacing:'.6px',whiteSpace:'nowrap'}}>{h}</th>
                      ))}
                      {canEdit&&<th style={{padding:'10px 12px',width:44}}></th>}
                    </tr>
                  </thead>
                  <tbody>
                    {effectiveClinics.map((c,j)=>{
                      const noteKey=clinicKey(r.rm,c.name);
                      const cKey=getCKey(r,c);
                      const cStatus=c._added?c.status:getStatus(r.rm,c.name,c.status);
                      const cLeads=c._added?c.leads:getLeads(r.rm,c.name);
                      const displayLeads=cLeads!==null?cLeads:c.leads;
                      const note=notes[noteKey];
                      const isEditNote=editingNote&&editingNote.key===noteKey;
                      const isEditSlot=editingSlot&&editingSlot.key===cKey;
                      const st=ss(cStatus);
                      const fc=freqColors[c.freq]||{b:B.muted,t:B.muted};
                      return(
                        <React.Fragment key={j}>
                          <tr style={{borderBottom:`1px solid ${B.line}`,background:c._added?'#F0FDF4':'transparent'}}>
                            <td style={{padding:'12px 16px',verticalAlign:'top',minWidth:180}}>
                              <div style={{fontWeight:700,fontSize:13,color:B.ink}}>
                                {c.name}
                                {c._added&&<span style={{fontSize:9,background:B.greenBg,color:B.green,borderRadius:4,padding:'1px 5px',marginLeft:6,fontWeight:700}}>NEW</span>}
                              </div>
                              <div style={{fontSize:11,color:B.muted,marginTop:2}}>{c.locality}</div>
                            </td>
                            <td style={{padding:'12px 16px',verticalAlign:'top'}}>
                              <div style={{fontWeight:800,fontSize:14,color:B.ink}}>{displayLeads}</div>
                              {!c._added&&cLeads!==null&&cLeads!==c.leads&&<div style={{fontSize:10,color:B.muted,textDecoration:'line-through'}}>{c.leads}</div>}
                            </td>
                            <td style={{padding:'12px 16px',verticalAlign:'top',whiteSpace:'nowrap'}}>
                              {canEdit?(
                                <select value={cStatus} onChange={e=>handleStatusChange(r.rm,c.name,e.target.value,cStatus)}
                                  style={{background:st.bg,color:st.c,padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',border:`1px solid ${st.c}`,outline:'none',cursor:'pointer'}}>
                                  {['Growing','Stable','Declining'].map(s=><option key={s}>{s}</option>)}
                                </select>
                              ):(
                                <span style={{background:st.bg,color:st.c,padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px'}}>{cStatus}</span>
                              )}
                            </td>
                            <td style={{padding:'12px 16px',verticalAlign:'top'}}>
                              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{renderDays(c.freq)}</div>
                            </td>
                            <td style={{padding:'12px 16px',verticalAlign:'top'}}>
                              {canEdit?(
                                <select value={c.freq} onChange={e=>handleFreqChange(r,c,e.target.value)}
                                  style={{border:`1.5px solid ${fc.b}`,color:fc.t,background:B.white,padding:'3px 8px',borderRadius:6,fontSize:11,fontWeight:600,cursor:'pointer',outline:'none'}}>
                                  {FREQ_OPTS.map(f=><option key={f}>{f}</option>)}
                                </select>
                              ):(
                                <span style={freqStyle(c.freq)}>{c.freq}</span>
                              )}
                            </td>
                            <td style={{padding:'12px 16px',verticalAlign:'top'}}>
                              {canEdit&&isEditSlot?(
                                <div style={{display:'flex',gap:4,alignItems:'center'}}>
                                  <input value={editingSlot.value} onChange={e=>setEditingSlot({...editingSlot,value:e.target.value})}
                                    placeholder="11:00–1:30"
                                    style={{width:108,padding:'4px 8px',border:`1.5px solid ${B.brand}`,borderRadius:6,fontSize:11,outline:'none'}}
                                    onKeyDown={e=>{if(e.key==='Enter')handleSlotSave(r,c,editingSlot.value);if(e.key==='Escape')setEditingSlot(null);}}
                                    autoFocus/>
                                  <button onClick={()=>handleSlotSave(r,c,editingSlot.value)}
                                    style={{background:B.brand,border:'none',color:'#fff',borderRadius:5,padding:'4px 8px',fontSize:11,fontWeight:700,cursor:'pointer'}}>✓</button>
                                  <button onClick={()=>setEditingSlot(null)}
                                    style={{background:B.line,border:'none',color:B.muted,borderRadius:5,padding:'4px 6px',fontSize:11,cursor:'pointer'}}>✕</button>
                                </div>
                              ):(
                                <div style={{display:'flex',alignItems:'center',gap:5}}>
                                  <span style={{background:'#EFF6FF',color:'#1D4ED8',padding:'4px 10px',borderRadius:6,fontSize:11,fontWeight:500,whiteSpace:'nowrap'}}>{fmtSlot(c.slot)}</span>
                                  {canEdit&&<button onClick={()=>setEditingSlot({key:cKey,value:c.slot})}
                                    style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:12,padding:2,lineHeight:1,flexShrink:0}}>✏️</button>}
                                </div>
                              )}
                            </td>
                            <td style={{padding:'12px 16px',verticalAlign:'top',minWidth:220,maxWidth:300}}>
                              <div style={{fontSize:12,color:B.ink,lineHeight:1.55}}>{c.reason||'—'}</div>
                              {canEdit&&!c._added&&(
                                <button onClick={()=>setEditingNote(isEditNote?null:{key:noteKey,text:note?.note||'',rmName:r.rm,clinicName:c.name})}
                                  style={{background:'none',border:'none',color:'#D97706',fontSize:11,fontWeight:600,cursor:'pointer',padding:'3px 0 0',display:'block'}}>
                                  {note?'Edit TL note':'Add TL note'}
                                </button>
                              )}
                              {note&&!isEditNote&&(
                                <div style={{background:'#FFFBEB',border:`1px solid #FDE68A`,borderRadius:6,padding:'6px 8px',marginTop:6}}>
                                  <div style={{fontSize:9,color:'#D97706',fontWeight:700,marginBottom:2}}>NOTE FROM {note.tlName?.toUpperCase()}</div>
                                  <div style={{fontSize:11,color:B.ink,lineHeight:1.4}}>{note.note}</div>
                                </div>
                              )}
                            </td>
                            {canEdit&&(
                              <td style={{padding:'12px 10px',verticalAlign:'top',textAlign:'center'}}>
                                <button onClick={()=>handleRemoveClinic(r,c)} title="Remove from route"
                                  style={{background:'none',border:`1px solid ${B.line}`,color:B.red,borderRadius:6,padding:'4px 8px',fontSize:12,cursor:'pointer',lineHeight:1}}>✕</button>
                              </td>
                            )}
                          </tr>
                          {isEditNote&&(
                            <tr>
                              <td colSpan={canEdit?8:7} style={{padding:'12px 16px',background:B.brandLight}}>
                                <textarea value={editingNote.text} onChange={e=>setEditingNote({...editingNote,text:e.target.value})}
                                  placeholder="Write a note for the RM about this clinic…"
                                  style={{width:'100%',padding:'8px 10px',border:`1.5px solid ${B.brand}`,borderRadius:8,fontSize:12,resize:'vertical',minHeight:64,outline:'none',boxSizing:'border-box',fontFamily:'inherit',lineHeight:1.5}}/>
                                <div style={{display:'flex',gap:6,marginTop:8}}>
                                  <button onClick={handleSaveNote} style={{padding:'6px 16px',background:B.brand,color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>Save Note</button>
                                  <button onClick={()=>setEditingNote(null)} style={{padding:'6px 12px',background:B.white,color:B.muted,border:`1px solid ${B.line}`,borderRadius:8,fontSize:12,cursor:'pointer'}}>Cancel</button>
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {canEdit&&(
                <div style={{borderTop:`1px solid ${B.line}`,padding:'12px 16px'}}>
                  {!isAdding?(
                    <button onClick={()=>{setAddingTo(r.rm);setNewClinic({name:'',locality:'',slot:'',freq:'Daily',status:'Stable',reason:'',leads:0});}}
                      style={{background:'none',border:`1.5px dashed ${B.brand}`,color:B.brand,borderRadius:8,padding:'7px 16px',fontSize:12,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                      + Add Clinic
                    </button>
                  ):(
                    <div style={{background:B.brandLight,borderRadius:10,padding:'14px 16px'}}>
                      <div style={{fontWeight:700,fontSize:13,color:B.ink,marginBottom:12}}>Add Clinic to {r.rm}'s Route</div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:10}}>
                        {[['Clinic Name *','name'],['Locality / Area','locality'],['Time Slot *','slot']].map(([lbl,field])=>(
                          <div key={field}>
                            <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>{lbl}</div>
                            <input value={newClinic[field]} onChange={e=>setNewClinic(p=>({...p,[field]:e.target.value}))}
                              placeholder={field==='slot'?'11:00–1:00':field==='locality'?'e.g. Kothrud':'e.g. City Clinic'}
                              style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,outline:'none',boxSizing:'border-box'}}/>
                          </div>
                        ))}
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Frequency</div>
                          <select value={newClinic.freq} onChange={e=>setNewClinic(p=>({...p,freq:e.target.value}))}
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,background:B.white,outline:'none',cursor:'pointer'}}>
                            {FREQ_OPTS.map(f=><option key={f}>{f}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Status</div>
                          <select value={newClinic.status} onChange={e=>setNewClinic(p=>({...p,status:e.target.value}))}
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,background:B.white,outline:'none',cursor:'pointer'}}>
                            {['Growing','Stable','Declining'].map(s=><option key={s}>{s}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Reason</div>
                          <input value={newClinic.reason} onChange={e=>setNewClinic(p=>({...p,reason:e.target.value}))} placeholder="Why this clinic?"
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,outline:'none',boxSizing:'border-box'}}/>
                        </div>
                      </div>
                      <div style={{display:'flex',gap:8}}>
                        <button onClick={()=>handleAddClinic(r.rm)}
                          disabled={!newClinic.name.trim()||!newClinic.slot.trim()}
                          style={{padding:'7px 18px',background:(!newClinic.name.trim()||!newClinic.slot.trim())?B.muted:B.brand,color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700,cursor:(!newClinic.name.trim()||!newClinic.slot.trim())?'default':'pointer'}}>
                          Add Clinic
                        </button>
                        <button onClick={()=>setAddingTo(null)}
                          style={{padding:'7px 14px',background:B.white,color:B.muted,border:`1px solid ${B.line}`,borderRadius:8,fontSize:12,cursor:'pointer'}}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── ALL TEAMS ──────────────────────────────────────────────────────────────
function AllTeamsPanel(){
  const[expanded,setExpanded]=useState(null);
  const[cityF,setCityF]=useState('All');
  const[dateRange,setDateRange]=useState('This Month');
  const[customFrom,setCustomFrom]=useState('');
  const[customTo,setCustomTo]=useState('');
  const[singleDate,setSingleDate]=useState('');
  const[,_forceUpdate]=useState(0);
  const[rmSearch,setRmSearch]=useState('');
  const[selectedRM,setSelectedRM]=useState(null);
  const[showSuggestions,setShowSuggestions]=useState(false);
  const[tableView,setTableView]=useState('tl'); // 'tl' | 'rm'
  const[rmSort,setRmSort]=useState('high'); // 'high' | 'low'
  useEffect(()=>{const h=()=>_forceUpdate(v=>v+1);window.addEventListener('rmDataUpdated',h);return()=>window.removeEventListener('rmDataUpdated',h);},[]);

  const rmSuggestions=rmSearch.trim().length>0
    ?ALL_RMS.filter(r=>r.rm.toLowerCase().includes(rmSearch.toLowerCase())).slice(0,8)
    :[];
  const selectRM=(r)=>{setSelectedRM(r);setRmSearch(r.rm);setShowSuggestions(false);};
  const clearRM=()=>{setSelectedRM(null);setRmSearch('');setShowSuggestions(false);};

  const RMPaymentsPanel=({rm})=>{
    const[payRange,setPayRange]=useState('All Time');
    const[paySingle,setPaySingle]=useState('');
    const[payFrom,setPayFrom]=useState('');
    const[payTo,setPayTo]=useState('');
    const rmLo=rm.rm.toLowerCase();
    let rows=(_cache.payment_rows||[]).filter(r=>r.rm===rmLo);

// ── ADD PAYMENT MODAL ──────────────────────────────────────────────────────
function AddPaymentModal({onClose}){
  const isMobile=useIsMobile();
  const[rmName,setRmName]=useState('');
  const[isName,setIsName]=useState('');
  const[date,setDate]=useState(new Date().toISOString().split('T')[0]);
  const[amount,setAmount]=useState('');
  const[busy,setBusy]=useState(false);
  const[status,setStatus]=useState(null); // {ok,sheetOk,msg}
  const[err,setErr]=useState('');

  const selectedRM=ALL_RMS.find(r=>r.rm.toLowerCase()===rmName.toLowerCase());
  const tlName=selectedRM?.tl||'';
  const city=selectedRM?.city||'';
  const canSubmit=rmName&&date&&parseFloat(amount)>0&&!busy;

  const submit=async()=>{
    if(!canSubmit)return;
    setErr('');setBusy(true);
    const res=await submitPaymentEntry({rm:rmName,tl:tlName,city,date,amount:parseFloat(amount),is:isName.trim()});
    setBusy(false);
    if(res.ok){
      setStatus({saved:true});
      setTimeout(onClose,900);
    } else {
      setErr('Failed to save. Please try again.');
    }
  };

  const inner=(
    <div style={{padding:isMobile?'20px 20px 28px':'24px'}}>

        <div>

          <div style={{fontSize:12,color:B.muted,marginTop:2}}>Entry will sync to the Google Sheet</div>
        </div>
        <button onClick={onClose} style={{background:B.bg,border:'none',borderRadius:8,padding:'6px 10px',cursor:'pointer',fontSize:18,color:B.muted,lineHeight:1}}>✕</button>
      </div>

      {status&&(
        <div style={{background:B.greenBg,border:`1px solid ${B.green}`,borderRadius:10,padding:'10px 14px',marginBottom:16,fontSize:12,fontWeight:600,color:B.green}}>

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:B.muted,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>RM</div>
        <select value={rmName} onChange={e=>setRmName(e.target.value)}
          style={{width:'100%',padding:'11px 14px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:14,outline:'none',background:B.white,color:rmName?B.ink:B.muted,appearance:'auto'}}>
          <option value=''>Select RM…</option>
          {[...ALL_RMS].sort((a,b)=>a.rm.localeCompare(b.rm)).map(r=>(
            <option key={r.rm} value={r.rm}>{r.rm} — {r.city}</option>
          ))}
        </select>
      </div>

      {tlName&&<div style={{background:B.brandLight,borderRadius:10,padding:'8px 14px',marginBottom:14,fontSize:12,color:B.brand,fontWeight:600}}>
        TL: {tlName} · {city}
      </div>}

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:B.muted,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>IS (Inside Sales)</div>
        <input list="is-datalist" value={isName} onChange={e=>setIsName(e.target.value)}
          placeholder="Select or type IS name (optional)"
          style={{width:'100%',padding:'11px 14px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:14,outline:'none',boxSizing:'border-box'}}
          onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
        <datalist id="is-datalist">
          {[...new Set([...IS_NAMES.map(i=>i.name),...(_cache.payment_rows||[]).map(r=>r.is).filter(Boolean)])].sort().map(n=>(
            <option key={n} value={toTitleCase(n)}/>
          ))}
        </datalist>
      </div>

      <div style={{display:'flex',gap:12,marginBottom:14}}>
        <div style={{flex:1}}>
          <div style={{fontSize:11,fontWeight:700,color:B.muted,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>Payment Date</div>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)}
            style={{width:'100%',padding:'11px 14px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:14,outline:'none',boxSizing:'border-box'}}/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:11,fontWeight:700,color:B.muted,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>Amount (₹)</div>
          <input type="number" value={amount} onChange={e=>setAmount(e.target.value)}

      </div>

      {!status&&<button onClick={submit} disabled={!canSubmit}
        style={{width:'100%',padding:'14px',background:!canSubmit?B.muted:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:!canSubmit?'default':'pointer',transition:'background .15s'}}>

  return(
    <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.4)'}}/>

        {inner}
      </div>
    </div>
  );
}

// ── MONTHLY PAYMENTS CHART ─────────────────────────────────────────────────
function MonthlyPaymentsChart({rows}){
  const[groupBy,setGroupBy]=useState('auto');
  const[showAll,setShowAll]=useState(false);
  const[hov,setHov]=useState(null);

  const activeRows=showAll?(rows||[]):(()=>{
    const{from,to}=getDateRangeFromLabel('This Month');
    const toEnd=new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59,999);
    return(rows||[]).filter(r=>{const d=parsePayDate(r.date);return d&&d>=from&&d<=toEnd;});
  })();

  const buildPts=(gBy)=>{
    const map={};
    activeRows.forEach(r=>{
      const d=parsePayDate(r.date);if(!d)return;
      const yr=d.getFullYear();const mo=String(d.getMonth()+1).padStart(2,'0');const dy=String(d.getDate()).padStart(2,'0');
      let key,lbl;
      if(gBy==='month'){
        key=`${yr}-${mo}`;
        lbl=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'});
      } else {
        key=`${yr}-${mo}-${dy}`;
        lbl=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
      }
      if(!map[key])map[key]={key,rows:[],total:0,lbl};
      map[key].rows.push(r);map[key].total+=r.amount;
    });
    return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
  };

  let pts=buildPts(groupBy==='auto'?'day':groupBy);
  if(groupBy==='auto'&&pts.length>45)pts=buildPts('month');

  const datedCount=activeRows.filter(r=>parsePayDate(r.date)).length;
  const grandTotal=activeRows.reduce((s,r)=>s+r.amount,0);

  if(pts.length===0)return(
    <div style={{background:B.white,borderRadius:16,border:`1px solid ${B.line}`,padding:'40px 24px',textAlign:'center',color:B.muted}}>
      <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>No payments this month yet</div>
      <div style={{fontSize:12}}>{activeRows.length} payment rows · Run a sync to load data.{!showAll&&<span> <button onClick={()=>setShowAll(true)} style={{background:'none',border:'none',color:B.brand,cursor:'pointer',fontSize:12,fontWeight:600,textDecoration:'underline'}}>Show all time</button></span>}</div>
    </div>
  );

  const maxVal=Math.max(...pts.map(p=>p.total),1);
  const PL=54,PR=20,PT=20,PB=50;
  const CW=Math.max(600,pts.length*54);
  const CH=220;
  const svgW=PL+CW+PR;const svgH=PT+CH+PB;
  const px=(i)=>PL+(pts.length>1?i/(pts.length-1):0.5)*CW;
  const py=(v)=>PT+CH-(v/maxVal)*CH;

  const linePts=pts.map((p,i)=>`${px(i)},${py(p.total)}`).join(' ');
  const areaPath=`M ${px(0)},${PT+CH} ${pts.map((p,i)=>`L ${px(i)},${py(p.total)}`).join(' ')} L ${px(pts.length-1)},${PT+CH} Z`;

  const step=Math.max(1,Math.ceil(pts.length/10));
  const hM=hov?pts.find(p=>p.key===hov.key):null;

  return(
    <div style={{background:B.white,borderRadius:16,border:`1px solid ${B.line}`,padding:'20px 20px 12px',position:'relative'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:B.navy}}>Payments — {showAll?'All Time':'This Month'}</div>
          <div style={{fontSize:11,color:B.muted,marginTop:2}}>{datedCount} payments · Total {fmtN(grandTotal)}</div>
        </div>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          <button onClick={()=>setShowAll(s=>!s)}
            style={{padding:'5px 12px',borderRadius:8,border:`1.5px solid ${B.brand}`,background:showAll?B.white:B.brand,color:showAll?B.brand:'#fff',fontSize:11,fontWeight:600,cursor:'pointer'}}>
            {showAll?'This Month':'All Time'}
          </button>
          {[['auto','Auto'],['day','Daily'],['month','Monthly']].map(([id,lbl])=>(
            <button key={id} onClick={()=>setGroupBy(id)}

          ))}
        </div>
      </div>

      <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
        <svg width={svgW} height={svgH} style={{display:'block',overflow:'visible'}}>
          <defs>
            <linearGradient id="payGrad" x1="0" y1="0" x2="0" y2="1">

              <stop offset="100%" stopColor={B.brand} stopOpacity={0.01}/>
            </linearGradient>
          </defs>
          {/* Y-axis grid + labels */}
          {[0,0.25,0.5,0.75,1].map(f=>{
            const y=PT+CH*(1-f);const v=maxVal*f;
            return <g key={f}>
              <line x1={PL} y1={y} x2={PL+CW} y2={y} stroke={f===0?'#CBD5E1':'#EFF2F7'} strokeWidth={1}/>
              <text x={PL-6} y={y+4} textAnchor='end' fontSize={9} fill={B.muted}>
                {v===0?'0':v>=100000?(v/100000).toFixed(1)+'L':v>=1000?Math.round(v/1000)+'K':v}
              </text>
            </g>;
          })}
          {/* Area fill */}
          {pts.length>1&&<path d={areaPath} fill='url(#payGrad)'/>}
          {/* Line */}
          {pts.length>1&&<polyline points={linePts} fill='none' stroke={B.brand} strokeWidth={2.5} strokeLinejoin='round' strokeLinecap='round'/>}
          {/* X labels */}
          {pts.map((p,i)=>{
            if(pts.length>1&&i%step!==0&&i!==pts.length-1)return null;
            const x=px(i);const isH=hov?.key===p.key;
            return(
              <text key={p.key} x={x} y={PT+CH+16} textAnchor='middle' fontSize={10}
                fill={isH?B.brand:B.muted} fontWeight={isH?700:400}
                transform={pts.length>10?`rotate(-35,${x},${PT+CH+16})`:undefined}>
                {p.lbl}
              </text>
            );
          })}
          {/* Hit zones + dots */}
          {pts.map((p,i)=>{
            const x=px(i);const y=py(p.total);const isH=hov?.key===p.key;
            return(
              <g key={p.key}>
                <rect x={x-16} y={PT} width={32} height={CH+16} fill='transparent' style={{cursor:'pointer'}}
                  onMouseEnter={e=>setHov({key:p.key,x:e.clientX,y:e.clientY})}
                  onMouseMove={e=>setHov(s=>s?{...s,x:e.clientX,y:e.clientY}:null)}
                  onMouseLeave={()=>setHov(null)}/>
                {isH&&<line x1={x} y1={PT} x2={x} y2={PT+CH} stroke={B.brand} strokeWidth={1} strokeDasharray='4,3'/>}
                <circle cx={x} cy={y} r={isH?6:3.5} fill={isH?B.brand:'#fff'} stroke={B.brand} strokeWidth={2} style={{pointerEvents:'none'}}/>
              </g>
            );
          })}
        </svg>
      </div>

      {hov&&hM&&(
        <div style={{position:'fixed',left:hov.x+16,top:hov.y,background:B.navy,color:'#fff',borderRadius:12,padding:'12px 16px',fontSize:12,zIndex:9999,boxShadow:'0 6px 24px rgba(0,0,0,.25)',minWidth:220,maxWidth:280,pointerEvents:'none',transform:'translateY(-50%)'}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>{hM.lbl}</div>
          <div style={{fontWeight:800,fontSize:19,color:'#93C5FD',marginBottom:2}}>{fmtN(hM.total)}</div>
          <div style={{color:'rgba(255,255,255,.5)',fontSize:11,marginBottom:8}}>{hM.rows.length} payment{hM.rows.length!==1?'s':''}</div>
          <div style={{borderTop:'1px solid rgba(255,255,255,.1)',paddingTop:8}}>
            {hM.rows.slice(0,6).map((r,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,marginBottom:3}}>
                <div style={{color:'rgba(255,255,255,.7)',fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:140}}>{r.rm||'—'}</div>
                <div style={{fontSize:11,fontWeight:700,flexShrink:0}}>{fmtN(r.amount)}</div>
              </div>
            ))}
            {hM.rows.length>6&&<div style={{color:'rgba(255,255,255,.4)',fontSize:10,marginTop:3}}>+{hM.rows.length-6} more</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// ── USERS TAB (inside Admin) ───────────────────────────────────────────────
function UsersTab(){
  const[users,setUsers]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[newUser,setNewUser]=useState({name:'',email:'',password:'',role:'rm',tl:'',city:'Pune'});
  const[status,setStatus]=useState('');
  const[userSearch,setUserSearch]=useState('');
  const[bulkBusy,setBulkBusy]=useState(false);
  const[bulkLog,setBulkLog]=useState([]);
  const[showBulkLog,setShowBulkLog]=useState(false);

  const tls=ZONE.tls.map(t=>t.name);
  const rmNames=ALL_RMS.map(r=>r.rm).sort();
  const ROLES=[{v:'rm',l:'RM — Relationship Manager'},{v:'tl',l:'TL — Team Leader'},{v:'is',l:'IS — Inside Sales'},{v:'is_tl',l:'IS TL — Inside Sales Team Lead'},{v:'zonal',l:'Zonal Head'},{v:'admin',l:'Admin'}];

  useEffect(()=>{
    db.collection('users').get()
      .then(snap=>{setUsers(snap.docs.map(d=>({id:d.id,...d.data()})));})
      .catch(()=>setStatus('Could not load users'))
      .finally(()=>setLoading(false));
  },[]);

  const addUser=async()=>{
    if(!newUser.name.trim()||!newUser.email.trim()||newUser.password.length<6){
      setStatus('Fill all fields. Password must be 6+ characters.');return;
    }
    setStatus('Creating account…');
    try{
      // Use secondary Firebase app instance so we don't log out the admin
      const secondary=firebase.initializeApp(firebaseConfig,'_secondary_'+Date.now());
      const secAuth=secondary.auth();
      const cred=await secAuth.createUserWithEmailAndPassword(newUser.email.trim(),newUser.password);
      const uid=cred.user.uid;
      const userData={name:newUser.name.trim(),email:newUser.email.trim().toLowerCase(),role:newUser.role,
        ...(newUser.role==='rm'||newUser.role==='tl'?{tl:newUser.tl,city:newUser.city}:{}),
        mustChangePassword:true,createdAt:new Date().toISOString()};
      // IS names stored lowercase to match payment_rows
      if(newUser.role==='is')userData.name=newUser.name.trim().toLowerCase();
      await db.collection('users').doc(uid).set(userData);
      await secAuth.signOut();
      await secondary.delete();
      setUsers(prev=>[...prev,{id:uid,...userData}]);
      setNewUser({name:'',email:'',password:'',role:'rm',tl:'',city:'Pune'});
      setShowAdd(false);
      setStatus('✅ Account created! They can now log in at even-pay-routeplan.vercel.app');
      setTimeout(()=>setStatus(''),6000);
    }catch(e){
      const msgs={'auth/email-already-in-use':'This email already has an account.','auth/invalid-email':'Invalid email address.','auth/weak-password':'Password too weak (6+ chars).'};
      setStatus('❌ '+(msgs[e.code]||e.message));
    }
  };

  const changeRole=async(uid,newRole)=>{
    await db.collection('users').doc(uid).update({role:newRole});
    setUsers(prev=>prev.map(u=>u.id===uid?{...u,role:newRole}:u));
    setStatus('✅ Role updated');setTimeout(()=>setStatus(''),3000);
  };

  const resetPassword=async(email)=>{
    try{
      await auth.sendPasswordResetEmail(email);
      setStatus('✅ Reset link sent to '+email+' — tell them to check Spam / Junk if it doesn\'t arrive.');
    }catch(e){
      const msgs={'auth/user-not-found':'No account found for '+email,'auth/invalid-email':'Invalid email address'};
      setStatus('❌ '+(msgs[e.code]||'Could not send reset email'));
    }
    setTimeout(()=>setStatus(''),9000);
  };

  const removeUser=async(uid,name)=>{
    if(!window.confirm(`Remove ${name}'s access? They won't be able to log in.`))return;
    await db.collection('users').doc(uid).delete();
    setUsers(prev=>prev.filter(u=>u.id!==uid));
    setStatus('✅ Access removed');setTimeout(()=>setStatus(''),3000);
  };

  const BULK_PASSWORD='Even@1234';
  const bulkCreate=async()=>{
    if(!window.confirm(`Create accounts for all TLs and RMs?\n\nEmail: firstname@even.in\nPassword: ${BULK_PASSWORD}\n\nExisting accounts will be skipped.`))return;
    setBulkBusy(true);setShowBulkLog(true);
    const log=[];
    const addLog=(name,email,status,msg)=>{log.push({name,email,status,msg});setBulkLog([...log]);};
    const existingEmails=new Set(users.map(u=>u.email?.toLowerCase()));
    const usedEmails=new Set();
    const toCreate=[];
    for(const tl of ZONE.tls){
      const fn=tl.name.trim().split(/\s+/)[0].toLowerCase();
      toCreate.push({name:tl.name,email:`${fn}@even.in`,role:'tl',tl:tl.name,city:'Pune'});
    }
    for(const rm of ALL_RMS){
      const fn=rm.rm.trim().split(/\s+/)[0].toLowerCase();
      toCreate.push({name:rm.rm,email:`${fn}@even.in`,role:'rm',tl:rm.tl,city:rm.city||'Pune'});
    }
    for(const p of toCreate){
      const emailLo=p.email.toLowerCase();
      if(existingEmails.has(emailLo)){addLog(p.name,p.email,'skip','Already has account');continue;}
      if(usedEmails.has(emailLo)){addLog(p.name,p.email,'skip','Email conflict — create manually with full name');continue;}
      usedEmails.add(emailLo);
      try{
        const secondary=firebase.initializeApp(firebaseConfig,'_bulk_'+Date.now());
        const secAuth=secondary.auth();
        const cred=await secAuth.createUserWithEmailAndPassword(p.email,BULK_PASSWORD);
        const uid=cred.user.uid;
        const userData={name:p.name,email:emailLo,role:p.role,tl:p.tl,city:p.city,mustChangePassword:true,createdAt:new Date().toISOString()};
        await db.collection('users').doc(uid).set(userData);
        await secAuth.signOut();await secondary.delete();
        setUsers(prev=>[...prev,{id:uid,...userData}]);
        existingEmails.add(emailLo);
        addLog(p.name,p.email,'ok','Created');
      }catch(e){
        if(e.code==='auth/email-already-in-use'){existingEmails.add(emailLo);addLog(p.name,p.email,'skip','Already has account');}
        else addLog(p.name,p.email,'err',e.message);
      }
    }
    setBulkBusy(false);
  };

  const IS_PASSWORD='Even@1234';
  const bulkCreateIS=async()=>{
    if(!window.confirm(`Create accounts for all 22 IS people?\n\nPassword: ${IS_PASSWORD}\n\nExisting accounts will be skipped.`))return;
    setBulkBusy(true);setShowBulkLog(true);
    const log=[];
    const addLog=(name,email,st,msg)=>{log.push({name,email,status:st,msg});setBulkLog([...log]);};
    const existingEmails=new Set(users.map(u=>u.email?.toLowerCase()));
    for(const p of IS_NAMES){
      const emailLo=p.email.toLowerCase();
      if(existingEmails.has(emailLo)){addLog(toTitleCase(p.name),p.email,'skip','Already has account');continue;}
      try{
        const secondary=firebase.initializeApp(firebaseConfig,'_is_'+Date.now());
        const secAuth=secondary.auth();
        const cred=await secAuth.createUserWithEmailAndPassword(emailLo,IS_PASSWORD);
        const uid=cred.user.uid;
        const userData={name:p.name,email:emailLo,role:'is',mustChangePassword:true,createdAt:new Date().toISOString()};
        await db.collection('users').doc(uid).set(userData);
        await secAuth.signOut();await secondary.delete();
        setUsers(prev=>[...prev,{id:uid,...userData}]);
        existingEmails.add(emailLo);
        addLog(toTitleCase(p.name),p.email,'ok','Created');
      }catch(e){
        if(e.code==='auth/email-already-in-use'){existingEmails.add(emailLo);addLog(toTitleCase(p.name),p.email,'skip','Already has account');}
        else addLog(toTitleCase(p.name),p.email,'err',e.message);
      }
    }
    setBulkBusy(false);
  };

  const inp=(val,set,ph,type='text')=><input value={val} onChange={e=>set(e.target.value)} placeholder={ph} type={type}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>;

  const selEl=(val,set,opts)=><select value={val} onChange={e=>set(e.target.value)}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
    {opts.map(o=>typeof o==='string'?<option key={o}>{o}</option>:<option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;

  const filtered=users.filter(u=>!userSearch||u.name?.toLowerCase().includes(userSearch.toLowerCase())||u.email?.toLowerCase().includes(userSearch.toLowerCase()));

// ── PAYMENTS ADMIN TAB ─────────────────────────────────────────────────────
function PaymentsAdminTab(){
  const[pending,setPending]=useState([..._pendingPayments]);
  const[retrying,setRetrying]=useState({});
  const[gasCode]=useState(`// Paste this inside your doPost(e) function in Apps Script
// -------------------------------------------------------
function doPost(e) {
  var data = JSON.parse(e.postData.contents);

  if (data.action === 'addPayment') {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName('Payments'); // change if different
    var headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    var colDate   = headers.indexOf('Date') + 1;
    var colRM     = headers.indexOf('RM Name') + 1;
    var colTL     = headers.indexOf('TL Name') + 1;
    var colCity   = headers.indexOf('City') + 1;
    var colAmt    = headers.indexOf('Amount') + 1;
    var row = new Array(sheet.getLastColumn()).fill('');
    row[colDate - 1]  = data.date;
    row[colRM - 1]    = data.rm_name;
    row[colTL - 1]    = data.tl_name;
    row[colCity - 1]  = data.city;
    row[colAmt - 1]   = data.amount;
    sheet.appendRow(row);
    return ContentService
      .createTextOutput(JSON.stringify({status:'ok'}))
      .setMimeType(ContentService.MimeType.JSON);
  }

  // ... your existing doGet / other handlers below
}`);

  const[copied,setCopied]=useState(false);

  function copyCode(){
    navigator.clipboard.writeText(gasCode).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  }

  async function retryOne(p){
    setRetrying(r=>({...r,[p._pid]:true}));
    const rmData=ALL_RMS.find(r=>r.rm.toLowerCase()===(p.rm||'').toLowerCase());
    const res=await submitPaymentEntry({
      rm:toTitleCase(p.rmDisplay||p.rm),
      tl:toTitleCase(p.tlDisplay||p.tl),
      city:toTitleCase(p.city||rmData?.city||''),
      is:p.is||'',
      date:(()=>{const[d,m,y]=p.date.split('/');return`${y}-${m}-${d}`;})(),
      amount:p.amount
    });
    setPending([..._pendingPayments]);
    setRetrying(r=>({...r,[p._pid]:false}));
  }

  return(
    <div style={{display:'flex',flexDirection:'column',gap:20}}>

      {/* Pending payments */}
      <Card>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:15,color:B.ink}}>Pending Payments</div>
          {pending.length>0&&<span style={{background:B.amber,color:'#fff',borderRadius:10,fontSize:11,fontWeight:800,padding:'2px 8px'}}>{pending.length} pending</span>}
        </div>
        {pending.length===0
          ?<div style={{fontSize:13,color:B.muted,padding:'12px 0'}}>No pending payments — all entries have synced to the sheet.</div>
          :<div style={{display:'flex',flexDirection:'column',gap:8}}>
            {pending.map(p=>(
              <div key={p._pid} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:B.bg,borderRadius:10,gap:12,flexWrap:'wrap'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:B.ink}}>{toTitleCase(p.rmDisplay||p.rm)} <span style={{color:B.muted,fontWeight:500}}>({toTitleCase(p.tlDisplay||p.tl)})</span></div>
                  <div style={{fontSize:12,color:B.muted,marginTop:2}}>{p.date} · ₹{Number(p.amount).toLocaleString('en-IN')}{p.is&&<> · IS: {p.is}</>}</div>
                </div>
                <div style={{display:'flex',gap:8,flexShrink:0}}>
                  <button onClick={()=>retryOne(p)} disabled={retrying[p._pid]}
                    style={{padding:'7px 16px',background:retrying[p._pid]?B.muted:B.brand,color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700,cursor:retrying[p._pid]?'default':'pointer'}}>
                    {retrying[p._pid]?'Retrying…':'Retry sync'}
                  </button>
                  <button onClick={async()=>{await deletePending(p._pid);setPending([..._pendingPayments]);}}
                    style={{padding:'7px 12px',background:'none',border:`1px solid ${B.red}`,color:B.red,borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>
                    Delete
                  </button>
                </div>
              </div>
            ))}
          </div>
        }
      </Card>

      {/* GAS setup */}
      <Card>
        <div style={{fontWeight:700,fontSize:15,color:B.ink,marginBottom:4}}>Google Apps Script Setup</div>
        <div style={{fontSize:13,color:B.muted,marginBottom:16,lineHeight:1.6}}>
          To write payments directly from the app to your sheet, add the code below to your Google Apps Script project, then <strong>re-deploy as a new version</strong> (Deploy → Manage deployments → New version).
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:B.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Steps</div>
          {[
            'Open your Apps Script project (Extensions → Apps Script in the sheet)',
            'Find your existing doPost(e) function',
            'Paste the code below at the top of that function (before the return)',
            'Save → Deploy → Manage deployments → select existing deployment → New version',
            'Copy the deployment URL and make sure SHEET_SCRIPT_URL in index.html matches it',
          ].map((s,i)=>(
            <div key={i} style={{display:'flex',gap:10,marginBottom:8,alignItems:'flex-start'}}>
              <span style={{width:22,height:22,borderRadius:'50%',background:B.brand,color:'#fff',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{i+1}</span>
              <div style={{fontSize:13,color:B.ink,lineHeight:1.5}}>{s}</div>
            </div>
          ))}
        </div>
        <div style={{position:'relative'}}>
          <pre style={{background:'#1E1B4B',color:'#E2E8F0',borderRadius:12,padding:'16px',fontSize:11,overflowX:'auto',lineHeight:1.6,margin:0,fontFamily:'monospace',whiteSpace:'pre'}}>
            {gasCode}
          </pre>
          <button onClick={copyCode}
            style={{position:'absolute',top:10,right:10,padding:'5px 12px',background:copied?B.green:'rgba(255,255,255,.12)',color:'#fff',border:'1px solid rgba(255,255,255,.2)',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer',backdropFilter:'blur(4px)'}}>
            {copied?'Copied!':'Copy'}
          </button>
        </div>
        <div style={{marginTop:12,padding:'10px 14px',background:'#FFFBEB',border:'1px solid #FCD34D',borderRadius:10,fontSize:12,color:'#92400E',lineHeight:1.5}}>
          <strong>Column names:</strong> The code detects columns by header name. Make sure your sheet has headers named exactly: <code>Date</code>, <code>RM Name</code>, <code>TL Name</code>, <code>City</code>, <code>Amount</code>. Change the <code>getSheetByName('Payments')</code> call if your sheet tab has a different name.
        </div>
      </Card>

    </div>
  );
}

  // ── Clinic management state ──

    const key=safeKey(`${selectedTL}|${selectedRM}`);
    const curMK=new Date().toISOString().slice(0,7);
    const entry={tl:selectedTL,rm:selectedRM,city:workingRMs.find(r=>r.rm===selectedRM)?.city||'',
      ...Object.fromEntries(Object.entries(form).map(([k,v])=>[k,parseFloat(v)||0])),
      targetMonth:curMK,manuallySet:true,
      updated:new Date().toLocaleString('en-IN'),updatedAt:Date.now()};
    const newT={..._cache.targets,[key]:entry};
    // Also record in manual_targets — a separate config doc the sync never touches
    _cache.manual_targets={..._cache.manual_targets,[key]:{target:entry.target,targetMonth:curMK,tl:selectedTL,rm:selectedRM}};
    await Promise.all([
      saveStore(newT),
      db.collection('config').doc('manual_targets').set(_cache.manual_targets).catch(()=>{}),
    ]);
    setTargets(newT);
    applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
    setSaving('✅ Saved to Firebase!');
    setTimeout(()=>setSaving(''),3000);
  };

  const parseBulk=()=>{
    const lines=bulkText.trim().split('\n').map(l=>l.trimEnd()).filter(l=>l);
    const hi=lines.findIndex(l=>/rm.?name/i.test(l)&&/tl/i.test(l));
    if(hi===-1){setBulkRows([]);return;}
    const headers=lines[hi].split('\t').map(h=>h.trim().toLowerCase().replace(/[₹()\s]+/g,' ').trim());
    const ci=name=>headers.findIndex(h=>h.includes(name));
    const rmC=ci('rm name'),tlC=ci('tl'),cityC=ci('city'),tgtC=ci('target');
    if(rmC===-1||tlC===-1||tgtC===-1){setBulkRows([]);return;}
    const rows=[];
    for(let i=hi+1;i<lines.length;i++){
      const cols=lines[i].split('\t');
      const rm=(cols[rmC]||'').trim(),tl=(cols[tlC]||'').trim();
      const city=cityC>=0?(cols[cityC]||'').trim():'';
      const target=parseInt((cols[tgtC]||'').replace(/[₹,\s]/g,''))||0;
      if(!rm||!tl||!target)continue;
      const key=safeKey(`${tl}|${rm}`);
      const inSystem=!!ALL_RMS.find(r=>r.rm.toLowerCase()===rm.toLowerCase()&&r.tl.toLowerCase()===tl.toLowerCase());
      const hasEntry=!!(_cache.targets[key]);
      const fuzzyMatch=inSystem?null:bestFuzzyRM(rm,tl);
      rows.push({rm,tl,city,target,key,inSystem,hasEntry,fuzzyMatch});
    }
    setBulkRows(rows);
  };

  const acceptFuzzy=i=>{
    const row=bulkRows[i];
    if(!row.fuzzyMatch)return;
    const{rm,tl,city}=row.fuzzyMatch;
    const key=safeKey(`${tl}|${rm}`);
    const hasEntry=!!(_cache.targets[key]);
    setBulkRows(bulkRows.map((r,idx)=>idx===i?{...r,rm,tl,city:city||r.city,key,inSystem:true,hasEntry,fuzzyMatch:null,fuzzyAccepted:true}:r));
  };

  const saveBulk=async()=>{
    const toSave=bulkRows.filter(r=>r.inSystem);
    if(!toSave.length)return;
    setBulkSaving('Saving…');
    const curMK=new Date().toISOString().slice(0,7);
    await Promise.all(toSave.map(row=>{
      const existing=_cache.targets[row.key]||{};
      const entry={...existing,tl:row.tl,rm:row.rm,city:row.city||existing.city||'',
        target:row.target,targetMonth:curMK,
        updated:new Date().toLocaleString('en-IN'),updatedAt:Date.now()};
      return db.collection('targets').doc(row.key).set(entry,{merge:true}).then(()=>{_cache.targets[row.key]=entry;});
    }));
    applyStoreToRMs();
    window.dispatchEvent(new Event('rmDataUpdated'));
    setTargets(loadStore());
    const skipped=bulkRows.length-toSave.length;
    setBulkSaving(`✅ ${toSave.length} saved${skipped?`, ${skipped} skipped`:''}!`);
    setBulkRows(null);setBulkText('');
    setTimeout(()=>{setBulkSaving('');setBulkOpen(false);},3000);
  };

    await db.collection('targets').doc(key).set(doc);
    _cache.targets[key]=doc;
  };

  const handleEditRM=async()=>{
    if(!editRM)return;
    const newName=(editRM.rmName||'').trim();
    if(!newName){setRmSaving('Name cannot be empty');return;}
    setRmSaving('Saving…');
    try{
      const oldRM=workingRMs[editRM.index];
      const oldKey=safeKey(`${oldRM.tl}|${oldRM.rm}`);
      const newKey=safeKey(`${editRM.tl}|${newName}`);
      const existingData=_cache.targets[oldKey]||{};
      // Delete old doc if key changed (name or TL changed)
      if(oldKey!==newKey){
        await db.collection('targets').doc(oldKey).delete();
        delete _cache.targets[oldKey];
      }
      await saveRMDoc(editRM.tl,newName,{city:editRM.city,netAchieved:existingData.netAchieved||0,target:existingData.target||0,targetMonth:existingData.targetMonth||'',monthlyLeads:existingData.monthlyLeads||0,clinics:existingData.clinics||[]});
      applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
      const updated=workingRMs.map((r,i)=>i===editRM.index?{...r,rm:newName,tl:editRM.tl,city:editRM.city}:r);
      setWorkingRMs(updated);
      setEditRM(null);

    if(!window.confirm(`Remove ${rm.rm} from the system? This cannot be undone.`))return;
    const key=safeKey(`${rm.tl}|${rm.rm}`);
    await db.collection('targets').doc(key).delete().catch(()=>{});
    delete _cache.targets[key];
    // Record removal so sheet syncs don't re-add this RM
    _cache.removed_rms={..._cache.removed_rms,[key]:{tl:rm.tl,rm:rm.rm,removedAt:Date.now()}};
    await db.collection('config').doc('removed_rms').set(_cache.removed_rms).catch(()=>{});
    const idx=ALL_RMS.findIndex(r=>safeKey(`${r.tl}|${r.rm}`)===key);
    if(idx>=0)ALL_RMS.splice(idx,1);
    applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
    setWorkingRMs(workingRMs.filter((_,i)=>i!==index));

    if(!newRMObj)return;
    setClinicSaving('Saving…');
    try{
      const clinicData={name:flat.name,locality:flat.locality||'',status:flat.status,freq:flat.freq,slot:flat.slot||'',leads:flat.leads||0};
      // Remove from old RM's doc
      const oldRMObj=workingRMs.find(r=>r.rm===flat.rm);
      if(oldRMObj){
        const oldKey=safeKey(`${oldRMObj.tl}|${oldRMObj.rm}`);
        const oldClinics=(_cache.targets[oldKey]?.clinics||[]).filter(c=>c.name!==flat.name);
        await saveClinicList(oldRMObj.tl,oldRMObj.rm,oldClinics);

      // Add to new RM's doc
      const newKey=safeKey(`${newRMObj.tl}|${newRMObj.rm}`);

              <button onClick={saveTargets} style={{padding:'11px 24px',background:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>💾 Save to Firebase</button>
              {saving&&<span style={{fontSize:13,color:saving.includes('✅')?B.green:B.muted,fontWeight:600}}>{saving}</span>}

        {/* ── BULK UPLOAD CARD ── */}

              {bulkOpen?'Close':'Upload from Sheet'}
            </button>
          </div>
          {bulkOpen&&<>
            <div style={{fontSize:12,color:B.muted,margin:'10px 0 8px'}}>
              Select all rows in your Google Sheet (including the header row) and paste below. Needs columns: <strong>RM Name, TL / ATL, City, Target (₹)</strong>
            </div>
            <textarea value={bulkText} onChange={e=>{setBulkText(e.target.value);setBulkRows(null);}}
              placeholder="Paste from Google Sheets here…"
              style={{width:'100%',height:130,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:12,resize:'vertical',boxSizing:'border-box',fontFamily:'monospace',outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,marginTop:8,alignItems:'center'}}>
              <button onClick={parseBulk} style={{padding:'9px 20px',background:B.navy,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>Preview</button>
              {bulkSaving&&<span style={{fontSize:13,color:bulkSaving.includes('✅')?B.green:B.muted,fontWeight:600}}>{bulkSaving}</span>}
            </div>
            {bulkRows!==null&&(bulkRows.length===0
              ?<div style={{marginTop:12,color:B.red,fontSize:13}}>Could not parse. Make sure the header row is included with columns: RM Name, TL / ATL, City, Target (₹).</div>
              :<>
                <div style={{overflowX:'auto',marginTop:14}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                    <thead><tr style={{background:B.navy,color:'#fff'}}>
                      {['RM Name','TL','City','Target (₹)','Status'].map((h,i)=><th key={i} style={{padding:'8px 12px',textAlign:i===3?'right':'left',fontWeight:700}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {bulkRows.map((r,i)=>(
                        <tr key={i} style={{borderBottom:`1px solid ${B.line}`,background:i%2===0?B.white:B.bg}}>
                          <td style={{padding:'8px 12px',fontWeight:600}}>{r.rm}</td>
                          <td style={{padding:'8px 12px',color:B.muted}}>{r.tl}</td>
                          <td style={{padding:'8px 12px',color:B.muted}}>{r.city}</td>
                          <td style={{padding:'8px 12px',textAlign:'right',fontWeight:700}}>{Number(r.target).toLocaleString('en-IN')}</td>
                          <td style={{padding:'8px 12px',minWidth:180}}>
                            {r.inSystem
                              ?<span style={{background:B.greenBg,color:B.green,borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:700}}>{r.hasEntry?'Update':'New'}{r.fuzzyAccepted?' (matched)':''}</span>
                              :r.fuzzyMatch
                                ?<div>
                                   <div style={{marginBottom:4}}><span style={{background:B.amberBg,color:B.amber,borderRadius:20,padding:'3px 8px',fontSize:11,fontWeight:700}}>No exact match</span></div>
                                   <div style={{fontSize:11,color:B.muted,marginBottom:5}}>Did you mean <strong style={{color:B.ink}}>{r.fuzzyMatch.rm}</strong> ({r.fuzzyMatch.tl})?</div>
                                   <button onClick={()=>acceptFuzzy(i)} style={{padding:'4px 12px',background:B.brand,color:'#fff',border:'none',borderRadius:8,fontSize:11,fontWeight:700,cursor:'pointer'}}>Use this</button>
                                 </div>
                                :<span style={{background:B.redBg,color:B.red,borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:700}}>Not found — skip</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{display:'flex',gap:10,marginTop:12,alignItems:'center',flexWrap:'wrap'}}>
                  <button onClick={saveBulk} style={{padding:'10px 24px',background:B.green,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>
                    Save {bulkRows.filter(r=>r.inSystem).length} targets to Firebase
                  </button>
                  <span style={{fontSize:12,color:B.muted}}>
                    {new Date().toLocaleString('en-IN',{month:'long',year:'numeric'})}
                    {bulkRows.some(r=>!r.inSystem)&&` · ${bulkRows.filter(r=>!r.inSystem).length} unmatched will be skipped`}
                  </span>
                </div>
              </>
            )}
          </>}
        </Card>}

        {/* ── RMs & TLs TAB ── */}
        {adminTab==='rms'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <input value={rmSearch} onChange={e=>setRmSearch(e.target.value)} placeholder="🔍 Search RM or TL…"
              style={{flex:1,maxWidth:300,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {rmSaving&&<span style={{fontSize:13,color:rmSaving.includes('✅')?B.green:B.red,fontWeight:600}}>{rmSaving}</span>}
              <button onClick={()=>setShowAddRM(!showAddRM)}
                style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                + Add New RM
              </button>
            </div>
          </div>

          {/* Add RM form */}
          {showAddRM&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.brand}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.brand,marginBottom:12}}>Add New RM</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>RM Name *</div>{inp(newRM.rm,v=>setNewRM({...newRM,rm:v}),'e.g. Rohan Sharma')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Assign TL *</div>
                {sel(newRM.tl,v=>setNewRM({...newRM,tl:v}),[{v:'',l:'Select TL…'},...workingTLs])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
                {sel(newRM.city,v=>setNewRM({...newRM,city:v}),['Pune','Mumbai','Nagpur'])}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleAddRM} style={{padding:'9px 20px',background:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Add RM</button>
              <button onClick={()=>{setShowAddRM(false);setNewRM({rm:'',tl:'',city:'Pune'});}} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* Edit RM modal */}
          {editRM&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.amber}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.amber,marginBottom:12}}>Edit RM: {editRM.rm}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Name</div>
                {inp(editRM.rmName,v=>setEditRM({...editRM,rmName:v}),'RM full name')}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Reassign to TL</div>
                {sel(editRM.tl,v=>setEditRM({...editRM,tl:v}),workingTLs)}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
                {sel(editRM.city,v=>setEditRM({...editRM,city:v}),['Pune','Mumbai','Nagpur'])}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleEditRM} style={{padding:'9px 20px',background:B.amber,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Save Changes</button>
              <button onClick={()=>setEditRM(null)} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* RM Table */}
          <div className="tbl-wrap">
            <table className="dt">

                  <tr key={i} style={{opacity:r.inactive?0.5:1}}>
                    <td><strong>{r.rm}</strong>{r.inactive&&<span style={{marginLeft:6,fontSize:10,background:'#FEE2E2',color:B.red,borderRadius:4,padding:'1px 6px',fontWeight:700}}>INACTIVE</span>}</td>
                    <td>{r.tl}</td>
                    <td>{r.city}</td>
                    <td className="num">{r.clinics?.length||0}</td>
                    <td className="num">{r.leads||0}</td>
                    <td>
                      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                        <button onClick={()=>setEditRM({index:i,rm:r.rm,rmName:r.rm,tl:r.tl,city:r.city})}
                          style={{padding:'5px 12px',background:B.brandLight,color:B.brand,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                          ✏️ Edit
                        </button>
                        <button onClick={()=>toggleInactive(r)}
                          style={{padding:'5px 12px',background:r.inactive?'#F0FDF4':B.amberBg,color:r.inactive?B.green:B.amber,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                          {r.inactive?'✓ Reactivate':'⏸ Inactive'}
                        </button>
                        <button onClick={()=>handleRemoveRM(i)}
                          style={{padding:'5px 12px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                          🗑️ Remove
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:B.muted,marginTop:10}}>Showing {filteredRMs.length} of {workingRMs.length} RMs</div>
        </div>}

        {/* ── CLINICS TAB ── */}
        {adminTab==='clinics'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <input value={clinicSearch} onChange={e=>setClinicSearch(e.target.value)} placeholder="🔍 Search clinic or RM…"
              style={{flex:1,maxWidth:300,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {clinicSaving&&<span style={{fontSize:13,color:clinicSaving.includes('✅')?B.green:B.red,fontWeight:600}}>{clinicSaving}</span>}
              <button onClick={()=>setShowAddClinic(!showAddClinic)}
                style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                + Add New Clinic
              </button>
            </div>
          </div>

          {/* Add Clinic form */}
          {showAddClinic&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.green}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.green,marginBottom:12}}>Add New Clinic</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Clinic Name *</div>{inp(newClinic.name,v=>setNewClinic({...newClinic,name:v}),'e.g. Sunrise Clinic')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Locality</div>{inp(newClinic.locality,v=>setNewClinic({...newClinic,locality:v}),'e.g. Aundh')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Assign RM *</div>
                {sel(newClinic.rm,v=>setNewClinic({...newClinic,rm:v}),[{v:'',l:'Select RM…'},...workingRMs.map(r=>r.rm)])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Status</div>
                {sel(newClinic.status,v=>setNewClinic({...newClinic,status:v}),['Growing','Stable','Declining'])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Frequency</div>
                {sel(newClinic.freq,v=>setNewClinic({...newClinic,freq:v}),['Daily','Tri-weekly','Bi-weekly','Weekly'])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Timeslot</div>{inp(newClinic.slot,v=>setNewClinic({...newClinic,slot:v}),'e.g. 11:00–1:00')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Leads</div>{inp(newClinic.leads,v=>setNewClinic({...newClinic,leads:parseInt(v)||0}),'0','number')}</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleAddClinic} style={{padding:'9px 20px',background:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Add Clinic</button>
              <button onClick={()=>{setShowAddClinic(false);setNewClinic({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});}} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* Clinic Table */}
          <div className="tbl-wrap">
            <table className="dt">
              <thead><tr><th>Clinic</th><th>Locality</th><th>Current RM</th><th>TL</th><th>City</th><th className="num">Leads</th><th>Status</th><th>Reassign RM</th><th>Action</th></tr></thead>
              <tbody>
                {filteredClinics.map((c,i)=>(
                  <tr key={i}>
                    <td><strong>{c.name}</strong></td>
                    <td style={{color:B.muted}}>{c.locality||'—'}</td>
                    <td>{c.rm}</td>
                    <td>{c.tl}</td>
                    <td>{c.city}</td>
                    <td className="num">{c.leads||0}</td>
                    <td><SBadge status={c.status}/></td>
                    <td>
                      <select defaultValue={c.rm} onChange={e=>handleReassignClinic(i,e.target.value)}
                        style={{padding:'5px 8px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,background:B.white,outline:'none',cursor:'pointer',minWidth:130}}>
