                      </select>
                    </td>
                    <td>
                      <button onClick={()=>handleRemoveClinic(i)}
                        style={{padding:'5px 10px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        🗑️
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:B.muted,marginTop:10}}>Showing {filteredClinics.length} of {workingClinics.length} clinics</div>
        </div>}

        {/* ── ROUTE SYNC TAB ── */}
        {adminTab==='route'&&<div>
          <Card style={{marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:16,color:B.ink,marginBottom:4}}>Route Plan — Sheet Sync</div>
            <div style={{fontSize:12,color:B.muted,marginBottom:18}}>Connect a published Google Sheet to update clinic lead counts daily. One sync overwrites all leads with the sheet values.</div>

            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:B.muted,marginBottom:6,fontWeight:600,textTransform:'uppercase'}}>Google Sheet CSV URL</div>
              <input value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)}
                placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"
                style={{width:'100%',padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
              <div style={{fontSize:11,color:B.muted,marginTop:6,lineHeight:1.6}}>
                In Google Sheets: <strong>File → Share → Publish to web</strong> → choose the sheet → select <strong>CSV</strong> → Publish. Copy the URL here.
              </div>
            </div>

            <div style={{background:B.amberBg,border:`1px solid ${B.amber}`,borderRadius:10,padding:'12px 14px',marginBottom:18}}>
              <div style={{fontWeight:700,fontSize:12,color:B.amber,marginBottom:6}}>Required sheet format</div>
              <div style={{fontSize:12,color:B.ink,lineHeight:1.7}}>
                Row 1 (header): <strong>Clinic Name, Leads</strong><br/>
                Row 2+: Exact clinic name as shown in app, today's lead count<br/>
                Example: <code style={{background:'rgba(0,0,0,.06)',padding:'0 4px',borderRadius:4}}>MEDISURE Health Clinic,156</code>
              </div>
            </div>

            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <button onClick={handleSaveSheetUrl}
                style={{padding:'10px 20px',background:B.navy,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save URL
              </button>
              <button onClick={handleSyncNow} disabled={routeSyncing}
                style={{padding:'10px 20px',background:routeSyncing?B.muted:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:routeSyncing?'default':'pointer'}}>
                {routeSyncing?'Syncing…':'↻ Sync Now'}
              </button>
              {routeSyncMsg&&<span style={{fontSize:13,color:routeSyncMsg.includes('failed')||routeSyncMsg.includes('verify')?B.red:B.green,fontWeight:600}}>{routeSyncMsg}</span>}
            </div>

            {_cache.route_settings?.lastSynced&&(
              <div style={{marginTop:14,fontSize:12,color:B.muted}}>
                Last synced: {new Date(_cache.route_settings.lastSynced).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
              </div>
            )}
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:14,color:B.ink,marginBottom:10}}>How it works</div>
            <div style={{fontSize:13,color:B.muted,lineHeight:1.8}}>
              1. Maintain a Google Sheet with two columns: Clinic Name and today's lead count.<br/>
              2. Each morning, update the counts and click "Sync Now" (or use the button on the Route Plan page).<br/>
              3. Lead counts update instantly for everyone. The previous count shows with a strikethrough.<br/>
              4. Each day's data is stored in history automatically.<br/>
              5. <strong style={{color:B.ink}}>Status is auto-calculated</strong> by comparing this week vs same days last week:<br/>
              &nbsp;&nbsp;&nbsp;• &gt;10% more leads → <span style={{color:B.green,fontWeight:700}}>Growing</span><br/>
              &nbsp;&nbsp;&nbsp;• &gt;10% fewer leads → <span style={{color:B.red,fontWeight:700}}>Declining</span><br/>
              &nbsp;&nbsp;&nbsp;• Within ±10% → <span style={{color:B.blue2,fontWeight:700}}>Stable</span><br/>
              6. When status changes, the RM gets a notification automatically.
            </div>
          </Card>

          <Card style={{borderLeft:`4px solid ${B.brand}`,marginTop:0,marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:16,color:B.brand,marginBottom:4}}>Clinic Health — Apps Script URL</div>
            <div style={{fontSize:12,color:B.muted,marginBottom:16}}>Connect the Route Plan page to your Google Sheet via Apps Script. Syncing pulls live clinic status, dormancy, and new onboarding data.</div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,color:B.muted,marginBottom:6,fontWeight:600,textTransform:'uppercase'}}>Apps Script Web App URL</div>
              <input value={routePlanScriptUrl} onChange={e=>setRoutePlanScriptUrl(e.target.value)}
                placeholder="https://script.google.com/macros/s/.../exec"
                style={{width:'100%',padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
              <div style={{fontSize:11,color:B.muted,marginTop:6,lineHeight:1.6}}>
                In Apps Script: <strong>Deploy → New deployment → Web app → Execute as Me → Anyone → Deploy</strong>. Copy the URL here.
              </div>
            </div>
            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <button onClick={handleSaveRoutePlanUrl}
                style={{padding:'10px 20px',background:B.navy,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save URL
              </button>
              <button onClick={handleSyncRoutePlanNow} disabled={routePlanSyncing}
                style={{padding:'10px 20px',background:routePlanSyncing?B.muted:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:routePlanSyncing?'default':'pointer'}}>
                {routePlanSyncing?'Syncing…':'↻ Sync Now'}
              </button>
              {routePlanMsg&&<span style={{fontSize:13,color:routePlanMsg.includes('failed')||routePlanMsg.includes('check')?B.red:B.green,fontWeight:600}}>{routePlanMsg}</span>}
            </div>
            {_cache.route_settings?.routePlanLastFetched&&(
              <div style={{marginTop:12,fontSize:12,color:B.muted}}>
                Last synced: {new Date(_cache.route_settings.routePlanLastFetched).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
              </div>
            )}

              </button>
              {payDiag&&<div style={{marginTop:8,background:'#f8f9fa',border:'1.5px solid #dee2e6',borderRadius:8,padding:'10px 14px',fontSize:12,fontFamily:'monospace'}}>
                <div><b>Rows in cache:</b> {payDiag.total} &nbsp;|&nbsp; <b>With date:</b> {payDiag.dated} &nbsp;|&nbsp; <b>Date column:</b> {payDiag.col}</div>
                <div style={{marginTop:6,color:'#555'}}><b>First 5 rows:</b></div>

                {payDiag.total===0&&<div style={{color:'#c62828',marginTop:4,fontFamily:'sans-serif',fontWeight:600}}>No payment rows loaded — run "Pull from Google Sheet" first.</div>}
                {payDiag.total>0&&payDiag.dated===0&&<div style={{color:'#e65100',marginTop:4,fontFamily:'sans-serif',fontWeight:600}}>Rows exist but none have dates — date column not matched. Check column name in sheet.</div>}
              </div>}
              <button onClick={()=>{
                const lmMK=getLastMonthKey();
                const snap=_cache.monthly_targets?.[lmMK]||{};
                const sampleRMs=ALL_RMS.slice(0,3).map(r=>`${r.rm}: lmt=₹${r.lastMonthTarget||0} tgt=₹${r.target||0}`);
                const sampleSnap=Object.entries(snap).slice(0,3).map(([k,v])=>`${k}:₹${v}`).join(' | ')||'(empty)';
                setLmDiag({
                  ...(window._syncDebug||{}),
                  lmMK,
                  snapCount:Object.keys(snap).length,
                  snapSample:sampleSnap,
                  rmCount:ALL_RMS.length,
                  rmSample:sampleRMs.join(' | '),
                  rmWithLmt:ALL_RMS.filter(r=>(r.lastMonthTarget||0)>0).length,
                  monthlyTgtKeys:Object.keys(_cache.monthly_targets||{}).join(', ')||'(none)',
                });
              }} style={{padding:'6px 14px',background:'#fff3e0',color:'#e65100',border:'1.5px solid #e65100',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',marginTop:8}}>
                Check Last Month Targets
              </button>
              {lmDiag&&<div style={{marginTop:8,background:'#fff8f0',border:'1.5px solid #e65100',borderRadius:8,padding:'10px 14px',fontSize:12,fontFamily:'monospace'}}>
                <div style={{fontWeight:700,fontFamily:'sans-serif',marginBottom:6}}>— CURRENT STATE (after page load) —</div>
                <div><b>monthly_targets keys:</b> {lmDiag.monthlyTgtKeys}</div>
                <div><b>Snapshot for {lmDiag.lmMK}:</b> {lmDiag.snapCount} entries — {lmDiag.snapSample}</div>

                {window._syncDebug?.lmTab&&<>

                  <div><b>Rows returned:</b> {lmDiag.lmRowCount} · <b>Targets matched:</b> {lmDiag.lmMapCount}</div>
                  <div style={{wordBreak:'break-all'}}><b>First row:</b> {lmDiag.lmFirstRow}</div>

          <Card style={{borderLeft:'4px solid #b91c1c',marginTop:16}}>

                setResetMsg('Resetting…');

                setResetMsg(done?'✅ All targets reset to 0. Run a sync to load new targets.':'Already reset this month.');

                Reset All Targets Now

              {resetMsg&&<span style={{fontSize:13,color:resetMsg.includes('✅')?B.green:B.muted,fontWeight:600}}>{resetMsg}</span>}

          <Card style={{borderLeft:`4px solid ${B.brand}`,marginTop:16}}>
            <div style={{fontWeight:700,fontSize:16,color:B.navy,marginBottom:4}}>Auto-sync</div>
            <div style={{fontSize:13,color:B.muted,marginBottom:16}}>Automatically pull the latest data from your Google Sheet at a set interval whenever the app is open.</div>
            <div style={{display:'flex',gap:16,alignItems:'center',marginBottom:14,flexWrap:'wrap'}}>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontWeight:600,fontSize:13}}>
                <input type="checkbox" checked={autoSyncEnabled} onChange={e=>setAutoSyncEnabled(e.target.checked)}
                  style={{width:16,height:16,cursor:'pointer'}}/>
                Enable auto-sync
              </label>
              {autoSyncEnabled&&<div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:13,color:B.muted}}>Sync every</span>
                <select value={syncIntervalMin} onChange={e=>setSyncIntervalMin(Number(e.target.value))}
                  style={{padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
                  <option value={15}>15 minutes</option>
                  <option value={30}>30 minutes</option>
                  <option value={60}>1 hour</option>
                  <option value={120}>2 hours</option>
                </select>
              </div>}
            </div>
            {autoSyncEnabled&&<div style={{fontSize:12,color:B.muted,background:B.brandLight,borderRadius:8,padding:'8px 12px',marginBottom:14}}>
              The app will silently fetch fresh data from your sheet every {syncIntervalMin} minute{syncIntervalMin>1?'s':''} while it is open. No page reload — views update automatically.
            </div>}
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:13,color:B.navy,marginBottom:6}}>Monthly Targets Tab (optional override)</div>
              <div style={{fontSize:12,color:B.muted,marginBottom:8}}>Leave blank — the app automatically looks for "RM Targets June", "RM Targets July" etc. based on the current month. Only fill this if your tab uses a different naming format.</div>
              <input value={targetsTab} onChange={e=>setTargetsTab(e.target.value)}
                placeholder="Auto: RM Targets [Month] — leave blank"
                style={{padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,width:'100%',maxWidth:320,outline:'none',boxSizing:'border-box'}}/>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:13,color:B.navy,marginBottom:6}}>Last Month Targets Tab</div>
              <div style={{fontSize:12,color:B.muted,marginBottom:8}}>Name of the sheet tab with last month's targets. Used to show correct target when "Last Month" filter is selected (e.g. "RM Targets May").</div>
              <input value={lastMonthTab} onChange={e=>setLastMonthTab(e.target.value)}
                placeholder="e.g. RM Targets May"
                style={{padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,width:'100%',maxWidth:320,outline:'none',boxSizing:'border-box'}}/>
            </div>
            <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:20}}>
              <button onClick={handleSaveAutoSync}
                style={{padding:'9px 20px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save Settings
              </button>
              {autoSyncMsg&&<span style={{fontSize:13,color:autoSyncMsg.includes('✅')?B.green:B.red,fontWeight:600}}>{autoSyncMsg}</span>}
            </div>
            <div style={{borderTop:`1px solid ${B.line}`,paddingTop:16}}>
              <div style={{fontWeight:700,fontSize:14,color:B.navy,marginBottom:4}}>Month-End Archive</div>
              <div style={{fontSize:12,color:B.muted,marginBottom:12}}>Creates a new tab in your Google Sheet (e.g. "Jun 2026 Achieved") with each RM's target and achieved amount for the current month. Run this before the monthly reset.</div>
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                <button onClick={handleArchiveMonth}
                  style={{padding:'9px 20px',background:B.amber,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                  Archive This Month to Sheet
                </button>
                {archiveMsg&&<span style={{fontSize:13,color:archiveMsg.includes('✅')?B.green:B.red,fontWeight:600}}>{archiveMsg}</span>}
              </div>
            </div>
          </Card>
        </div>}

        {/* ── INTEGRATIONS TAB ── */}
        {adminTab==='integrations'&&<div>
          <Card style={{borderLeft:'4px solid #7C3AED'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
              <div style={{fontWeight:700,fontSize:16,color:'#7C3AED'}}>Metabase Integration</div>
              {_cache.metabase_settings?.apiKey&&<span style={{background:'#EDE9FE',color:'#7C3AED',fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10}}>Connected</span>}
            </div>
            <div style={{fontSize:13,color:B.muted,marginBottom:14}}>Pulls live lead data (clinic stats, GL%, trend) directly from Metabase on every sync.</div>
            <div style={{marginBottom:12}}>
              <div style={{fontWeight:600,fontSize:12,color:B.navy,marginBottom:5}}>API Key</div>
              <input type="password" value={mbApiKey} onChange={e=>setMbApiKey(e.target.value)}
                placeholder="Paste your Metabase API key here"
                style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,outline:'none',boxSizing:'border-box',fontFamily:'monospace'}}/>
            </div>
            <div style={{marginBottom:12}}>
              <div style={{fontWeight:600,fontSize:12,color:B.navy,marginBottom:5}}>Dashboard ID</div>
              <input type="text" value={mbDashId} onChange={e=>setMbDashId(e.target.value)}
                placeholder="529"
                style={{width:120,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,outline:'none'}}/>
              <div style={{fontSize:11,color:B.muted,marginTop:4}}>From the Metabase dashboard URL — e.g. /dashboard/<strong>529</strong>-field-ops</div>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:12,color:B.navy,marginBottom:5}}>Proxy Script URL</div>
              <input type="text" value={mbProxyUrl} onChange={e=>setMbProxyUrl(e.target.value)}
                placeholder="https://script.google.com/macros/s/.../exec"
                style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,outline:'none',boxSizing:'border-box'}}/>
              <div style={{fontSize:11,color:B.muted,marginTop:4}}>The deployed URL of the Apps Script that has the <code>proxyMetabase_</code> function.</div>
            </div>
            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <button onClick={async()=>{
                if(!mbApiKey.trim()){setMbMsg('Enter an API key first.');return;}
                if(!mbProxyUrl.trim()){setMbMsg('Enter the proxy script URL first.');return;}
                setMbMsg('Saving…');
                const s={apiKey:mbApiKey.trim(),dashboardId:Number(mbDashId)||529,proxyUrl:mbProxyUrl.trim()};
                _cache.metabase_settings=s;
                await db.collection('config').doc('metabase_settings').set(s).catch(()=>{});
                setMbMsg('✅ Saved. Will take effect on next sync.');
                setTimeout(()=>setMbMsg(''),4000);
              }} style={{padding:'9px 20px',background:'#7C3AED',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save
              </button>
              <button onClick={async()=>{
                if(!mbApiKey.trim()){setMbMsg('Enter an API key first.');return;}
                if(!mbProxyUrl.trim()){setMbMsg('Enter the proxy script URL first.');return;}
                setMbMsg('Testing…');
                try{
                  const url=`${mbProxyUrl.trim()}?tab=metabase&apiKey=${encodeURIComponent(mbApiKey.trim())}&dashId=${Number(mbDashId)||529}&_=${Date.now()}`;
                  const result=await fetch(url,{cache:'no-store'}).then(r=>r.json());
                  if(result?.status==='ok'){
                    const rows=result.data?.rows||[];
                    setMbMsg(rows.length>0?`✅ Connected — ${rows.length} rows found.`:'⚠️ Connected but 0 rows returned.');
                  }else{
                    setMbMsg(`❌ ${result?.message||JSON.stringify(result).slice(0,120)}`);
                  }
                }catch(e){setMbMsg(`❌ ${e.message}`);}
              }} style={{padding:'9px 18px',background:B.bg,color:B.navy,border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Test
              </button>
              {_cache.metabase_settings?.apiKey&&<button onClick={async()=>{
                if(!window.confirm('Remove Metabase connection?'))return;
                _cache.metabase_settings={};
                await db.collection('config').doc('metabase_settings').set({}).catch(()=>{});
                setMbApiKey('');setMbMsg('Disconnected.');
              }} style={{padding:'9px 14px',background:B.redBg,color:B.red,border:`1px solid ${B.red}`,borderRadius:10,fontSize:12,fontWeight:700,cursor:'pointer'}}>
                Disconnect
              </button>}
            </div>
            {mbMsg&&<div style={{marginTop:10,fontSize:12,fontWeight:600,color:mbMsg.includes('✅')?B.green:mbMsg.includes('❌')?B.red:B.amber}}>{mbMsg}</div>}
          </Card>
        </div>}

        {/* ── PAYMENTS TAB ── */}
        {adminTab==='payments'&&<PaymentsAdminTab/>}

        {/* ── USERS TAB ── */}
        {adminTab==='settings'&&<UsersTab/>}


      </div>
    </div>
  );
}

// ── IS PAYMENTS VIEW ───────────────────────────────────────────────────────
function ISPaymentsView(){
  const isMobile=useIsMobile();
  const[cityF,setCityF]=useState('All');
  const[expanded,setExpanded]=useState(null);
  const[dateRange,setDateRange]=useState('This Month');

  const allRows=_cache.payment_rows||[];

  // Apply date filter first
  const rows=(()=>{
    if(dateRange==='All Time')return allRows;
    const rng=getDateRangeFromLabel(dateRange);
    if(!rng)return allRows;
    const{from,to}=rng;
    const toEnd=new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59,999);
    return allRows.filter(r=>{const d=parsePayDate(r.date);return d&&d>=from&&d<=toEnd;});
  })();

  // All cities from RM mapping for IS-associated payments
  const cities=['All',...[...new Set(
    allRows.filter(r=>r.is).map(r=>ALL_RMS.find(rm=>rm.rm.toLowerCase()===r.rm)?.city).filter(Boolean)
  )].sort()];

  // Filter and aggregate by IS
  const filtered=rows.filter(r=>{
    if(!r.is)return false;
    if(cityF!=='All'){
      const c=ALL_RMS.find(rm=>rm.rm.toLowerCase()===r.rm)?.city;
      if(c!==cityF)return false;
    }
    return true;
  });

  const isMap={};
  filtered.forEach(r=>{
    const key=r.is;
    if(!isMap[key]){
      const city=ALL_RMS.find(rm=>rm.rm.toLowerCase()===r.rm)?.city||'';
      isMap[key]={name:r.is,city,amount:0,count:0,rms:{}};
    }
    isMap[key].amount+=r.amount;
    isMap[key].count+=1;
    const rm=r.rm;
    if(!isMap[key].rms[rm])isMap[key].rms[rm]={rm,amount:0,count:0};
    isMap[key].rms[rm].amount+=r.amount;
    isMap[key].rms[rm].count+=1;
  });

  const isList=Object.values(isMap).sort((a,b)=>b.amount-a.amount);
  const grandTotal=isList.reduce((s,r)=>s+r.amount,0);

  const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');

  return(
    <div style={{background:B.bg,minHeight:'100vh',paddingBottom:isMobile?90:20,padding:isMobile?'0 0 90px':20}}>

      {/* Header */}
      <div style={{background:'linear-gradient(135deg,#1E1B4B,#4338CA)',padding:isMobile?'22px 18px 18px':'20px 24px',borderRadius:isMobile?'0 0 28px 28px':16,marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
          <div>
            <div style={{color:'rgba(255,255,255,.65)',fontSize:12,marginBottom:4}}>Inside Sales</div>
            <div style={{color:'#fff',fontSize:22,fontWeight:800}}>IS Payments</div>
            <div style={{color:'rgba(255,255,255,.7)',fontSize:13,marginTop:4}}>
              {fmt(grandTotal)} across {isList.length} IS reps · {filtered.length} payments
            </div>
          </div>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {['This Month','Last Month','This Week','All Time'].map(o=>(
            <button key={o} onClick={()=>setDateRange(o)}
              style={{padding:'5px 12px',borderRadius:16,border:`1.5px solid ${dateRange===o?'#fff':'rgba(255,255,255,.25)'}`,background:dateRange===o?'rgba(255,255,255,.2)':'transparent',color:dateRange===o?'#fff':'rgba(255,255,255,.55)',fontSize:11,fontWeight:dateRange===o?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>
              {o}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:isMobile?'0 14px':'0'}}>

        {/* City filter */}
        {cities.length>2&&<div style={{display:'flex',gap:8,overflowX:'auto',marginBottom:14,paddingBottom:4}}>
          {cities.map(c=>(
            <button key={c} onClick={()=>setCityF(c)}
              style={{padding:'6px 14px',borderRadius:20,border:`1.5px solid ${cityF===c?B.brand:B.line}`,background:cityF===c?B.brand:'#fff',color:cityF===c?'#fff':B.ink,fontSize:12,fontWeight:cityF===c?700:400,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
              {c}
            </button>
          ))}
        </div>}

        {isList.length===0
          ?<Card><div style={{fontSize:13,color:B.muted,padding:'12px 0',textAlign:'center'}}>No IS payments found{cityF!=='All'?` for ${cityF}`:''}.{'\n'}IS names are read from the "IS Name" column in your payments sheet.</div></Card>
          :<>
            {/* Summary table */}
            <Card style={{padding:0,overflow:'hidden',marginBottom:16}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead>
                  <tr style={{background:B.bg}}>
                    <th style={{padding:'10px 16px',textAlign:'left',fontSize:11,color:B.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px'}}>IS Name</th>
                    {!isMobile&&<th style={{padding:'10px 16px',textAlign:'left',fontSize:11,color:B.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px'}}>City</th>}
                    <th style={{padding:'10px 16px',textAlign:'right',fontSize:11,color:B.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px'}}>Payments</th>
                    <th style={{padding:'10px 16px',textAlign:'right',fontSize:11,color:B.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px'}}>Total</th>
                    <th style={{width:32}}></th>
                  </tr>
                </thead>
                <tbody>
                  {isList.map((is,i)=>{
                    const isOpen=expanded===is.name;
                    const rmList=Object.values(is.rms).sort((a,b)=>b.amount-a.amount);
                    return(
                      <React.Fragment key={is.name}>
                        <tr onClick={()=>setExpanded(isOpen?null:is.name)}
                          style={{borderTop:`1px solid ${B.line}`,cursor:'pointer',background:isOpen?B.brandLight:'transparent'}}>
                          <td style={{padding:'12px 16px'}}>
                            <div style={{fontWeight:700,fontSize:13,color:B.ink}}>{toTitleCase(is.name)}</div>
                            {isMobile&&<div style={{fontSize:11,color:B.muted,marginTop:2}}>{is.city}</div>}
                          </td>
                          {!isMobile&&<td style={{padding:'12px 16px',fontSize:13,color:B.muted}}>{is.city}</td>}
                          <td style={{padding:'12px 16px',textAlign:'right',fontSize:13,color:B.muted}}>{is.count}</td>
                          <td style={{padding:'12px 16px',textAlign:'right',fontWeight:700,fontSize:13,color:B.brand}}>{fmt(is.amount)}</td>
                          <td style={{padding:'12px 8px',textAlign:'center',fontSize:12,color:B.muted}}>{isOpen?'▲':'▼'}</td>
                        </tr>
                        {isOpen&&<tr style={{background:B.brandLight}}>
                          <td colSpan={isMobile?4:5} style={{padding:'0 16px 14px'}}>
                            <div style={{fontSize:11,color:B.brand,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',marginBottom:8}}>Linked RMs</div>
                            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                              {rmList.map(r=>(

function RefreshButton(){
  const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const[refreshing,setRefreshing]=useState(false);
  if(!isMobile)return null;
  const doRefresh=async()=>{
    setRefreshing(true);
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg)await reg.update();
    }catch(e){}
    window.location.reload();
  };
  return(
    <button onClick={doRefresh} disabled={refreshing}
      style={{position:'fixed',top:12,right:12,zIndex:9998,background:refreshing?'#94a3b8':'#2350FF',color:'#fff',border:'none',borderRadius:20,padding:'7px 14px',fontSize:12,fontWeight:700,cursor:refreshing?'default':'pointer',boxShadow:'0 2px 10px rgba(0,0,0,.2)',display:'flex',alignItems:'center',gap:6}}>
      <span style={{fontSize:14,lineHeight:1}}>{refreshing?'…':'↻'}</span>
      {refreshing?'Refreshing':'Refresh'}
    </button>
  );
}

    const unsub=auth.onAuthStateChanged(async(fu)=>{
      if(fu){
        setInitMsg('Loading your data…');
        await initFirestore();
        syncFromGoogleSheet({silent:true}); // auto-refresh on every app open
        const doc=await db.collection('users').doc(fu.uid).get();
        if(doc.exists){setUser({...doc.data(),uid:fu.uid});}
        else{
          const mapped=ROLE_MAP[fu.email?.toLowerCase()];
          if(mapped){await db.collection('users').doc(fu.uid).set({email:fu.email,...mapped,createdAt:new Date().toISOString()});setUser({...mapped,uid:fu.uid,email:fu.email});}
          else{await auth.signOut();}
        }
      }
      setLoading(false);
    });
    return()=>unsub();
  },[]);
  const handleLogin=async(u)=>{setInitMsg('Loading your data…');setLoading(true);await initFirestore();syncFromGoogleSheet({silent:true});setUser(u);setLoading(false);};
  const handleLogout=async()=>{
    if(_autoSyncTimer){clearInterval(_autoSyncTimer);_autoSyncTimer=null;}
    if(_sheetPushUnsub){_sheetPushUnsub();_sheetPushUnsub=null;}
    await auth.signOut();setUser(null);
    _cache={targets:{},tl_targets:{},admin_state:null,tl_notes:{},route_settings:{},live_leads:{},clinic_statuses:{},route_assignments:{},tl_achieved:{},sync_settings:{},payment_rows:[],monthly_reset:{},route_plan_data:{live_status:[],needs_action:[],new_onboarded:[],disabled:[],lastFetched:null},loaded:false};
  };
  if(loading)return <LoadingScreen message={initMsg}/>;
  if(!user)return <Login onLogin={handleLogin}/>;
  if(user.mustChangePassword)return <ForcePasswordChange user={user} onDone={()=>setUser({...user,mustChangePassword:false})}/>;
  const role=user.role;
  return <>{role==='zonal'||role==='admin'?<FullAccessView user={user} onLogout={handleLogout}/>:role==='is_tl'?<ISTLView user={user} onLogout={handleLogout}/>:role==='tl'?<TLView user={user} onLogout={handleLogout}/>:role==='is'?<ISUserView user={user} onLogout={handleLogout}/>:<RMView user={user} onLogout={handleLogout}/>}<RefreshButton/><InstallBanner/></>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
