// Returns the ISO date string (YYYY-MM-DD) of the Monday of the given date
function getMondayStr(d=new Date()){
  const day=new Date(d);day.setHours(0,0,0,0);
  day.setDate(day.getDate()-((day.getDay()+6)%7));
  return day.toISOString().slice(0,10);
}

async function fetchDayLeads(dateStr){
  try{const s=await db.collection('leadHistory').doc(dateStr).get();return(s.exists?s.data():{});}
  catch(e){return {};}
}

// Sums lead history for `dayCount` days starting from the given Monday
async function getWeekTotals(mondayStr,dayCount){
  const mon=new Date(mondayStr);
  const dates=Array.from({length:dayCount},(_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    return d.toISOString().slice(0,10);
  });
  const snaps=await Promise.all(dates.map(fetchDayLeads));
  const totals={};
  snaps.forEach(data=>{
    Object.entries(data).forEach(([k,v])=>{
      if(!k.startsWith('_')&&typeof v==='number')totals[k]=(totals[k]||0)+v;
    });
  });
  return totals;
}

// Derives Growing / Stable / Declining per clinic using ±10% thresholds
function deriveStatuses(curr,prev){
  const result={};
  ALL_RMS.forEach(r=>r.clinics.forEach(c=>{
    const k=clinicKey(r.rm,c.name);
    const cv=curr[k]||0;const pv=prev[k]||0;
    if(pv===0){result[k]='Stable';return;}
    const chg=(cv-pv)/pv;
    result[k]=chg>0.1?'Growing':chg<-0.1?'Declining':'Stable';
  }));
  return result;
}

async function syncLeadsFromSheet(sheetUrl){
  const resp=await fetch(sheetUrl);
  if(!resp.ok)throw new Error('Fetch failed: '+resp.status);
  const text=await resp.text();
  const lines=text.split('\n').filter(l=>l.trim());
  const rawMap={};
  for(let i=1;i<lines.length;i++){
    const row=lines[i].replace(/\r/,'');
    const m=row.match(/^"?([^",\n]+)"?,\s*(\d+)/);
    if(m)rawMap[m[1].trim()]=parseInt(m[2])||0;
  }

  // Build clinicKey → today's leads map
  const liveLeads={};const todayData={};
  ALL_RMS.forEach(r=>r.clinics.forEach(c=>{
    if(rawMap[c.name]!==undefined){
      const k=clinicKey(r.rm,c.name);
      liveLeads[k]=rawMap[c.name];
      todayData[k]=rawMap[c.name];
    }
  }));

  // Persist today's counts to lead history
  const todayStr=new Date().toISOString().slice(0,10);
  await db.collection('leadHistory').doc(todayStr).set({...todayData,_updatedAt:new Date().toISOString()}).catch(()=>{});

  // Compare this week vs same days last week (apples-to-apples)
  const dayOfWeek=(new Date().getDay()+6)%7; // 0=Mon … 6=Sun
  const daysElapsed=dayOfWeek+1;
  const currMonday=getMondayStr();
  const prevMonday=getMondayStr(new Date(Date.now()-7*86400000));
  const[currTotals,prevTotals]=await Promise.all([
    getWeekTotals(currMonday,daysElapsed),
    getWeekTotals(prevMonday,daysElapsed)
  ]);

  const newStatuses=deriveStatuses(currTotals,prevTotals);

  // Fire notifications for any status that changed
  const existing=_cache.clinic_statuses||{};
  await Promise.all(ALL_RMS.flatMap(r=>r.clinics.map(async c=>{
    const k=clinicKey(r.rm,c.name);
    const oldStatus=existing[k]||c.status;
    const newStatus=newStatuses[k];
    if(newStatus&&oldStatus!==newStatus)await saveStatusNotif(c.name,oldStatus,newStatus,r.rm);
  })));

  // Save auto-derived statuses and live leads
  _cache.clinic_statuses={..._cache.clinic_statuses,...newStatuses};
  await db.collection('config').doc('clinic_statuses').set(_cache.clinic_statuses).catch(()=>{});
  liveLeads._updatedAt=new Date().toISOString();
  await db.collection('config').doc('live_leads').set(liveLeads).catch(()=>{});
  _cache.live_leads=liveLeads;
  await saveRouteSettings({sheetUrl,lastSynced:liveLeads._updatedAt});
  return liveLeads;
}

}

}

// Download CSV helper
function downloadCSV(headers,rows,filename){
  const csv=[headers,...rows].map(r=>r.map(v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click();
}

// ── NOTIFICATION BELL ──────────────────────────────────────────────────────
function NotificationBell({rmName}){
  const[notifs,setNotifs]=useState([]);
  const[open,setOpen]=useState(false);
  const load=useCallback(()=>getNotifications(rmName).then(setNotifs),[rmName]);
  useEffect(()=>{if(!rmName)return;load();const t=setInterval(load,30000);return()=>clearInterval(t);},[rmName,load]);
  const unread=notifs.filter(n=>!n.read).length;
  const handleOpen=()=>{
    setOpen(o=>!o);
    notifs.filter(n=>!n.read).forEach(n=>markNotifRead(n.id));
    setTimeout(()=>setNotifs(p=>p.map(n=>({...n,read:true}))),300);
  };
  const typeIcon={note:'📝',status:'🔄'};
  return(
    <div style={{position:'relative'}}>
      <button onClick={handleOpen} style={{position:'relative',background:'rgba(255,255,255,.18)',border:'none',color:'#fff',borderRadius:10,padding:'7px 11px',cursor:'pointer',fontSize:18,lineHeight:1}}>
        🔔
        {unread>0&&<span style={{position:'absolute',top:-5,right:-5,background:B.red,color:'#fff',borderRadius:10,padding:'1px 5px',fontSize:10,fontWeight:800,minWidth:18,textAlign:'center',lineHeight:'16px'}}>
          {unread>9?'9+':unread}
        </span>}
      </button>
      {open&&<>
        <div onClick={handleOpen} style={{position:'fixed',inset:0,zIndex:199}}/>
        <div style={{position:'absolute',right:0,top:'110%',width:320,background:B.white,borderRadius:16,boxShadow:'0 12px 40px rgba(0,0,0,.18)',zIndex:200,maxHeight:420,display:'flex',flexDirection:'column',border:`1px solid ${B.line}`}}>

            Notifications
            {unread>0&&<span style={{background:B.redBg,color:B.red,padding:'2px 8px',borderRadius:10,fontSize:11}}>{unread} new</span>}
          </div>
          <div style={{overflowY:'auto',flex:1}}>

  );
}

      let userData;

  const ach=myRMs.reduce((s,r)=>s+r.achieved,0);

  const TeamView=()=>{
    const behind=myRMs.filter(r=>pct(r.achieved,r.target)<60);
    const totMthlyTgt=myRMs.reduce((s,r)=>s+r.monthlyTgt,0);
    const totMthlyAchv=myRMs.reduce((s,r)=>s+r.monthlyAchv,0);
    const totDailyTgt=myRMs.reduce((s,r)=>s+r.dailyTgt,0);
    const totRenTgt=myRMs.reduce((s,r)=>s+r.renewalTgt,0);
    const totRenAchv=myRMs.reduce((s,r)=>s+r.renewalAchv,0);
    const th2={padding:'10px 12px',textAlign:'left',fontSize:11,textTransform:'uppercase',letterSpacing:'.5px',fontWeight:700,color:B.muted,borderBottom:`2px solid ${B.line}`,background:'#F8FAFC',whiteSpace:'nowrap'};
    const thR2={...th2,textAlign:'right'};
    const td2={padding:'11px 12px',borderBottom:`1px solid ${B.line}`,whiteSpace:'nowrap',verticalAlign:'middle'};
    const tdR2={...td2,textAlign:'right',fontVariantNumeric:'tabular-nums'};
    const tfC={textAlign:'right',padding:'11px 12px',color:'rgba(255,255,255,.9)',fontWeight:700};
    if(isMobile) return(
      <div style={{background:B.bg,minHeight:'100vh',paddingBottom:80}}>
        <div style={{background:`linear-gradient(135deg,${B.brandDark},${B.brand})`,padding:'22px 18px 30px',borderRadius:'0 0 28px 28px'}}>
          <div style={{color:'rgba(255,255,255,.65)',fontSize:12}}>Team Dashboard</div>
          <div style={{color:'#fff',fontSize:21,fontWeight:800,marginTop:2}}>{user.name}'s Team</div>
          <div style={{color:'rgba(255,255,255,.55)',fontSize:11,marginTop:2}}>{user.city||'Pune'} · {myRMs.length} RMs</div>
          <div style={{display:'flex',gap:8,marginTop:14}}>
            <KTile label="Target" value={fmt(tgt)}/>
            <KTile label="Achieved" value={fmt(ach)} pv={pct(ach,tgt)}/>
            <KTile label="On Track" value={myRMs.filter(r=>pct(r.achieved,r.target)>=80).length+'/'+myRMs.length}/>
          </div>
        </div>
        <div style={{padding:'16px'}}>
          {behind.length>0&&<div style={{background:B.redBg,borderLeft:`4px solid ${B.red}`,borderRadius:14,padding:'12px 14px',marginBottom:14}}>
            <div style={{color:B.red,fontWeight:700}}>⚠️ {behind.map(r=>r.rm).join(', ')} behind target</div>
          </div>}
          <STitle>RM Performance</STitle>
          {myRMs.sort((a,b)=>pct(b.achieved,b.target)-pct(a.achieved,a.target)).map((r,i)=>{
            const p=pct(r.achieved,r.target);
            return <Card key={i} style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                <div><div style={{fontWeight:700,fontSize:14}}>{r.rm}</div><div style={{color:B.muted,fontSize:11,marginTop:1}}>{fmtN(r.achieved)} of {fmtN(r.target)}</div></div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}><PBadge p={p}/></div>
              </div>
              <MBar p={p}/>
            </Card>;
          })}
        </div>
      </div>
    );
    return(
      <div style={{background:B.bg,minHeight:'100vh',paddingTop:64,paddingBottom:24}}>
        <div style={{padding:'24px 28px 0'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <div>
              <div style={{fontSize:22,fontWeight:800,color:B.navy}}>{user.name}'s Team</div>
              <div style={{color:B.muted,fontSize:13,marginTop:3}}>{user.city||'Pune'} · {myRMs.length} RMs · {new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
            </div>
            <select value={dateRange} onChange={e=>setDateRange(e.target.value)} style={{padding:'8px 14px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer',fontWeight:600,color:B.ink}}>
              {['This Week','This Month','Last Month','Last 3 Months'].map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          {behind.length>0&&<div style={{background:B.redBg,borderLeft:`4px solid ${B.red}`,borderRadius:14,padding:'12px 14px',marginBottom:20}}>
            <div style={{color:B.red,fontWeight:700}}>⚠️ Behind target: {behind.map(r=>r.rm).join(', ')}</div>
          </div>}
          <div style={{display:'flex',gap:14,marginBottom:24}}>
            <StatCard title="Team Target" value={fmt(tgt)} icon="🎯"/>
            <StatCard title="Team Achieved" value={fmt(ach)} sub={`${pct(ach,tgt)}% of target`} icon="💰" highlight/>
            <StatCard title="On Track" value={myRMs.filter(r=>pct(r.achieved,r.target)>=80).length+'/'+myRMs.length} icon="✅"/>
            <StatCard title="Behind Target" value={String(behind.length)} icon="⚠️"/>
          </div>
        </div>
        <div style={{padding:'0 28px 24px'}}>
          <div style={{background:B.white,borderRadius:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',overflow:'hidden',border:`1px solid ${B.line}`}}>
            <div style={{padding:'14px 18px',borderBottom:`1px solid ${B.line}`,fontWeight:700,fontSize:14,color:B.navy}}>RM Performance — {dateRange}</div>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13,minWidth:700}}>
                <thead>
                  <tr>
                    <th style={th2}>No</th>
                    <th style={th2}>RM</th>
                    <th style={th2}>City</th>
                    <th style={thR2}>Target (₹) ↕</th>
                    <th style={thR2}>Achieved (₹) ↕</th>
                    <th style={thR2}>Target % ↕</th>
                    <th style={thR2}>Mthly Tgt</th>
                    <th style={thR2}>Mthly Achv</th>
                    <th style={thR2}>Daily Tgt</th>
                    <th style={thR2}>Renewal Tgt</th>
                    <th style={thR2}>Renewal Achv</th>
                    <th style={th2}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {myRMs.sort((a,b)=>pct(b.achieved,b.target)-pct(a.achieved,a.target)).map((r,i)=>{
                    const p=pct(r.achieved,r.target);
                    const stc=p>=80?B.green:p>=60?B.amber:B.red;
                    const stb=p>=80?B.greenBg:p>=60?B.amberBg:B.redBg;
                    const stl=p>=80?'On Track':p>=60?'At Risk':'Behind';
                    return <tr key={i} style={{background:B.white}} onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'} onMouseLeave={e=>e.currentTarget.style.background=B.white}>
                      <td style={{...td2,color:B.muted,fontWeight:600,width:44}}>{i+1}</td>
                      <td style={td2}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <div style={{width:30,height:30,background:B.brandLight,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:B.brand,flexShrink:0}}>{r.rm[0]}</div>
                          <div><div style={{fontWeight:700,color:B.ink}}>{r.rm}</div><div style={{fontSize:10,color:B.muted}}>{r.clinics?.length||0} clinics</div></div>
                        </div>
                      </td>
                      <td style={td2}>{r.city}</td>
                      <td style={tdR2}>{Number(r.target).toLocaleString('en-IN')}</td>
                      <td style={tdR2}>{Number(r.achieved).toLocaleString('en-IN')}</td>
                      <td style={tdR2}><span style={{color:pClr(p),fontWeight:700}}>{p}%</span></td>
                      <td style={tdR2}>{r.monthlyTgt}</td>
                      <td style={tdR2}>{r.monthlyAchv}</td>
                      <td style={tdR2}>{r.dailyTgt}</td>
                      <td style={tdR2}>{r.renewalTgt}</td>
                      <td style={tdR2}>{r.renewalAchv}</td>
                      <td style={td2}><span style={{background:stb,color:stc,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700}}>{stl}</span></td>
                    </tr>;
                  })}
                </tbody>
                <tfoot>
                  <tr style={{background:B.navy}}>
                    <td colSpan={2} style={{padding:'12px 14px',color:'#fff',fontWeight:800,fontSize:13}}>TOTALS — {myRMs.length} RMs</td>
                    <td style={{padding:'12px'}}></td>
                    <td style={tfC}>{Number(tgt).toLocaleString('en-IN')}</td>
                    <td style={tfC}>{Number(ach).toLocaleString('en-IN')}</td>
                    <td style={tfC}>{pct(ach,tgt)}%</td>
                    <td style={tfC}>{totMthlyTgt}</td>
                    <td style={tfC}>{totMthlyAchv}</td>
                    <td style={tfC}>{totDailyTgt}</td>
                    <td style={tfC}>{totRenTgt}</td>
                    <td style={tfC}>{totRenAchv}</td>
                    <td style={{padding:'12px'}}></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>
    );
  };

  return <>
    {screen==='team'&&<TeamView/>}
    {screen==='route'&&<RoutePlanPanel user={user}/>}
    {isMobile&&<div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,background:B.white,borderTop:`1px solid ${B.line}`,display:'flex',zIndex:100,boxShadow:'0 -4px 20px rgba(35,80,255,.1)'}}>
      {[['team','👥','My Team'],['route','🗺️','Route Plan']].map(([id,icon,lbl])=>(
        <button key={id} onClick={()=>setScreen(id)} style={{flex:1,padding:'10px 8px 12px',background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer'}}>
          <span style={{fontSize:22}}>{icon}</span>
          <span style={{fontSize:11,fontWeight:screen===id?700:500,color:screen===id?B.brand:B.muted}}>{lbl}</span>
          {screen===id&&<div style={{width:20,height:3,background:B.brand,borderRadius:2}}/>}
        </button>
      ))}
    </div>}
    {!isMobile&&<div style={{position:'fixed',top:0,left:0,right:0,background:B.white,borderBottom:`1px solid ${B.line}`,padding:'0 32px',display:'flex',gap:4,zIndex:100,boxShadow:'0 2px 8px rgba(0,0,0,.04)'}}>
      {[['team','👥 My Team'],['route','🗺️ Route Plan']].map(([id,lbl])=>(
        <button key={id} onClick={()=>setScreen(id)} style={{padding:'14px 18px',background:'none',border:'none',borderBottom:screen===id?`3px solid ${B.brand}`:'3px solid transparent',color:screen===id?B.brand:B.muted,fontWeight:screen===id?700:500,fontSize:13,cursor:'pointer'}}>
          {lbl}
        </button>
      ))}
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:13,color:B.muted}}>{user.name}</span>
        <button onClick={onLogout} style={{background:B.redBg,border:'none',color:B.red,borderRadius:8,padding:'6px 12px',fontSize:12,cursor:'pointer',fontWeight:600}}>Logout</button>
      </div>
    </div>}
  </>;
}

// ── ROUTE PLAN ─────────────────────────────────────────────────────────────
function RoutePlanPanel({user}){
  const isMobile=useIsMobile();
  const[cityF,setCityF]=useState('All');
  const[tlF,setTlF]=useState('All');
  const[search,setSearch]=useState('');
  const[notes,setNotes]=useState({..._clinicNotes});
  const[editingNote,setEditingNote]=useState(null);
  const[statuses,setStatuses]=useState({...(_cache.clinic_statuses||{})});
  const[liveLeads,setLiveLeads]=useState({...(_cache.live_leads||{})});
  const[syncing,setSyncing]=useState(false);
  const[syncMsg,setSyncMsg]=useState('');
  const[assignments,setAssignments]=useState(_cache.route_assignments||{overrides:{},added:{}});
  const[editingSlot,setEditingSlot]=useState(null);
  const[addingTo,setAddingTo]=useState(null);
  const[newClinic,setNewClinic]=useState({name:'',locality:'',slot:'',freq:'Daily',status:'Stable',reason:'',leads:0});

  const isTL=user&&user.role==='tl';
  const canEdit=user&&(user.role==='tl'||user.role==='admin'||user.role==='zonal');

  useEffect(()=>{if(isTL&&user.name)setTlF(user.name);},[isTL]);

  const tls=['All',...new Set(ALL_RMS.map(r=>r.tl))];
  const FREQ_OPTS=['Daily','Tri-weekly','Bi-weekly','Weekly'];

  const getLeads=(rmName,clinicName)=>{const v=liveLeads[clinicKey(rmName,clinicName)];return v!==undefined?v:null;};
  const getStatus=(rmName,clinicName,fallback)=>statuses[clinicKey(rmName,clinicName)]||fallback;

  const saveAssignments=async(a)=>{
    setAssignments(a);_cache.route_assignments=a;
    await db.collection('config').doc('route_assignments').set(a).catch(()=>{});
  };
  const getEffectiveClinics=(r)=>{
    const ovs=assignments.overrides||{};
    const added=(assignments.added||{})[r.rm]||[];
    const base=r.clinics.filter(c=>!ovs[clinicKey(r.rm,c.name)]?.removed).map(c=>{const ov=ovs[clinicKey(r.rm,c.name)]||{};return{...c,...ov};});
    return[...base,...added.map((c,idx)=>({...c,_added:true,_addedIdx:idx}))];
  };
  const getCKey=(r,c)=>c._added?`${clinicKey(r.rm,c.name)}_a${c._addedIdx}`:clinicKey(r.rm,c.name);

  const handleSync=async()=>{
    const url=_cache.route_settings?.sheetUrl;
    if(!url){setSyncMsg('No sheet configured. Admin must set it in Admin > Route Sync.');return;}
    setSyncing(true);setSyncMsg('');
    try{
      const res=await syncLeadsFromSheet(url);
      setLiveLeads({...res});
      const n=Object.keys(res).filter(k=>!k.startsWith('_')).length;
      setSyncMsg('Synced '+n+' clinics');
    }catch(e){setSyncMsg('Sync failed — check sheet URL or publish settings');}
    setSyncing(false);
    setTimeout(()=>setSyncMsg(''),6000);
  };

  const handleSaveNote=async()=>{
    if(!editingNote||!editingNote.text.trim())return;
    const key=clinicKey(editingNote.rmName,editingNote.clinicName);
    await saveClinicNote(key,editingNote.text,user.name,editingNote.rmName);
    setNotes(p=>({...p,[key]:{note:editingNote.text.trim(),tlName:user.name,updatedAt:new Date().toISOString()}}));
    setEditingNote(null);
  };

  const handleStatusChange=async(rmName,clinicName,newStatus,oldStatus)=>{
    const key=clinicKey(rmName,clinicName);
    setStatuses(p=>({...p,[key]:newStatus}));
    await updateClinicStatus(rmName,clinicName,newStatus,oldStatus);
  };

  const handleFreqChange=async(r,c,newFreq)=>{
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex[c._addedIdx]={...ex[c._addedIdx],freq:newFreq};await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],freq:newFreq}}});}
  };
  const handleSlotSave=async(r,c,newSlot)=>{
    if(!newSlot.trim()){setEditingSlot(null);return;}
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex[c._addedIdx]={...ex[c._addedIdx],slot:newSlot.trim()};await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],slot:newSlot.trim()}}});}
    setEditingSlot(null);
  };
  const handleRemoveClinic=async(r,c)=>{
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex.splice(c._addedIdx,1);await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],removed:true}}});}
  };
  const handleAddClinic=async(rmName)=>{
    if(!newClinic.name.trim()||!newClinic.slot.trim())return;
    const ex=(assignments.added||{})[rmName]||[];
    await saveAssignments({...assignments,added:{...(assignments.added||{}),[rmName]:[...ex,{...newClinic,name:newClinic.name.trim(),locality:newClinic.locality.trim(),reason:newClinic.reason.trim()}]}});
    setAddingTo(null);setNewClinic({name:'',locality:'',slot:'',freq:'Daily',status:'Stable',reason:'',leads:0});
  };

  const handleShare=(r)=>{
    const clinics=getEffectiveClinics(r);
    const cluster=[...new Set(clinics.map(c=>c.locality).filter(Boolean))].join(' · ');
    const lines=[`*Route Plan — ${r.rm}*`,`TL: ${r.tl} | City: ${r.city} | Cluster: ${cluster}`,``];
    clinics.forEach(c=>{
      const leads=getLeads(r.rm,c.name)??c.leads;
      const status=getStatus(r.rm,c.name,c.status);
      lines.push(`*${c.name}* (${c.locality})`);
      lines.push(`Leads: ${leads} | ${status} | ${c.freq} | ${c.slot}`);
      if(c.reason)lines.push(c.reason);
      lines.push(``);
    });
    window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
  };

  const lastSync=_cache.route_settings?.lastSynced;
  const lastSyncStr=lastSync?new Date(lastSync).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Never synced';

  const filtered=ALL_RMS.filter(r=>{
    if(cityF!=='All'&&r.city!==cityF)return false;
    if(tlF!=='All'&&r.tl!==tlF)return false;
    if(search&&!r.rm.toLowerCase().includes(search.toLowerCase())&&!r.clinics.some(c=>c.name.toLowerCase().includes(search.toLowerCase())))return false;
    return true;
  });

  const totalClinics=filtered.reduce((s,r)=>s+getEffectiveClinics(r).length,0);
  const cityLabel=cityF!=='All'?cityF:'All Cities';

  const fmtSlot=(slot)=>{
    if(!slot)return '—';
    const m=slot.match(/^(\d+:\d+)\s*[–—]\s*(\d+:\d+)$/);
    if(!m)return slot;
    const fmtTime=(t)=>{
      const[h,min]=t.split(':').map(Number);
      const suffix=(h>=9&&h<=11)?'AM':'PM';
      return `${h}:${min.toString().padStart(2,'0')} ${suffix}`;
    };
    return `${fmtTime(m[1])} – ${fmtTime(m[2])}`;
  };

  const renderDays=(freq)=>{
    const map={'Daily':['Mon','Tue','Wed','Thu','Fri','Sat'],'Tri-weekly':['Mon','Wed','Fri'],'Bi-weekly':['Mon','Thu'],'Weekly':['Mon']};
    const days=map[freq]||[];
    if(!days.length)return <span style={{color:B.muted,fontSize:11}}>—</span>;
    const allDays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const isRange=days.length>2&&days.every((d,i)=>i===0||allDays.indexOf(d)===allDays.indexOf(days[i-1])+1);
    if(isRange)return <span style={{background:'#F1F5F9',color:B.ink,padding:'3px 8px',borderRadius:6,fontSize:11,fontWeight:500}}>{days[0]}–{days[days.length-1]}</span>;
    return <>{days.map(d=><span key={d} style={{background:'#F1F5F9',color:B.ink,padding:'3px 7px',borderRadius:6,fontSize:11,fontWeight:500,marginRight:3}}>{d}</span>)}</>;
  };

  const freqColors={Daily:{b:'#7B1D1D',t:'#7B1D1D'},'Tri-weekly':{b:'#5B21B6',t:'#5B21B6'},'Bi-weekly':{b:'#0E7490',t:'#0E7490'},'Weekly':{b:'#065F46',t:'#065F46'}};
  const freqStyle=(freq)=>{const c=freqColors[freq]||{b:B.muted,t:B.muted};return{border:`1.5px solid ${c.b}`,color:c.t,background:'transparent',padding:'3px 10px',borderRadius:6,fontSize:11,fontWeight:600,whiteSpace:'nowrap',display:'inline-block'};};
  const ss=(status)=>({Growing:{bg:B.greenBg,c:B.green},Stable:{bg:B.blueBg,c:B.blue2},Declining:{bg:B.redBg,c:B.red}}[status]||{bg:'#F1F5F9',c:B.muted});

  return(
    <div style={{background:'#F8F9FB',minHeight:'100vh',paddingBottom:isMobile?80:20}}>
      <div style={{background:B.white,borderBottom:`1px solid ${B.line}`,padding:'20px 20px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12,marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontSize:26,fontWeight:800,color:B.ink}}>{cityLabel}</div>
            <span style={{background:B.brandLight,color:B.brand,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:'.3px'}}>
              {filtered.length} RMS · {totalClinics} CLINICS
            </span>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={handleSync} disabled={syncing}
              style={{background:syncing?B.line:B.brand,border:'none',color:'#fff',borderRadius:8,padding:'7px 14px',fontSize:12,fontWeight:600,cursor:syncing?'default':'pointer'}}>
              {syncing?'Syncing…':'↻ Sync Leads'}
            </button>
            <span style={{color:B.muted,fontSize:11}}>Last sync: {lastSyncStr}</span>
          </div>
        </div>
        {syncMsg&&<div style={{fontSize:12,color:B.green,fontWeight:600,marginBottom:8}}>{syncMsg}</div>}
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search RM or clinic..."
            style={{flex:1,minWidth:140,padding:'7px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,outline:'none'}}/>
          {[['City',['All','Pune','Mumbai','Nagpur'],cityF,setCityF],['TL',tls,tlF,setTlF]].map(([l,opts,v,s])=>(
            <select key={l} value={v} onChange={e=>s(e.target.value)} style={{padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,fontWeight:600,background:B.white,outline:'none',cursor:'pointer'}}>
              {opts.map(o=><option key={o}>{o}</option>)}
            </select>
          ))}
        </div>
      </div>

      <div style={{padding:'16px 20px'}}>
        {filtered.length===0&&(
          <div style={{textAlign:'center',padding:'48px 20px',color:B.muted}}>
            <div style={{fontSize:32,marginBottom:8}}>🗺️</div>
            <div style={{fontSize:14,fontWeight:600}}>No RMs match your filters</div>
          </div>
        )}
        {filtered.map((r,i)=>{
          const effectiveClinics=getEffectiveClinics(r);

                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Frequency</div>

                            {FREQ_OPTS.map(f=><option key={f}>{f}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Status</div>
                          <select value={newClinic.status} onChange={e=>setNewClinic(p=>({...p,status:e.target.value}))}
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,background:B.white,outline:'none',cursor:'pointer'}}>
                            {['Growing','Stable','Declining'].map(s=><option key={s}>{s}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Reason</div>
                          <input value={newClinic.reason} onChange={e=>setNewClinic(p=>({...p,reason:e.target.value}))} placeholder="Why this clinic?"
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,outline:'none',boxSizing:'border-box'}}/>
                        </div>
                      </div>
                      <div style={{display:'flex',gap:8}}>
                        <button onClick={()=>handleAddClinic(r.rm)}
                          disabled={!newClinic.name.trim()||!newClinic.slot.trim()}
                          style={{padding:'7px 18px',background:(!newClinic.name.trim()||!newClinic.slot.trim())?B.muted:B.brand,color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700,cursor:(!newClinic.name.trim()||!newClinic.slot.trim())?'default':'pointer'}}>
                          Add Clinic
                        </button>
                        <button onClick={()=>setAddingTo(null)}
                          style={{padding:'7px 14px',background:B.white,color:B.muted,border:`1px solid ${B.line}`,borderRadius:8,fontSize:12,cursor:'pointer'}}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

                      <td style={tdR}>{r.renewalTgt}</td>
                      <td style={tdR}>{r.renewalAchv}</td>

                  }):[])

    </div>
  );
}

// ── USERS TAB (inside Admin) ───────────────────────────────────────────────
function UsersTab(){
  const[users,setUsers]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[newUser,setNewUser]=useState({name:'',email:'',password:'',role:'rm',tl:'',city:'Pune'});
  const[status,setStatus]=useState('');
  const[userSearch,setUserSearch]=useState('');

  const tls=ZONE.tls.map(t=>t.name);
  const ROLES=[{v:'rm',l:'RM — Relationship Manager'},{v:'tl',l:'TL — Team Leader'},{v:'zonal',l:'Zonal Head'},{v:'admin',l:'Admin'}];

  useEffect(()=>{
    db.collection('users').get()
      .then(snap=>{setUsers(snap.docs.map(d=>({id:d.id,...d.data()})));})
      .catch(()=>setStatus('Could not load users'))
      .finally(()=>setLoading(false));
  },[]);

  const addUser=async()=>{
    if(!newUser.name.trim()||!newUser.email.trim()||newUser.password.length<6){
      setStatus('Fill all fields. Password must be 6+ characters.');return;
    }
    setStatus('Creating account…');
    try{
      // Use secondary Firebase app instance so we don't log out the admin
      const secondary=firebase.initializeApp(firebaseConfig,'_secondary_'+Date.now());
      const secAuth=secondary.auth();
      const cred=await secAuth.createUserWithEmailAndPassword(newUser.email.trim(),newUser.password);
      const uid=cred.user.uid;
      const userData={name:newUser.name.trim(),email:newUser.email.trim().toLowerCase(),role:newUser.role,
        ...(newUser.role==='rm'||newUser.role==='tl'?{tl:newUser.tl,city:newUser.city}:{}),
        createdAt:new Date().toISOString()};
      await db.collection('users').doc(uid).set(userData);
      await secAuth.signOut();
      await secondary.delete();
      setUsers(prev=>[...prev,{id:uid,...userData}]);
      setNewUser({name:'',email:'',password:'',role:'rm',tl:'',city:'Pune'});
      setShowAdd(false);
      setStatus('✅ Account created! They can now log in at even-pay-routeplan.vercel.app');
      setTimeout(()=>setStatus(''),6000);
    }catch(e){
      const msgs={'auth/email-already-in-use':'This email already has an account.','auth/invalid-email':'Invalid email address.','auth/weak-password':'Password too weak (6+ chars).'};
      setStatus('❌ '+(msgs[e.code]||e.message));
    }
  };

  const changeRole=async(uid,newRole)=>{
    await db.collection('users').doc(uid).update({role:newRole});
    setUsers(prev=>prev.map(u=>u.id===uid?{...u,role:newRole}:u));
    setStatus('✅ Role updated');setTimeout(()=>setStatus(''),3000);
  };

  const removeUser=async(uid,name)=>{
    if(!window.confirm(`Remove ${name}'s access? They won't be able to log in.`))return;
    await db.collection('users').doc(uid).delete();
    setUsers(prev=>prev.filter(u=>u.id!==uid));
    setStatus('✅ Access removed');setTimeout(()=>setStatus(''),3000);
  };

  const inp=(val,set,ph,type='text')=><input value={val} onChange={e=>set(e.target.value)} placeholder={ph} type={type}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>;

  const selEl=(val,set,opts)=><select value={val} onChange={e=>set(e.target.value)}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
    {opts.map(o=>typeof o==='string'?<option key={o}>{o}</option>:<option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;

  const filtered=users.filter(u=>!userSearch||u.name?.toLowerCase().includes(userSearch.toLowerCase())||u.email?.toLowerCase().includes(userSearch.toLowerCase()));
  const roleColors={admin:'#4338CA',zonal:B.brand,tl:B.green,rm:B.muted};

  return(
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:B.ink}}>👤 User Access Management</div>
          <div style={{fontSize:12,color:B.muted,marginTop:2}}>Add team members so they can log in to the app</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {status&&<span style={{fontSize:13,color:status.includes('✅')?B.green:status.includes('❌')?B.red:B.muted,fontWeight:600,maxWidth:300}}>{status}</span>}
          <button onClick={()=>setShowAdd(!showAdd)}
            style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
            + Add Team Member
          </button>
        </div>
      </div>

      {/* Add user form */}
      {showAdd&&<Card style={{marginBottom:16,borderLeft:`4px solid ${B.brand}`}}>
        <div style={{fontWeight:700,fontSize:14,color:B.brand,marginBottom:14}}>Add New Team Member</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginBottom:14}}>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Full Name *</div>
            {inp(newUser.name,v=>setNewUser({...newUser,name:v}),'e.g. Rohan Sharma')}
          </div>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Work Email *</div>
            {inp(newUser.email,v=>setNewUser({...newUser,email:v}),'rohan@even.in','email')}
          </div>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Password * (6+ chars)</div>
            {inp(newUser.password,v=>setNewUser({...newUser,password:v}),'Set their password','password')}
          </div>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Role *</div>
            {selEl(newUser.role,v=>setNewUser({...newUser,role:v}),ROLES)}
          </div>
          {(newUser.role==='rm'||newUser.role==='tl')&&<>
            <div>
              <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Their TL</div>
              {selEl(newUser.tl,v=>setNewUser({...newUser,tl:v}),[{v:'',l:'Select TL…'},...tls])}
            </div>
            <div>
              <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
              {selEl(newUser.city,v=>setNewUser({...newUser,city:v}),['Pune','Mumbai','Nagpur'])}
            </div>
          </>}
        </div>
        <div style={{background:B.amberBg,border:`1px solid ${B.amber}`,borderRadius:8,padding:'8px 12px',marginBottom:12,fontSize:12,color:B.amber}}>
          ⚠️ Share the email and password with the team member. They can change their password after logging in.
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={addUser} style={{padding:'9px 20px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Create Account</button>
          <button onClick={()=>setShowAdd(false)} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
        </div>
      </Card>}

      {/* Search */}
      <input value={userSearch} onChange={e=>setUserSearch(e.target.value)} placeholder="🔍 Search by name or email…"
        style={{width:'100%',maxWidth:320,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',marginBottom:12,boxSizing:'border-box'}}
        onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>

      {/* Users table */}
      {loading?<div style={{padding:40,textAlign:'center',color:B.muted}}>Loading users…</div>:
      <div className="tbl-wrap">
        <table className="dt">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>TL</th><th>City</th><th>Added</th><th>Change Role</th><th>Action</th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={8} style={{textAlign:'center',color:B.muted,padding:30}}>No users found</td></tr>}
            {filtered.map((u,i)=>(
              <tr key={i}>
                <td><strong>{u.name||'—'}</strong></td>
                <td style={{color:B.muted}}>{u.email}</td>
                <td>
                  <span style={{background:roleColors[u.role]+'18',color:roleColors[u.role]||B.muted,padding:'3px 10px',borderRadius:10,fontSize:11,fontWeight:700,textTransform:'uppercase'}}>
                    {u.role}
                  </span>
                </td>
                <td>{u.tl||'—'}</td>
                <td>{u.city||'—'}</td>
                <td style={{color:B.muted,fontSize:11}}>{u.createdAt?new Date(u.createdAt).toLocaleDateString('en-IN'):'—'}</td>
                <td>
                  <select value={u.role} onChange={e=>changeRole(u.id,e.target.value)}
                    style={{padding:'5px 8px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,background:B.white,outline:'none',cursor:'pointer'}}>
                    {ROLES.map(r=><option key={r.v} value={r.v}>{r.l.split('—')[0].trim()}</option>)}
                  </select>
                </td>
                <td>
                  <button onClick={()=>removeUser(u.id,u.name)}
                    style={{padding:'5px 10px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                    🗑️ Remove

            ))}

        </table>

      <div style={{fontSize:12,color:B.muted,marginTop:10}}>{filtered.length} user{filtered.length!==1?'s':''} with app access</div>

      {/* Reports section */}
      <div style={{marginTop:28}}>
        <div style={{fontSize:14,fontWeight:700,color:B.ink,marginBottom:10}}>📊 Download Reports</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {[
            {label:'All Targets CSV',fn:()=>downloadCSV(['TL','RM','City','Target','Achieved','Target %'],Object.values(loadStore()).map(e=>[e.tl,e.rm,e.city||'',e.target||0,e.achieved||0,pct(e.netAchieved||0,e.target||0)+'%']),'targets.csv')},
            {label:'City Summary CSV',fn:()=>downloadCSV(['City','RMs','Target','Achieved','Target %'],ZONE.cities.map(c=>[c.name,c.rms,c.target,c.achieved,pct(c.achieved,c.target)+'%']),'city_summary.csv')},
            {label:'TL Summary CSV',fn:()=>downloadCSV(['TL','City','RMs','Target','Achieved','Target %'],ZONE.tls.map(t=>[t.name,t.city,t.rms,t.target,t.achieved,pct(t.achieved,t.target)+'%']),'tl_summary.csv')},
            {label:'RM Individual CSV',fn:()=>downloadCSV(['TL','RM','City','Target','Achieved','Target %','Monthly Tgt','Monthly Achv'],ALL_RMS.map(r=>[r.tl,r.rm,r.city,r.target,r.achieved,pct(r.achieved,r.target)+'%',r.monthlyTgt,r.monthlyAchv]),'rm_individual.csv')},
          ].map(({label,fn})=>(
            <button key={label} onClick={fn}
              style={{padding:'10px 18px',background:B.white,color:B.navy,border:`1.5px solid ${B.navy}`,borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer'}}>
              ↓ {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

  const[sheetUrl,setSheetUrl]=useState(_cache.route_settings?.sheetUrl||'');
  const[routeSyncing,setRouteSyncing]=useState(false);
  const[routeSyncMsg,setRouteSyncMsg]=useState('');

  // ── Clinic management state ──
  const[workingClinics,setWorkingClinics]=useState(()=>ALL_RMS.flatMap(r=>r.clinics.map(c=>({...c,rm:r.rm,tl:r.tl,city:r.city}))));
  const[clinicSearch,setClinicSearch]=useState('');
  const[showAddClinic,setShowAddClinic]=useState(false);
  const[newClinic,setNewClinic]=useState({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});
  const[clinicSaving,setClinicSaving]=useState('');

  useEffect(()=>{setTargets(loadStore());},[]);

  const tls=ZONE.tls.map(t=>t.name);
  const rms=selectedTL?workingRMs.filter(r=>r.tl===selectedTL).map(r=>r.rm):[];

  const loadEntry=(tl,rm)=>{
    const e=targets[safeKey(`${tl}|${rm}`)]||{};
    setForm({target:e.target||'',refund:e.refund||'',monthlyLeads:e.monthlyLeads||'',dailyLeads:e.dailyLeads||'',renewalTarget:e.renewalTarget||'',netAchieved:e.netAchieved||'',monthlyAchieved:e.monthlyAchieved||'',dailyAchieved:e.dailyAchieved||'',renewalAchieved:e.renewalAchieved||''});
  };

  const saveTargets=async()=>{
    if(!selectedTL||!selectedRM){setSaving('Select TL and RM first');return;}
    setSaving('Saving…');
    const key=safeKey(`${selectedTL}|${selectedRM}`);
    const entry={tl:selectedTL,rm:selectedRM,city:workingRMs.find(r=>r.rm===selectedRM)?.city||'',
      ...Object.fromEntries(Object.entries(form).map(([k,v])=>[k,parseFloat(v)||0])),
      updated:new Date().toLocaleString('en-IN'),updatedAt:Date.now()};
    const newT={...targets,[key]:entry};
    saveStore(newT);setTargets(newT);
    setSaving('✅ Saved to Firebase!');
    setTimeout(()=>setSaving(''),3000);
  };

  const saveRMsToFirebase=async(rms)=>{
    try{ await db.collection('config').doc('rm_assignments').set({rms,updatedAt:new Date().toISOString()}); }
    catch(e){ console.warn('RM save failed:',e); }
  };

  const saveClinicsToFirebase=async(clinics)=>{
    try{ await db.collection('config').doc('clinic_assignments').set({clinics,updatedAt:new Date().toISOString()}); }
    catch(e){ console.warn('Clinic save failed:',e); }
  };

  // ── Route Sync actions ──
  const handleSaveSheetUrl=async()=>{
    if(!sheetUrl.trim()){setRouteSyncMsg('Paste the published CSV URL first');return;}
    await saveRouteSettings({sheetUrl:sheetUrl.trim()});
    setRouteSyncMsg('Sheet URL saved');
    setTimeout(()=>setRouteSyncMsg(''),3000);
  };
  const handleSyncNow=async()=>{
    if(!sheetUrl.trim()){setRouteSyncMsg('Save a sheet URL first');return;}
    setRouteSyncing(true);setRouteSyncMsg('');
    try{
      const res=await syncLeadsFromSheet(sheetUrl.trim());
      const n=Object.keys(res).filter(k=>!k.startsWith('_')).length;
      setRouteSyncMsg('Synced '+n+' clinic leads');
    }catch(e){setRouteSyncMsg('Sync failed — verify the URL and that the sheet is published as CSV');}
    setRouteSyncing(false);
    setTimeout(()=>setRouteSyncMsg(''),6000);
  };

  // ── RM Actions ──
  const handleAddRM=async()=>{
    if(!newRM.rm.trim()||!newRM.tl){setRmSaving('Fill in all fields');return;}
    if(workingRMs.find(r=>r.rm.toLowerCase()===newRM.rm.toLowerCase())){setRmSaving('RM already exists');return;}
    setRmSaving('Saving…');
    const updated=[...workingRMs,{...newRM,rm:newRM.rm.trim(),leads:0,clinics:[],target:0,achieved:0,refund:0,monthlyTgt:0,monthlyAchv:0,dailyTgt:0,dailyAchv:0,renewalTgt:0,renewalAchv:0}];
    setWorkingRMs(updated);
    await saveRMsToFirebase(updated);
    setNewRM({rm:'',tl:'',city:'Pune'});setShowAddRM(false);
    setRmSaving('✅ RM added!');setTimeout(()=>setRmSaving(''),3000);
  };

  const handleEditRM=async()=>{
    if(!editRM)return;
    setRmSaving('Saving…');
    const updated=workingRMs.map((r,i)=>i===editRM.index?{...r,tl:editRM.tl,city:editRM.city}:r);
    setWorkingRMs(updated);
    await saveRMsToFirebase(updated);
    setEditRM(null);
    setRmSaving('✅ Updated!');setTimeout(()=>setRmSaving(''),3000);
  };

  const handleRemoveRM=(index)=>{
    const rm=workingRMs[index];
    if(rm.clinics&&rm.clinics.length>0){alert(`${rm.rm} has ${rm.clinics.length} clinic(s). Reassign clinics first.`);return;}
    if(!window.confirm(`Remove ${rm.rm} from the system? This cannot be undone.`))return;
    const updated=workingRMs.filter((_,i)=>i!==index);
    setWorkingRMs(updated);
    saveRMsToFirebase(updated);
    setRmSaving('✅ RM removed');setTimeout(()=>setRmSaving(''),3000);
  };

  // ── Clinic Actions ──
  const handleReassignClinic=(clinicIndex,newRMName)=>{
    const newRMObj=workingRMs.find(r=>r.rm===newRMName);
    const updated=workingClinics.map((c,i)=>i===clinicIndex?{...c,rm:newRMName,tl:newRMObj?.tl||c.tl,city:newRMObj?.city||c.city}:c);
    setWorkingClinics(updated);
    saveClinicsToFirebase(updated);
    setClinicSaving('✅ Reassigned!');setTimeout(()=>setClinicSaving(''),3000);
  };

  const handleAddClinic=async()=>{
    if(!newClinic.name.trim()||!newClinic.rm){setClinicSaving('Fill clinic name and assign RM');return;}
    setClinicSaving('Saving…');
    const rmObj=workingRMs.find(r=>r.rm===newClinic.rm);
    const clinic={...newClinic,name:newClinic.name.trim(),tl:rmObj?.tl||'',city:rmObj?.city||newClinic.city};
    const updated=[...workingClinics,clinic];
    setWorkingClinics(updated);
    await saveClinicsToFirebase(updated);
    setNewClinic({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});
    setShowAddClinic(false);
    setClinicSaving('✅ Clinic added!');setTimeout(()=>setClinicSaving(''),3000);
  };

  const handleRemoveClinic=(index)=>{
    const c=workingClinics[index];
    if(!window.confirm(`Remove ${c.name} from route plan?`))return;
    const updated=workingClinics.filter((_,i)=>i!==index);
    setWorkingClinics(updated);
    saveClinicsToFirebase(updated);
    setClinicSaving('✅ Clinic removed');setTimeout(()=>setClinicSaving(''),3000);
  };

  const filteredRMs=workingRMs.filter(r=>!rmSearch||r.rm.toLowerCase().includes(rmSearch.toLowerCase())||r.tl.toLowerCase().includes(rmSearch.toLowerCase()));
  const filteredClinics=workingClinics.filter(c=>!clinicSearch||c.name.toLowerCase().includes(clinicSearch.toLowerCase())||c.rm.toLowerCase().includes(clinicSearch.toLowerCase()));

  const inp=(val,set,ph,type='text')=><input value={val} onChange={e=>set(e.target.value)} placeholder={ph} type={type}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>;

  const sel=(val,set,opts)=><select value={val} onChange={e=>set(e.target.value)}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
    {opts.map(o=>typeof o==='string'?<option key={o}>{o}</option>:<option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;

  const adminTabs=[['targets','🎯 Targets'],['rms','👥 RMs & TLs'],['clinics','🏥 Clinics'],['route','🗺️ Route Sync'],['settings','👤 Users & Reports']];

  return(
    <div style={{background:B.bg,minHeight:'100vh',paddingBottom:isMobile?80:20,padding:isMobile?'0 0 80px 0':'20px 24px'}}>
      {!isMobile&&<div style={{fontSize:24,fontWeight:800,color:B.navy,marginBottom:20}}>⚙️ Admin Panel</div>}
      {isMobile&&<div style={{background:'linear-gradient(135deg,#1E1B4B,#4338CA)',padding:'22px 18px 16px',borderRadius:'0 0 28px 28px',marginBottom:0}}>
        <div style={{color:'rgba(255,255,255,.65)',fontSize:12}}>Admin Panel</div>
        <div style={{color:'#fff',fontSize:20,fontWeight:800,marginTop:2}}>Sales Operations</div>
      </div>}

      {/* Admin tab nav */}
      <div style={{background:B.white,borderBottom:`1px solid ${B.line}`,display:'flex',overflowX:'auto',marginBottom:20}}>
        {adminTabs.map(([id,lbl])=>(
          <button key={id} onClick={()=>setAdminTab(id)}
            style={{padding:'12px 16px',background:'none',border:'none',borderBottom:adminTab===id?`3px solid ${B.brand}`:'3px solid transparent',color:adminTab===id?B.brand:B.muted,fontWeight:adminTab===id?700:500,fontSize:13,cursor:'pointer',whiteSpace:'nowrap'}}>
            {lbl}
          </button>
        ))}
      </div>

      <div style={{maxWidth:1000}}>

        {/* ── TARGETS TAB ── */}
        {adminTab==='targets'&&<Card>
          <div style={{fontWeight:700,fontSize:16,color:B.ink,marginBottom:4}}>🎯 Set Monthly Targets</div>
          <div style={{fontSize:12,color:B.muted,marginBottom:16}}>Saved to Firebase — visible on all devices instantly</div>
          <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
            <select value={selectedTL} onChange={e=>{setSelectedTL(e.target.value);setSelectedRM('');}}
              style={{flex:1,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',minWidth:120}}>
              <option value="">Select TL…</option>{tls.map(t=><option key={t}>{t}</option>)}
            </select>
            <select value={selectedRM} onChange={e=>{setSelectedRM(e.target.value);loadEntry(selectedTL,e.target.value);}}
              style={{flex:1,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',minWidth:120}}>
              <option value="">Select RM…</option>{rms.map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          {selectedRM&&<>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginBottom:14}}>
              {[['target','Target (₹)'],['refund','Refund (₹)'],['monthlyLeads','Monthly Leads Target'],['dailyLeads','Daily Leads Target'],['renewalTarget','Renewal Target'],['netAchieved','Net Achieved (₹)'],['monthlyAchieved','Monthly Leads Achieved'],['dailyAchieved','Daily Leads Achieved'],['renewalAchieved','Renewals Achieved']].map(([k,l])=>(
                <div key={k}>
                  <div style={{fontSize:10,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>{l}</div>
                  <input type="number" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder="0"
                    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:14,outline:'none',boxSizing:'border-box'}}
                    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <button onClick={saveTargets} style={{padding:'11px 24px',background:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>💾 Save to Firebase</button>
              {saving&&<span style={{fontSize:13,color:saving.includes('✅')?B.green:B.muted,fontWeight:600}}>{saving}</span>}
            </div>
          </>}
        </Card>}

        {/* ── RMs & TLs TAB ── */}
        {adminTab==='rms'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <input value={rmSearch} onChange={e=>setRmSearch(e.target.value)} placeholder="🔍 Search RM or TL…"
              style={{flex:1,maxWidth:300,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {rmSaving&&<span style={{fontSize:13,color:rmSaving.includes('✅')?B.green:B.red,fontWeight:600}}>{rmSaving}</span>}
              <button onClick={()=>setShowAddRM(!showAddRM)}
                style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                + Add New RM
              </button>
            </div>
          </div>

          {/* Add RM form */}
          {showAddRM&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.brand}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.brand,marginBottom:12}}>Add New RM</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>RM Name *</div>{inp(newRM.rm,v=>setNewRM({...newRM,rm:v}),'e.g. Rohan Sharma')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Assign TL *</div>
                {sel(newRM.tl,v=>setNewRM({...newRM,tl:v}),[{v:'',l:'Select TL…'},...workingTLs])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
                {sel(newRM.city,v=>setNewRM({...newRM,city:v}),['Pune','Mumbai','Nagpur'])}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleAddRM} style={{padding:'9px 20px',background:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Add RM</button>
              <button onClick={()=>{setShowAddRM(false);setNewRM({rm:'',tl:'',city:'Pune'});}} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* Edit RM modal */}
          {editRM&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.amber}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.amber,marginBottom:12}}>Edit: {editRM.rm}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Reassign to TL</div>
                {sel(editRM.tl,v=>setEditRM({...editRM,tl:v}),workingTLs)}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
                {sel(editRM.city,v=>setEditRM({...editRM,city:v}),['Pune','Mumbai','Nagpur'])}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleEditRM} style={{padding:'9px 20px',background:B.amber,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Save Changes</button>
              <button onClick={()=>setEditRM(null)} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* RM Table */}
          <div className="tbl-wrap">
            <table className="dt">
              <thead><tr><th>RM Name</th><th>TL</th><th>City</th><th className="num">Clinics</th><th className="num">Leads</th><th>Actions</th></tr></thead>
              <tbody>
                {filteredRMs.map((r,i)=>(
                  <tr key={i}>
                    <td><strong>{r.rm}</strong></td>
                    <td>{r.tl}</td>
                    <td>{r.city}</td>
                    <td className="num">{r.clinics?.length||0}</td>
                    <td className="num">{r.leads||0}</td>
                    <td>
                      <div style={{display:'flex',gap:6}}>
                        <button onClick={()=>setEditRM({index:i,rm:r.rm,tl:r.tl,city:r.city})}
                          style={{padding:'5px 12px',background:B.brandLight,color:B.brand,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                          ✏️ Edit TL
                        </button>
                        <button onClick={()=>handleRemoveRM(i)}
                          style={{padding:'5px 12px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',marginLeft:6}}>
                          🗑️ Remove
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:B.muted,marginTop:10}}>Showing {filteredRMs.length} of {workingRMs.length} RMs</div>
        </div>}

        {/* ── CLINICS TAB ── */}
        {adminTab==='clinics'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <input value={clinicSearch} onChange={e=>setClinicSearch(e.target.value)} placeholder="🔍 Search clinic or RM…"
              style={{flex:1,maxWidth:300,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {clinicSaving&&<span style={{fontSize:13,color:clinicSaving.includes('✅')?B.green:B.red,fontWeight:600}}>{clinicSaving}</span>}
              <button onClick={()=>setShowAddClinic(!showAddClinic)}
                style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                + Add New Clinic
              </button>
            </div>
          </div>

          {/* Add Clinic form */}
          {showAddClinic&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.green}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.green,marginBottom:12}}>Add New Clinic</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Clinic Name *</div>{inp(newClinic.name,v=>setNewClinic({...newClinic,name:v}),'e.g. Sunrise Clinic')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Locality</div>{inp(newClinic.locality,v=>setNewClinic({...newClinic,locality:v}),'e.g. Aundh')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Assign RM *</div>
                {sel(newClinic.rm,v=>setNewClinic({...newClinic,rm:v}),[{v:'',l:'Select RM…'},...workingRMs.map(r=>r.rm)])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Status</div>
                {sel(newClinic.status,v=>setNewClinic({...newClinic,status:v}),['Growing','Stable','Declining'])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Frequency</div>
                {sel(newClinic.freq,v=>setNewClinic({...newClinic,freq:v}),['Daily','Tri-weekly','Bi-weekly','Weekly'])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Timeslot</div>{inp(newClinic.slot,v=>setNewClinic({...newClinic,slot:v}),'e.g. 11:00–1:00')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Leads</div>{inp(newClinic.leads,v=>setNewClinic({...newClinic,leads:parseInt(v)||0}),'0','number')}</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleAddClinic} style={{padding:'9px 20px',background:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Add Clinic</button>
              <button onClick={()=>{setShowAddClinic(false);setNewClinic({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});}} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* Clinic Table */}
          <div className="tbl-wrap">
            <table className="dt">
              <thead><tr><th>Clinic</th><th>Locality</th><th>Current RM</th><th>TL</th><th>City</th><th className="num">Leads</th><th>Status</th><th>Reassign RM</th><th>Action</th></tr></thead>
              <tbody>
                {filteredClinics.map((c,i)=>(
                  <tr key={i}>
                    <td><strong>{c.name}</strong></td>
                    <td style={{color:B.muted}}>{c.locality||'—'}</td>
                    <td>{c.rm}</td>
                    <td>{c.tl}</td>
                    <td>{c.city}</td>
                    <td className="num">{c.leads||0}</td>
                    <td><SBadge status={c.status}/></td>
                    <td>
                      <select defaultValue={c.rm} onChange={e=>handleReassignClinic(i,e.target.value)}
                        style={{padding:'5px 8px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,background:B.white,outline:'none',cursor:'pointer',minWidth:130}}>
                        {workingRMs.map(r=><option key={r.rm} value={r.rm}>{r.rm}</option>)}
                      </select>
                    </td>
                    <td>
                      <button onClick={()=>handleRemoveClinic(i)}
                        style={{padding:'5px 10px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        🗑️
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:B.muted,marginTop:10}}>Showing {filteredClinics.length} of {workingClinics.length} clinics</div>
        </div>}

        {/* ── ROUTE SYNC TAB ── */}
        {adminTab==='route'&&<div>
          <Card style={{marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:16,color:B.ink,marginBottom:4}}>Route Plan — Sheet Sync</div>
            <div style={{fontSize:12,color:B.muted,marginBottom:18}}>Connect a published Google Sheet to update clinic lead counts daily. One sync overwrites all leads with the sheet values.</div>

            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:B.muted,marginBottom:6,fontWeight:600,textTransform:'uppercase'}}>Google Sheet CSV URL</div>
              <input value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)}
                placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"
                style={{width:'100%',padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
              <div style={{fontSize:11,color:B.muted,marginTop:6,lineHeight:1.6}}>
                In Google Sheets: <strong>File → Share → Publish to web</strong> → choose the sheet → select <strong>CSV</strong> → Publish. Copy the URL here.
              </div>
            </div>

            <div style={{background:B.amberBg,border:`1px solid ${B.amber}`,borderRadius:10,padding:'12px 14px',marginBottom:18}}>
              <div style={{fontWeight:700,fontSize:12,color:B.amber,marginBottom:6}}>Required sheet format</div>
              <div style={{fontSize:12,color:B.ink,lineHeight:1.7}}>
                Row 1 (header): <strong>Clinic Name, Leads</strong><br/>
                Row 2+: Exact clinic name as shown in app, today's lead count<br/>
                Example: <code style={{background:'rgba(0,0,0,.06)',padding:'0 4px',borderRadius:4}}>MEDISURE Health Clinic,156</code>
              </div>
            </div>

            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <button onClick={handleSaveSheetUrl}
                style={{padding:'10px 20px',background:B.navy,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save URL
              </button>
              <button onClick={handleSyncNow} disabled={routeSyncing}
                style={{padding:'10px 20px',background:routeSyncing?B.muted:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:routeSyncing?'default':'pointer'}}>
                {routeSyncing?'Syncing…':'↻ Sync Now'}
              </button>
              {routeSyncMsg&&<span style={{fontSize:13,color:routeSyncMsg.includes('failed')||routeSyncMsg.includes('verify')?B.red:B.green,fontWeight:600}}>{routeSyncMsg}</span>}
            </div>

            {_cache.route_settings?.lastSynced&&(
              <div style={{marginTop:14,fontSize:12,color:B.muted}}>
                Last synced: {new Date(_cache.route_settings.lastSynced).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
              </div>
            )}
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:14,color:B.ink,marginBottom:10}}>How it works</div>
            <div style={{fontSize:13,color:B.muted,lineHeight:1.8}}>
              1. Maintain a Google Sheet with two columns: Clinic Name and today's lead count.<br/>
              2. Each morning, update the counts and click "Sync Now" (or use the button on the Route Plan page).<br/>
              3. Lead counts update instantly for everyone. The previous count shows with a strikethrough.<br/>
              4. Each day's data is stored in history automatically.<br/>
              5. <strong style={{color:B.ink}}>Status is auto-calculated</strong> by comparing this week vs same days last week:<br/>
              &nbsp;&nbsp;&nbsp;• &gt;10% more leads → <span style={{color:B.green,fontWeight:700}}>Growing</span><br/>
              &nbsp;&nbsp;&nbsp;• &gt;10% fewer leads → <span style={{color:B.red,fontWeight:700}}>Declining</span><br/>
              &nbsp;&nbsp;&nbsp;• Within ±10% → <span style={{color:B.blue2,fontWeight:700}}>Stable</span><br/>
              6. When status changes, the RM gets a notification automatically.
            </div>
          </Card>

          <Card style={{borderLeft:'4px solid #1b5e20',marginTop:0}}>
            <div style={{fontWeight:700,fontSize:16,color:'#1b5e20',marginBottom:4}}>Google Sheets Sync</div>
            <div style={{fontSize:13,color:B.muted,marginBottom:0}}>Pull live targets and achievements from your Google Sheet. Updates all RM data for the current month.</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginTop:12}}>
              <button onClick={()=>syncFromGoogleSheet()}
                style={{padding:'10px 20px',background:'#1b5e20',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Pull from Google Sheet
              </button>
              <span id="sheetSyncStatus" style={{fontSize:12.5,color:B.muted}}></span>
            </div>
          </Card>
        </div>}

        {/* ── USERS TAB ── */}
        {adminTab==='settings'&&<UsersTab/>}


      </div>
    </div>
  );
}

// ── FULL ACCESS VIEW ───────────────────────────────────────────────────────
function FullAccessView({user,onLogout}){
  const[screen,setScreen]=useState('zone');
  const isMobile=useIsMobile();
  const isAdmin=user.role==='admin';
  const content=<>
    {screen==='zone'&&<ZoneOverviewPanel/>}
    {screen==='route'&&<RoutePlanPanel user={user}/>}
    {screen==='teams'&&<AllTeamsPanel/>}
    {screen==='admin'&&<AdminPanel/>}
  </>;
  if(isMobile) return(
    <div style={{maxWidth:600,margin:'0 auto',background:B.bg,minHeight:'100vh'}}>
      <div style={{position:'fixed',top:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,background:isAdmin?'#1E1B4B':B.brandDark,padding:'6px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',zIndex:150}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:16,fontWeight:900,color:'#fff',letterSpacing:-0.5}}>even</span>
          <span style={{color:'rgba(255,255,255,.7)',fontSize:11,fontWeight:600}}>{isAdmin?'⚡ Admin':'🔭 Zonal'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{background:'rgba(255,255,255,.15)',color:'rgba(255,255,255,.8)',fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10}}>FULL ACCESS</span>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.15)',border:'none',color:'rgba(255,255,255,.8)',borderRadius:8,padding:'4px 10px',fontSize:10,cursor:'pointer'}}>Out</button>
        </div>
      </div>
      <div style={{paddingTop:34}}>{content}</div>
      <FullNav screen={screen} setScreen={setScreen}/>
    </div>
  );
  // Desktop
  return(
    <div style={{display:'flex',minHeight:'100vh'}}>
      <DesktopSideNav screen={screen} setScreen={setScreen} user={user} onLogout={onLogout}/>
      <div style={{flex:1,overflow:'auto'}}>{content}</div>
    </div>
  );
}

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);const[loading,setLoading]=useState(true);const[initMsg,setInitMsg]=useState('Starting up…');
  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(fu)=>{
      if(fu){
        setInitMsg('Loading your data…');
        await initFirestore();
        const doc=await db.collection('users').doc(fu.uid).get();
        if(doc.exists){setUser({...doc.data(),uid:fu.uid});}
        else{
          const mapped=ROLE_MAP[fu.email?.toLowerCase()];
          if(mapped){await db.collection('users').doc(fu.uid).set({email:fu.email,...mapped,createdAt:new Date().toISOString()});setUser({...mapped,uid:fu.uid,email:fu.email});}
          else{await auth.signOut();}
        }
      }
      setLoading(false);
    });
    return()=>unsub();
  },[]);
  const handleLogin=async(u)=>{setInitMsg('Loading your data…');setLoading(true);await initFirestore();setUser(u);setLoading(false);};
  const handleLogout=async()=>{await auth.signOut();setUser(null);_cache={targets:{},tl_targets:{},admin_state:null,tl_notes:{},loaded:false};};
  if(loading)return <LoadingScreen message={initMsg}/>;
  if(!user)return <Login onLogin={handleLogin}/>;
  const role=user.role;
  if(role==='zonal'||role==='admin')return <FullAccessView user={user} onLogout={handleLogout}/>;
  if(role==='tl')return <TLView user={user} onLogout={handleLogout}/>;
  return <RMView user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
