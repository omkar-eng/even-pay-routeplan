// Returns the ISO date string (YYYY-MM-DD) of the Monday of the given date
function getMondayStr(d=new Date()){
  const day=new Date(d);day.setHours(0,0,0,0);
  day.setDate(day.getDate()-((day.getDay()+6)%7));
  return day.toISOString().slice(0,10);
}

async function fetchDayLeads(dateStr){
  try{const s=await db.collection('leadHistory').doc(dateStr).get();return(s.exists?s.data():{});}
  catch(e){return {};}
}

// Sums lead history for `dayCount` days starting from the given Monday
async function getWeekTotals(mondayStr,dayCount){
  const mon=new Date(mondayStr);
  const dates=Array.from({length:dayCount},(_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    return d.toISOString().slice(0,10);
  });
  const snaps=await Promise.all(dates.map(fetchDayLeads));
  const totals={};
  snaps.forEach(data=>{
    Object.entries(data).forEach(([k,v])=>{
      if(!k.startsWith('_')&&typeof v==='number')totals[k]=(totals[k]||0)+v;
    });
  });
  return totals;
}

// Derives Growing / Stable / Declining per clinic using ±10% thresholds
function deriveStatuses(curr,prev){
  const result={};
  ALL_RMS.forEach(r=>r.clinics.forEach(c=>{
    const k=clinicKey(r.rm,c.name);
    const cv=curr[k]||0;const pv=prev[k]||0;
    if(pv===0){result[k]='Stable';return;}
    const chg=(cv-pv)/pv;
    result[k]=chg>0.1?'Growing':chg<-0.1?'Declining':'Stable';
  }));
  return result;
}

async function syncLeadsFromSheet(sheetUrl){
  const resp=await fetch(sheetUrl);
  if(!resp.ok)throw new Error('Fetch failed: '+resp.status);
  const text=await resp.text();
  const lines=text.split('\n').filter(l=>l.trim());
  const rawMap={};
  for(let i=1;i<lines.length;i++){
    const row=lines[i].replace(/\r/,'');
    const m=row.match(/^"?([^",\n]+)"?,\s*(\d+)/);
    if(m)rawMap[m[1].trim()]=parseInt(m[2])||0;
  }

  // Build clinicKey → today's leads map
  const liveLeads={};const todayData={};
  ALL_RMS.forEach(r=>r.clinics.forEach(c=>{
    if(rawMap[c.name]!==undefined){
      const k=clinicKey(r.rm,c.name);
      liveLeads[k]=rawMap[c.name];
      todayData[k]=rawMap[c.name];
    }
  }));

  // Persist today's counts to lead history
  const todayStr=new Date().toISOString().slice(0,10);
  await db.collection('leadHistory').doc(todayStr).set({...todayData,_updatedAt:new Date().toISOString()}).catch(()=>{});

  // Compare this week vs same days last week (apples-to-apples)
  const dayOfWeek=(new Date().getDay()+6)%7; // 0=Mon … 6=Sun
  const daysElapsed=dayOfWeek+1;
  const currMonday=getMondayStr();
  const prevMonday=getMondayStr(new Date(Date.now()-7*86400000));
  const[currTotals,prevTotals]=await Promise.all([
    getWeekTotals(currMonday,daysElapsed),
    getWeekTotals(prevMonday,daysElapsed)
  ]);

  const newStatuses=deriveStatuses(currTotals,prevTotals);

  // Fire notifications for any status that changed
  const existing=_cache.clinic_statuses||{};
  await Promise.all(ALL_RMS.flatMap(r=>r.clinics.map(async c=>{
    const k=clinicKey(r.rm,c.name);
    const oldStatus=existing[k]||c.status;
    const newStatus=newStatuses[k];
    if(newStatus&&oldStatus!==newStatus)await saveStatusNotif(c.name,oldStatus,newStatus,r.rm);
  })));

  // Save auto-derived statuses and live leads
  _cache.clinic_statuses={..._cache.clinic_statuses,...newStatuses};
  await db.collection('config').doc('clinic_statuses').set(_cache.clinic_statuses).catch(()=>{});
  liveLeads._updatedAt=new Date().toISOString();
  await db.collection('config').doc('live_leads').set(liveLeads).catch(()=>{});
  _cache.live_leads=liveLeads;
  await saveRouteSettings({sheetUrl,lastSynced:liveLeads._updatedAt});
  return liveLeads;
}

function calcVisitFreq(c){
  const status=(c.Status||'').toUpperCase();
  const trend=c.Trend||'';
  const gl=parseFloat(c['GL%'])||0;
  const dormancy=c.dormancy_status||'';
  const daysLive=parseInt(c['Days since go-live'])||0;
  if((daysLive>0&&daysLive<30)||dormancy==='Never active')return'Daily';
  if(dormancy.includes('14+'))return'Daily';
  if(status.includes('BELOW')||trend==='Declining')return'Daily';
  if(gl>0&&gl<20)return'Daily';
  if(dormancy.includes('7-14'))return'Bi-weekly';
  if(status.includes('RAMPING')||(daysLive>=30&&daysLive<60))return'Bi-weekly';
  return'Bi-weekly';
}

function buildRMPlan(data){
  const disabledSet=new Set((data.disabled||[]).map(c=>(c.Clinic||c.clinic||'').trim().toLowerCase()).filter(Boolean));
  const all=[];const seen=new Set();
  (data.live_status||[]).forEach(c=>{
    const rm=(c.RM||'').trim();const name=(c.Clinic||'').trim();
    if(!rm||!name)return;if(disabledSet.has(name.toLowerCase()))return;
    const k=(rm+'|'+name).toLowerCase();
    if(seen.has(k))return;seen.add(k);
    all.push({name,rm,city:c.City||'',cam:c.CAM||'',status:c.Status||'',
      gl:parseFloat(c['GL%'])||0,trend:c.Trend||'',avgLeads:parseFloat(c['Avg leads/day'])||0,
      totalLeads:c['Total leads']||'',weeks:c['Weeks']||'',
      source:'live',frequency:calcVisitFreq(c)});
  });
  (data.needs_action||[]).forEach(c=>{
    const rm=(c.rm||'').trim();const name=(c.clinic||'').trim();
    if(!rm||!name)return;if(disabledSet.has(name.toLowerCase()))return;
    const k=(rm+'|'+name).toLowerCase();
    if(seen.has(k))return;seen.add(k);
    all.push({name,rm,city:c.city||'',cam:c.cam||'',status:'Dormant',gl:0,trend:'',
      dormancy:c.dormancy_status||'',daysSince:parseInt(c.days_since_last_lead)||0,
      lifetimeLeads:c.lifetime_leads||'',lastLeadDate:c.last_lead_date||'',
      source:'action',frequency:calcVisitFreq(c)});
  });
  (data.new_onboarded||[]).forEach(c=>{
    const rm=(c.rm||'').trim();const name=(c.clinic||'').trim();
    if(!rm||!name)return;if(disabledSet.has(name.toLowerCase()))return;
    const k=(rm+'|'+name).toLowerCase();
    if(seen.has(k))return;seen.add(k);
    all.push({name,rm,city:c.city||'',cam:c.cam||'',status:'New',gl:0,trend:'New',
      daysLive:parseInt(c['Days since go-live'])||0,goLiveDate:c['Go-live date']||'',
      totalLeads:c['Total leads']||'',avgLeads:parseFloat(c['Avg leads/day'])||0,
      source:'new',frequency:calcVisitFreq(c)});
  });
  const rmMap={};
  all.forEach(c=>{
    if(!rmMap[c.rm])rmMap[c.rm]={rm:c.rm,city:c.city,clinics:[]};
    rmMap[c.rm].clinics.push(c);
  });
  const biPairs=[[1,4],[2,5],[3,6]];
  Object.values(rmMap).forEach(r=>{
    r.clinics.sort((a,b)=>({'Daily':0,'Bi-weekly':1}[a.frequency]||1)-({'Daily':0,'Bi-weekly':1}[b.frequency]||1)||a.name.localeCompare(b.name));
    let bi=0;
    r.clinics.forEach(c=>{
      if(c.frequency==='Daily')c.visitDays=[1,2,3,4,5,6];
      else{c.visitDays=biPairs[bi%3];bi++;}
    });
  });
  return Object.values(rmMap).sort((a,b)=>a.rm.localeCompare(b.rm));
}

function isVisitToday(c){const d=new Date().getDay();return(c.visitDays||[]).includes(d);}

function cleanStatus(s){return(s||'').replace(/^\d+\.\s*/,'').trim();}

async function detectPlanChangesAndNotify(oldData,newData){
  if(!(oldData?.live_status||[]).length)return;
  const oldMap={};
  (oldData.live_status||[]).forEach(c=>{if(c.Clinic)oldMap[c.Clinic.toLowerCase()]=c;});
  const notifs=[];const now=new Date().toISOString();
  for(const c of(newData.live_status||[])){
    const old=oldMap[(c.Clinic||'').toLowerCase()];
    const rm=c.RM||c.rm;if(!old||!rm)continue;
    if(old.Status!==c.Status&&old.Status&&c.Status)
      notifs.push({rmName:rm,type:'status_change',read:false,createdAt:now,
        message:`${c.Clinic}: ${cleanStatus(old.Status)} → ${cleanStatus(c.Status)}`});
    if(old.Trend!=='Declining'&&c.Trend==='Declining')
      notifs.push({rmName:rm,type:'plan_change',read:false,createdAt:now,
        message:`${c.Clinic} is now Declining — moved to daily visits`});
    const of2=calcVisitFreq(old),nf=calcVisitFreq(c);
    if(of2!==nf&&old.Status===c.Status)
      notifs.push({rmName:rm,type:'plan_change',read:false,createdAt:now,
        message:`${c.Clinic} visit schedule: ${of2} → ${nf}`});
  }
  if(notifs.length)await Promise.all(notifs.map(n=>db.collection('notifications').add(n).catch(()=>{})));
}

async function checkAndResetMonthlyTargets(){
  const monthKey=new Date().toISOString().slice(0,7); // "YYYY-MM"
  // Cache check first (fast path)
  if((_cache.monthly_reset||{}).month===monthKey)return false;
  // Cache may be stale — do a fresh Firestore read as authoritative guard
  try{
    const freshDoc=await db.collection('config').doc('monthly_reset').get();
    const freshData=freshDoc.exists?freshDoc.data():{};
    if(freshData.month===monthKey){
      _cache.monthly_reset=freshData; // sync cache
      return false;
    }
  }catch(e){console.warn('monthly_reset check:',e);}
  // Extra safety: never auto-reset if targets were already set this month
  const hasCurrentMonthTargets=Object.values(_cache.targets).some(t=>(!t.targetMonth||t.targetMonth===monthKey)&&(t.target||0)>0);
  if(hasCurrentMonthTargets)return false;
  // ── Archive outgoing month before zeroing ──
  const prevMonthKey=_cache.monthly_reset?.month; // last recorded month
  if(prevMonthKey){
    const archiveData={
      month:prevMonthKey,
      archivedAt:new Date().toISOString(),
      targets:{..._cache.targets},
      tl_targets:{..._cache.tl_targets},
    };
    db.collection('history').doc(prevMonthKey).set(archiveData).catch(()=>{});
  }
  // ── Zero out live targets ──
  const resetFields={target:0,targetMonth:'',refund:0,monthlyLeads:0,dailyLeads:0,renewalTarget:0,
    netAchieved:0,monthlyAchieved:0,dailyAchieved:0,renewalAchieved:0};
  Object.keys(_cache.targets).forEach(k=>{_cache.targets[k]={..._cache.targets[k],...resetFields};});
  const tlReset={};
  Object.entries(_cache.tl_targets||{}).forEach(([k,v])=>{tlReset[k]={...v,...resetFields};});
  _cache.tl_targets=tlReset;
  // Payment rows are NOT cleared — they carry dates and the date filter separates months
  const resetMeta={month:monthKey,resetAt:new Date().toISOString()};
  _cache.monthly_reset=resetMeta;
  const rmWrites=Object.keys(_cache.targets).map(k=>
    db.collection('targets').doc(k).update(resetFields).catch(()=>{})
  );
  await Promise.all([
    ...rmWrites,
    db.collection('config').doc('tl_targets').set(tlReset).catch(()=>{}),
    db.collection('config').doc('monthly_reset').set(resetMeta).catch(()=>{}),
  ]);
  applyStoreToRMs();
  window.dispatchEvent(new Event('rmDataUpdated'));
  return true;
}

function setupSheetPushListener(){
  if(_sheetPushUnsub)_sheetPushUnsub();
  _sheetPushUnsub=db.collection('config').doc('sync_trigger').onSnapshot(snap=>{
    if(!snap.exists||!_cache.loaded)return;
    // Skip the initial snapshot that fires on page load
    const ts=snap.data()?.updatedAt;
    const lastSync=_cache.sync_settings?.lastSynced;
    if(!ts||ts===_lastPushTs)return;
    _lastPushTs=ts;
    // Only sync if the trigger is newer than our last sync
    if(lastSync&&new Date(ts)<=new Date(lastSync))return;
    console.log('Sheet change detected — syncing…');
    syncFromGoogleSheet({silent:true});
  });
}

// Edit distance — catches typos like "Yalaling" vs "Yallaling"
function _editDist(a,b){
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp[i]=new Array(n+1).fill(0);dp[i][0]=i;}
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function parseDateInput(s){
  // HTML date inputs give "YYYY-MM-DD"; new Date("YYYY-MM-DD") is UTC midnight
  // which in IST = 5:30 AM, causing payments at local midnight to be excluded.
  // Always construct as LOCAL midnight.
  if(!s)return null;
  const p=s.split('-').map(Number);
  return new Date(p[0],p[1]-1,p[2]);
}
function parsePayDate(s){
  if(!s)return null;s=String(s).trim();
  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(m1)return new Date(+m1[3],+m1[2]-1,+m1[1]);
  // YYYY-MM-DD (ISO, with or without time component)
  const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2){
    if(s.includes('T')){
      // Full ISO timestamp — parse as Date and read LOCAL components.
      // "2026-04-30T18:30:00.000Z" = midnight IST May 1, not April 30.
      const d=new Date(s);
      if(!isNaN(d))return new Date(d.getFullYear(),d.getMonth(),d.getDate());
    }
    return new Date(+m2[1],+m2[2]-1,+m2[3]);
  }
  // MM/DD/YYYY (US format fallback)
  const m3=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m3){const d=new Date(+m3[3],+m3[2]-1,+m3[1]);if(!isNaN(d))return d;}
  const d=new Date(s);return isNaN(d.getTime())?null:d;
}
let _payDateKey=null; // cached column name, reset on each sync
function detectPayDateKey(rows){
  if(!rows||!rows.length)return null;
  const KNOWN=['Date','Payment Date','Date of Payment','date','DATE','Pmt Date','PaymentDate','PAYMENT DATE','payment_date','Trans Date','Transaction Date'];
  const sample=rows.slice(0,10);
  // Check known column names first — use first row to confirm column exists, then scan sample for a parseable date
  for(const k of KNOWN){
    if(sample[0][k]===undefined)continue;
    if(sample.some(r=>parsePayDate(String(r[k]||'').trim())))return k;
  }
  // Fallback: scan all keys across sample rows for date-like values
  for(const k of Object.keys(sample[0])){
    if(sample.some(r=>{const v=String(r[k]||'').trim();return v&&parsePayDate(v)&&isNaN(Number(v));}))return k;
  }
  return null;
}
function getDateRangeFromLabel(label){
  const t=new Date();const y=t.getFullYear(),m=t.getMonth();
  if(label==='This Month')return{from:new Date(y,m,1),to:new Date(y,m+1,0)};
  if(label==='Last Month')return{from:new Date(y,m-1,1),to:new Date(y,m,0)};
  if(label==='This Week'){const dow=(t.getDay()+6)%7;return{from:new Date(y,m,t.getDate()-dow),to:t};}
  if(label==='Last 3 Months')return{from:new Date(y,m-3,1),to:t};
  return null;
}
function computeFilteredPayments(from,to){
  const rows=_cache.payment_rows||[];
  const toEnd=to?new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59,999):null;
  const filtered=rows.filter(r=>{
    const d=parsePayDate(r.date);if(!d)return false;
    if(from&&d<from)return false;
    if(toEnd&&d>toEnd)return false;
    return true;
  });
  const payByRM={},payByTL={};
  filtered.forEach(r=>{
    if(r.rm)payByRM[r.rm]=(payByRM[r.rm]||0)+r.amount;
    if(r.tl)payByTL[r.tl]=(payByTL[r.tl]||0)+r.amount;
  });
  const{rmPayments}=buildRMPayments(payByRM,ALL_RMS.map(r=>r.rm));
  const total=filtered.reduce((s,r)=>s+r.amount,0);
  return{rmPayments,tlPayments:payByTL,total,rows:filtered};
}
function buildRMPayments(payByRM, targetRMNames){
  const rmPayments={}, rmDisplayName={};
  // Pass 1 — exact match (highest confidence, claim these first)
  const claimed=new Set();
  for(const[k,amt]of Object.entries(payByRM)){
    const t=targetRMNames.find(n=>n.toLowerCase()===k);
    if(t){
      const lo=t.toLowerCase();
      rmPayments[lo]=(rmPayments[lo]||0)+amt;
      if(!rmDisplayName[lo]||k.length>rmDisplayName[lo].length)rmDisplayName[lo]=k;
      claimed.add(k);
    }
  }
  // Pass 2 — fuzzy first-word match for unclaimed payment keys
  for(const[k,amt]of Object.entries(payByRM)){
    if(claimed.has(k))continue;
    const kfw=k.split(/\s+/)[0];
    let bestD=Infinity,bestT=null;
    for(const t of targetRMNames){
      const d=_editDist(kfw,t.toLowerCase().split(/\s+/)[0]);
      if(d<=1&&d<bestD){bestD=d;bestT=t;}
    }
    if(bestT){
      const lo=bestT.toLowerCase();
      rmPayments[lo]=(rmPayments[lo]||0)+amt;
      if(!rmDisplayName[lo]||k.length>rmDisplayName[lo].length)rmDisplayName[lo]=k;
      claimed.add(k);
    }
  }
  // Pass 3 — first-word prefix match (e.g. "Rupesh Pendum" → "Rupeshkumar Pendum")
  for(const[k,amt]of Object.entries(payByRM)){
    if(claimed.has(k))continue;
    const kp=k.split(/\s+/);const kfw=kp[0];const klw=kp[kp.length-1];
    let bestT=null,bestD=Infinity;
    for(const t of targetRMNames){
      const tp=t.toLowerCase().split(/\s+/);const tfw=tp[0];const tlw=tp[tp.length-1];
      const prefixOk=kfw.startsWith(tfw)||tfw.startsWith(kfw);
      const lastD=_editDist(klw,tlw);
      if(prefixOk&&lastD<=1&&lastD<bestD){bestD=lastD;bestT=t;}
    }
    if(bestT){
      const lo=bestT.toLowerCase();
      rmPayments[lo]=(rmPayments[lo]||0)+amt;
      if(!rmDisplayName[lo]||k.length>rmDisplayName[lo].length)rmDisplayName[lo]=k;
    }
  }
  return{rmPayments,rmDisplayName};
}

async function fetchMetabaseLeads(){
  const cfg=_cache.metabase_settings||{};
  if(!cfg.apiKey||!cfg.proxyUrl)return null;
  const dashId=cfg.dashboardId||529;
  const bust='&_='+Date.now();
  try{
    const result=await fetch(
      `${cfg.proxyUrl}?tab=metabase&apiKey=${encodeURIComponent(cfg.apiKey)}&dashId=${dashId}${bust}`,
      {cache:'no-store'}
    ).then(r=>r.json());
    if(result?.status==='ok')return result.data?.rows||[];
    if(result?.status==='error')console.warn('Metabase proxy error:',result.message);
    return null;
  }catch(e){
    console.warn('Metabase fetch failed:',e.message);
    return null;
  }
}

function buildLeadsMap(rows){
  const nrm=s=>(s||'').toString().toLowerCase().trim().replace(/\s+/g,' ');
  _LEADS_BY_RM={};
  rows.forEach(row=>{
    const rmN=nrm(row['RM']||'');
    if(!rmN)return;
    if(!_LEADS_BY_RM[rmN]){_LEADS_BY_RM[rmN]={rm:row['RM'],city:row['City']||'',totalLeads:0,avgPerDay:0,glPct:0,trend:'',clinics:[]};}
    const e=_LEADS_BY_RM[rmN];
    const tl=parseFloat(row['Total leads'])||0;
    const apd=parseFloat(row['Avg leads/day'])||0;
    const gl=parseFloat((row['GL%']||'0').toString().replace('%',''))||0;
    e.totalLeads+=tl;
    e.clinics.push({clinic:row['Clinic']||'',status:row['Status']||'',cam:row['CAM']||'',avgPerDay:apd,glPct:gl,trend:row['Trend']||'',weeks:parseFloat(row['Weeks'])||0,totalLeads:tl,city:row['City']||''});
  });
  Object.values(_LEADS_BY_RM).forEach(e=>{
    const tot=e.totalLeads;
    if(tot>0){
      e.avgPerDay=e.clinics.reduce((s,c)=>s+c.avgPerDay*(c.totalLeads||1),0)/e.clinics.reduce((s,c)=>s+(c.totalLeads||1),0);
      e.glPct=e.clinics.reduce((s,c)=>s+c.glPct*(c.totalLeads||1),0)/e.clinics.reduce((s,c)=>s+(c.totalLeads||1),0);
    }
    const ts=e.clinics.map(c=>c.trend.toLowerCase());
    const up=ts.filter(t=>t.includes('up')).length,dn=ts.filter(t=>t.includes('down')).length;
    e.trend=up>dn?'Up':dn>up?'Down':'Stable';
  });
}

function applyManualTargets(){
  // Manual targets live in config/manual_targets — untouched by sheet sync.
  // After every sync this runs to override whatever the sheet wrote.
  const curMK=new Date().toISOString().slice(0,7);
  Object.entries(_cache.manual_targets||{}).forEach(([k,m])=>{
    if(!m.target||m.targetMonth!==curMK)return;
    if(_cache.targets[k]){
      _cache.targets[k].target=m.target;
      _cache.targets[k].inactive=false;
      _cache.targets[k].targetMonth=curMK;
    }
    const idx=ALL_RMS.findIndex(r=>safeKey(`${r.tl}|${r.rm}`)===k);
    if(idx>=0){ALL_RMS[idx].target=m.target;ALL_RMS[idx].inactive=false;}
  });
}

async function syncFromGoogleSheet({silent=false}={}){
  const el=document.getElementById('sheetSyncStatus');
  if(el){el.textContent=silent?'Auto-syncing…':'Syncing…';el.style.color='#64748B';}
  try{
    const bust='&_='+Date.now();
    const _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const _nowD=new Date();
    const _autoTTab=`RM Targets ${_MONTHS[_nowD.getMonth()]}`;
    const _autoLMTab=`RM Targets ${_MONTHS[_nowD.getMonth()===0?11:_nowD.getMonth()-1]}`;
    const _tTab=(_cache.sync_settings?.targetsTab||_autoTTab).trim();
    const _lmTab=(_cache.sync_settings?.lastMonthTab||_autoLMTab).trim();
    const [jTargets,jPayments,jMonthlyTgts,jLastMonthTgts,jLeads]=await Promise.all([
      fetch(SHEET_SCRIPT_URL+'?tab=targets'+bust,{cache:'no-store'}).then(r=>r.json()),
      fetch(SHEET_SCRIPT_URL+'?tab=payments'+bust,{cache:'no-store'}).then(r=>r.json()),
      fetch(SHEET_SCRIPT_URL+'?tab='+encodeURIComponent(_tTab)+bust,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      fetch(SHEET_SCRIPT_URL+'?tab='+encodeURIComponent(_lmTab)+bust,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      fetch(SHEET_SCRIPT_URL+'?tab=leads'+bust,{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    ]);
    // Capture debug info immediately after fetch — before any error checks
    window._syncDebug={
      lmTab:_lmTab,
      lmStatus:jLastMonthTgts?.status||'(no response)',
      lmMessage:jLastMonthTgts?.message||'',
      lmRowCount:(jLastMonthTgts?.data?.rows||jLastMonthTgts?.data?.targets||[]).length,
      lmFirstRow:JSON.stringify((jLastMonthTgts?.data?.rows||jLastMonthTgts?.data?.targets||[])[0]||null),
      lmMapCount:0,lmMapSample:'(processing not reached)',
      targetsStatus:jTargets?.status,targetsMsg:jTargets?.message||'',
    };
    if(jTargets.status!=='ok')throw new Error('targets: '+(jTargets.message||'error'));
    if(jPayments.status!=='ok')throw new Error('payments: '+(jPayments.message||'error'));
    const rows=jTargets.data.rows||jTargets.data.targets||[];
    const paymentRows=jPayments.data.rows||jPayments.data.payments||[];
    // Build monthly target map from the dedicated targets tab if configured
    const normN=s=>s.toString().toLowerCase().trim().replace(/\s+/g,' ');
    const monthlyTgtMap={};   // normN(name) → target amount
    const monthlyTgtRows=[];  // raw rows for fuzzy fallback
    if(jMonthlyTgts?.status==='ok'){
      const tRows=jMonthlyTgts.data?.rows||jMonthlyTgts.data?.targets||(Array.isArray(jMonthlyTgts.data)?jMonthlyTgts.data:[]);
      tRows.forEach(row=>{
        const actualName=(row['Actual RM Name']||row['RM']||'').toString().trim();
        const rmName=(row['RM Name']||row['RM']||'').toString().trim();
        const rawTgt=row['Target (₹)']??row['Target (INR)']??row['Target']??'';
        const tgt=typeof rawTgt==='number'?rawTgt:parseFloat(rawTgt.toString().replace(/[₹,\s]/g,''))||0;
        if(tgt>0){
          if(actualName)monthlyTgtMap[normN(actualName)]=tgt;
          if(rmName&&rmName!==actualName)monthlyTgtMap[normN(rmName)]=tgt;
          monthlyTgtRows.push({actualName,rmName,tgt});
        }
      });
    }
    // Pre-compute exclusive one-to-one assignment: each June entry → at most one sheet RM
    // Prevents same June target being counted for multiple sheet RMs (double-counting)
    const precomputedTargets={};
    if(_tTab&&monthlyTgtRows.length>0){
      const sheetNorms=[...new Set(rows.map(r=>normN((r.RM||'').trim())).filter(Boolean))];
      const candidates=[];
      for(const norm of sheetNorms){
        for(let i=0;i<monthlyTgtRows.length;i++){
          const entry=monthlyTgtRows[i];
          let score=0;
          for(const cand of[entry.actualName,entry.rmName]){
            if(!cand)continue;
            const cn=normN(cand);
            if(cn===norm){score=1.0;break;}
            const sc=fuzzyRMScore(norm,cn);
            if(sc>score)score=sc;
          }
          if(score>0.65)candidates.push({norm,entryIdx:i,score});
        }
      }
      candidates.sort((a,b)=>b.score-a.score);
      const usedRMs=new Set(),usedEntries=new Set();
      for(const c of candidates){
        if(usedRMs.has(c.norm)||usedEntries.has(c.entryIdx))continue;
        usedRMs.add(c.norm);usedEntries.add(c.entryIdx);
        precomputedTargets[c.norm]=monthlyTgtRows[c.entryIdx].tgt;
      }
    }
    const hasTabData=_tTab&&monthlyTgtRows.length>0;
    const getMonthlyTgt=(dispRM,shRM)=>{
      if(hasTabData)return precomputedTargets[normN(shRM)]||precomputedTargets[normN(dispRM)]||0;
      const exact=monthlyTgtMap[normN(dispRM)]||monthlyTgtMap[normN(shRM)];
      if(exact)return exact;
      let best=0,bestTgt=0;
      for(const entry of monthlyTgtRows){
        for(const cand of[entry.actualName,entry.rmName]){
          if(!cand)continue;
          const sc=fuzzyRMScore(normN(dispRM),normN(cand));
          if(sc>0.65&&sc>best){best=sc;bestTgt=entry.tgt;}
        }
      }
      return bestTgt;
    };
    if(el&&_tTab){el.textContent=`Monthly targets tab: ${monthlyTgtRows.length} RMs loaded…`;el.style.color='#64748B';}

    // Build last month target map — simple direct lookup by RM name
    const lastMTgtMap={};
    if(_lmTab&&jLastMonthTgts?.status==='ok'){
      const tRows=jLastMonthTgts.data?.rows||jLastMonthTgts.data?.targets||(Array.isArray(jLastMonthTgts.data)?jLastMonthTgts.data:[]);
      tRows.forEach(row=>{
        const nm=normN((row['Actual RM Name']||row['RM Name']||row['RM']||'').toString().trim());
        const rawTgt=row['Target (₹)']??row['Target (INR)']??row['Target']??'';
        const tgt=typeof rawTgt==='number'?rawTgt:parseFloat(rawTgt.toString().replace(/[₹,\s]/g,''))||0;
        if(nm&&tgt>0)lastMTgtMap[nm]=tgt;
      });
    }
    const getLastMTgt=(dispRM,shRM)=>lastMTgtMap[normN(shRM)]||lastMTgtMap[normN(dispRM)]||0;
    // Capture debug info for admin panel
    window._syncDebug=window._syncDebug||{};
    window._syncDebug.lmTab=_lmTab;
    window._syncDebug.lmStatus=jLastMonthTgts?.status||'(no response)';
    window._syncDebug.lmMessage=jLastMonthTgts?.message||'';
    const _lmRawRows=jLastMonthTgts?.data?.rows||jLastMonthTgts?.data?.targets||(Array.isArray(jLastMonthTgts?.data)?jLastMonthTgts.data:[])||[];
    window._syncDebug.lmRowCount=_lmRawRows.length;
    window._syncDebug.lmFirstRow=_lmRawRows[0]?JSON.stringify(_lmRawRows[0]):'(no rows)';
    window._syncDebug.lmMapCount=Object.keys(lastMTgtMap).length;
    window._syncDebug.lmMapSample=Object.entries(lastMTgtMap).slice(0,5).map(([k,v])=>`${k} → ₹${v}`).join(', ')||'(empty)';

    // Build payment totals by RM and by TL (case-insensitive)
    const payByRM={};const payByTL={};
    paymentRows.forEach(p=>{
      const rm=(p['Rm Name']||'').trim().toLowerCase();
      const tl=(p['ATL/TL Name']||'').trim().toLowerCase();
      const amt=parseFloat(p.Amount)||0;
      if(rm)payByRM[rm]=(payByRM[rm]||0)+amt;
      if(tl)payByTL[tl]=(payByTL[tl]||0)+amt;
    });

    // Attribute payments to target RMs (handles all name variants / typos)
    const targetRMNames=rows.map(r=>(r.RM||'').trim()).filter(Boolean);
    const{rmPayments,rmDisplayName}=buildRMPayments(payByRM,targetRMNames);

    // Build raw-name → matched-target map (mirrors all 3 passes in buildRMPayments)
    const rawToTarget={};
    for(const k of Object.keys(payByRM)){
      const t=targetRMNames.find(n=>n.toLowerCase()===k);
      if(t){rawToTarget[k]=t.toLowerCase();continue;}
      const kfw=k.split(/\s+/)[0];let bestD=Infinity,bestT=null;
      for(const t2 of targetRMNames){const d=_editDist(kfw,t2.toLowerCase().split(/\s+/)[0]);if(d<=1&&d<bestD){bestD=d;bestT=t2;}}
      if(bestT){rawToTarget[k]=bestT.toLowerCase();continue;}
      // Pass 3 — first-word prefix match (mirrors buildRMPayments)
      const kp=k.split(/\s+/);const klw=kp[kp.length-1];let b3=null,b3d=Infinity;
      for(const t3 of targetRMNames){
        const tp=t3.toLowerCase().split(/\s+/);const tfw=tp[0];const tlw=tp[tp.length-1];
        if((kfw.startsWith(tfw)||tfw.startsWith(kfw))&&_editDist(klw,tlw)<=1&&_editDist(klw,tlw)<b3d){b3d=_editDist(klw,tlw);b3=t3;}
      }
      if(b3)rawToTarget[k]=b3.toLowerCase();
    }
    _payDateKey=detectPayDateKey(paymentRows);
    const rawPayRows=paymentRows.map(p=>({
      date:_payDateKey?String(p[_payDateKey]||'').trim():'',
      rm:(()=>{const raw=(p['Rm Name']||p['RM Name']||p['rm name']||'').trim().toLowerCase();const matched=rawToTarget[raw];if(matched){const disp=rmDisplayName[matched];return disp?disp.toLowerCase():matched;}return raw;})(),
      tl:(p['ATL/TL Name']||p['TL Name']||'').trim().toLowerCase(),
      is:matchISName(p['IS Name']||p['IS']||''),
      amount:(()=>{const v=String(p.Amount||p['Amount (₹)']||'').replace(/[₹,\s]/g,'');return parseFloat(v)||0;})()
    })).filter(r=>r.amount>0);
    if(rawPayRows.length>0)_cache.payment_rows=rawPayRows;

    // Preserve existing clinic data keyed by lowercase RM name
    const savedClinics={};
    ALL_RMS.forEach(r=>{if(r.clinics&&r.clinics.length)savedClinics[r.rm.toLowerCase().trim()]=r.clinics;});

    // Rebuild ZONE.tls fresh from sheet (sheet names are source of truth)
    ZONE.tls.splice(0,ZONE.tls.length);
    const tlByName={};
    rows.forEach(r=>{
      const tl=(r.TL||r['TL/ATL']||'').trim();const city=(r.City||'').trim();
      if(tl&&!tlByName[tl.toLowerCase()]){
        const nt={name:tl,city,rms:0,filledRMs:0,target:0,achieved:0,leads:0,renewals:0,
          monthlyTgt:0,monthlyAchv:0,dailyTgt:0,dailyAchv:0,renewalTgt:0,renewalAchv:0};
        ZONE.tls.push(nt);tlByName[tl.toLowerCase()]=nt;
      }
    });

    // Capture existing manually-entered leads fields before wiping Firestore
    const liveSnap=await db.collection('targets').get();
    const existingLeads={};
    liveSnap.docs.forEach(d=>{
      const dt=d.data();
      if(dt.rm&&dt.tl){
        const k=safeKey(`${dt.tl}|${dt.rm}`);
        existingLeads[k]={
          monthlyAchieved:dt.monthlyAchieved||0,
          dailyLeads:dt.dailyLeads||0,
          dailyAchieved:dt.dailyAchieved||0,
          renewalTarget:dt.renewalTarget||0,
          renewalAchieved:dt.renewalAchieved||0,
          inactive:dt.inactive||false,
          targetMonth:dt.targetMonth||'',
          target:dt.target||0,
          lastMonthTarget:dt.lastMonthTarget||0,
          manuallySet:dt.manuallySet||false,
          manuallyActivated:dt.manuallyActivated||false,
        };
      }
    });
    // Delete ALL Firestore target docs (fresh query — do not rely on cache)
    await Promise.all(liveSnap.docs.map(d=>d.ref.delete().catch(()=>{})));
    _cache.targets={};

    // Rebuild ALL_RMS fresh from sheet — sheet names are the only source of truth
    ALL_RMS.splice(0,ALL_RMS.length);
    const s={};const now=new Date().toISOString();const curMK=new Date().toISOString().slice(0,7);
    const autoDeactivated=[];
    rows.forEach(r=>{
      const sheetRM=(r.RM||'').trim();
      const sheetTL=(r.TL||r['TL/ATL']||'').trim();
      const sheetCity=(r.City||'').trim();
      if(!sheetRM||!sheetTL)return;
      const sheetRMLo=sheetRM.toLowerCase();
      const paid=rmPayments[sheetRMLo]||0;
      const payFull=rmDisplayName[sheetRMLo];
      // Use longer payment-tab name as display if available (it has the full name)
      const displayRM=payFull&&payFull.length>sheetRMLo.length
        ?payFull.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')
        :sheetRM;
      const key=safeKey(`${sheetTL}|${displayRM}`);
      const rawKey=safeKey(`${sheetTL}|${sheetRM}`);
      if(_cache.removed_rms?.[key]||_cache.removed_rms?.[rawKey])return; // explicitly removed — do not re-add
      const ex=existingLeads[key]||{};
      // lastMonthTarget: explicit tab takes priority; otherwise infer from prior-month Firestore value
      const lmFromTab=getLastMTgt(displayRM,sheetRM);
      const lastMonthTarget=lmFromTab||(ex.targetMonth&&ex.targetMonth!==curMK?(ex.target||ex.lastMonthTarget||0):(ex.lastMonthTarget||0));
      // When monthly tab is configured AND has data: RMs not in it are auto-deactivated
      // — unless target was manually set or admin explicitly reactivated them
      const monthlyTgtVal=hasTabData?(getMonthlyTgt(displayRM,sheetRM)||0):((getMonthlyTgt(displayRM,sheetRM)||parseFloat(r['Target (INR)'])||0)||(ex.target||0));
      const autoDeact=hasTabData&&monthlyTgtVal===0&&!ex.inactive&&!ex.manuallySet&&!ex.manuallyActivated;
      if(autoDeact)autoDeactivated.push(displayRM);
      // Manually-set targets (saved via Admin → Targets) survive sheet pulls
      const rmTarget=ex.manuallySet&&ex.targetMonth===curMK?(ex.target||0):(autoDeact?(ex.target||0):monthlyTgtVal);
      const rmInactive=ex.inactive||autoDeact;
      const rmObj={
        rm:displayRM,tl:sheetTL,city:sheetCity,
        target:rmTarget,lastMonthTarget,
        achieved:paid,
        refund:0,
        inactive:rmInactive,
        monthlyTgt:parseFloat(r['Monthly Leads Target'])||0,
        monthlyAchv:parseFloat(r['Monthly Leads Achieved'])||0,

    });

    // Preserve manually-added RMs (exist in Firestore but not in sheet)
    liveSnap.docs.forEach(d=>{
      const dt=d.data();
      if(!dt.rm||!dt.tl||!dt.manuallyAdded)return; // only preserve explicit admin-added RMs
      const k=safeKey(`${dt.tl}|${dt.rm}`);
      if(s[k])return; // sheet takes precedence
      s[k]=dt;
      ALL_RMS.push({
        rm:dt.rm,tl:dt.tl,city:dt.city||'',

        ZONE.tls.push(nt);tlByName[dt.tl.toLowerCase()]=nt;

    // Force-restore manually-set targets — runs after the entire s object is built
    // This is the final authority: manually-set targets always win over sheet values
    // Uses the original Firestore key from existingLeads to avoid any key-mismatch issue
    Object.entries(existingLeads).forEach(([k,e])=>{
      if(!e.manuallySet||!e.target||e.targetMonth!==curMK)return;

        if(idx>=0){ALL_RMS[idx].target=e.target;ALL_RMS[idx].inactive=false;}
      }
    });

    // Recompute aggregates — use payByTL for TL achieved (avoids RM name mismatch)
    ZONE.tls.forEach(tl=>{
      const n=tl.name.toLowerCase();
      const rms=ALL_RMS.filter(r=>r.tl.toLowerCase()===n);

      tl.monthlyTgt=rms.reduce((s,r)=>s+(r.monthlyTgt||0),0);
      tl.rms=rms.length;tl.filledRMs=rms.length;
    });
    ZONE.cities.forEach(city=>{
      const ct=ZONE.tls.filter(t=>t.city===city.name);
      city.target=ct.reduce((s,t)=>s+t.target,0);
      city.achieved=ct.reduce((s,t)=>s+t.achieved,0);
      const cn=ALL_RMS.filter(r=>r.city===city.name).length;
      city.rms=cn;city.filledRMs=cn;
    });
    ZONE.target=ZONE.tls.reduce((s,t)=>s+t.target,0);
    ZONE.achieved=ZONE.tls.reduce((s,t)=>s+t.achieved,0);

    const total=Object.values(payByTL).reduce((s,v)=>s+v,0);
    const datedCount=rawPayRows.filter(r=>r.date).length;
    if(el){el.textContent=`💾 Saving ${rows.length} RMs · ${datedCount}/${rawPayRows.length} payments · ${Object.keys(lastMTgtMap).length} last-month targets…`;el.style.color='#64748B';}
    const tlAchMap={};
    ZONE.tls.forEach(tl=>{tlAchMap[safeKey(tl.name)]={name:tl.name,city:tl.city,achieved:tl.achieved,target:tl.target};});
    await Promise.all([saveStore(s),db.collection('config').doc('tl_achieved').set(tlAchMap).catch(e=>console.warn('tl_achieved write:',e))]);
    const syncedAt=new Date().toISOString();
    _cache.sync_settings={..._cache.sync_settings,lastSynced:syncedAt};
    // Persist monthly target snapshots — each month's targets saved permanently
    const lmMK=getLastMonthKey();
    _cache.monthly_targets=_cache.monthly_targets||{};
    if(hasTabData){
      const snap={};
      Object.entries(s).forEach(([k,v])=>{if(!v.inactive&&(v.target||0)>0)snap[k]=v.target;});

    }
    await Promise.all([

      db.collection('config').doc('sync_settings').set(_cache.sync_settings).catch(()=>{}),
      db.collection('config').doc('payment_rows').set({rows:rawPayRows}).catch(()=>{}),
      db.collection('config').doc('monthly_targets').set(_cache.monthly_targets).catch(()=>{}),
    ]);
    // Apply manual targets AFTER sync — they live in config so the sync never touches them
    applyManualTargets();
    mergePendingIntoPaymentRows();
    // Lead data: Metabase API takes priority; fall back to GAS ?tab=leads
    const mbLeads=await fetchMetabaseLeads();

    if(silent){

      const t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      if(el){el.textContent='✅ Auto-synced at '+t+' · ₹'+total.toLocaleString('en-IN');el.style.color='#16A34A';}

      if(el){el.textContent='✅ Synced '+rows.length+' RMs · ₹'+total.toLocaleString('en-IN')+deactNote+' — reloading…';el.style.color='#16A34A';}

function normalizeIS(s){
  return(s||'').trim().toLowerCase().replace(/[._\-]+/g,' ').replace(/\s+/g,' ').trim();
}
function matchISName(raw){
  const norm=normalizeIS(raw);
  if(!norm)return '';
  // Pass 1: exact match after normalization
  const exact=IS_NAMES.find(i=>normalizeIS(i.name)===norm);
  if(exact)return exact.name;
  // Pass 2: edit distance on first word (handles minor spelling diffs)
  const rawFw=norm.split(' ')[0];
  let best=null,bestD=Infinity;
  for(const i of IS_NAMES){
    const d=_editDist(normalizeIS(i.name).split(' ')[0],rawFw);
    if(d<=1&&d<bestD){bestD=d;best=i;}
  }
  if(best)return best.name;
  // Pass 3: full-name edit distance (catches transpositions etc.)
  let best3=null,best3D=Infinity;
  for(const i of IS_NAMES){
    const d=_editDist(normalizeIS(i.name),norm);
    if(d<=3&&d<best3D){best3D=d;best3=i;}
  }
  if(best3)return best3.name;
  return norm;
}

// Returns the effective target for an RM given the active date range.
// Only gates to 0 when viewing "This Month" and the target was set for a different month.
function fuzzyRMScore(a,b){
  const n=s=>s.toLowerCase().trim().replace(/\s+/g,' ');
  a=n(a);b=n(b);
  if(a===b)return 1;
  const aw=a.split(' '),bw=b.split(' ');
  const aSet=new Set(aw),bSet=new Set(bw);
  const common=[...aSet].filter(w=>w.length>2&&bSet.has(w)).length;
  const sub=aw.some(w=>w.length>3&&bw.some(v=>v.includes(w)||w.includes(v)));
  const first=aw[0]===bw[0];
  if(first&&common>=1)return 0.9;
  if(common>=2)return 0.85;
  if(first&&sub)return 0.8;
  if(common>=1)return 0.6;
  if(first||sub)return 0.5;
  return 0;
}
function bestFuzzyRM(rmName,tlName){
  let best=null,bs=0.45;
  for(const r of ALL_RMS){
    if(r.inactive)continue;
    const s=fuzzyRMScore(rmName,r.rm);
    const tlBonus=r.tl.toLowerCase()===tlName.toLowerCase()?0.1:0;
    const total=Math.min(1,s+tlBonus);
    if(total>bs){bs=total;best={rm:r.rm,tl:r.tl,city:r.city,score:total};}
  }
  return best;
}
function getLastMonthKey(){
  const curMK=new Date().toISOString().slice(0,7);
  const [y,m]=curMK.split('-').map(Number);
  return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;
}
function effTgtForRange(r,dateRange){
  if(dateRange==='This Month'){
    const curMK=new Date().toISOString().slice(0,7);
    if(r.targetMonth&&r.targetMonth!==curMK)return 0;
    return r.target||0;
  }
  if(dateRange==='Last Month'){
    const lmMK=getLastMonthKey();
    const snap=_cache.monthly_targets?.[lmMK]||{};
    const k=safeKey(`${r.tl}|${r.rm}`);
    return snap[k]??r.lastMonthTarget??0;
  }
  return r.target||0;
}

function enrichRMsWithLeads(){
  const rpData=_cache.route_plan_data;
  if(!rpData||(rpData.live_status||[]).length===0)return;

  const plan=buildRMPlan(rpData);

    const totalAvg=rp.clinics.reduce((s,c)=>s+(parseFloat(c.avgLeads)||0),0);

    const rms=ALL_RMS.filter(r=>r.tl.toLowerCase()===tl.name.toLowerCase());

// Download CSV helper
function downloadCSV(headers,rows,filename){
  const csv=[headers,...rows].map(r=>r.map(v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click();
}

// ── NOTIFICATION BELL ──────────────────────────────────────────────────────
function NotificationBell({rmName}){
  const[notifs,setNotifs]=useState([]);
  const[open,setOpen]=useState(false);
  const load=useCallback(()=>getNotifications(rmName).then(setNotifs),[rmName]);
  useEffect(()=>{if(!rmName)return;load();const t=setInterval(load,30000);return()=>clearInterval(t);},[rmName,load]);
  const unread=notifs.filter(n=>!n.read).length;
  const handleOpen=()=>{
    setOpen(o=>!o);
    notifs.filter(n=>!n.read).forEach(n=>markNotifRead(n.id));
    setTimeout(()=>setNotifs(p=>p.map(n=>({...n,read:true}))),300);
  };
  const typeIcon={note:'📝',status:'🔄'};
  return(
    <div style={{position:'relative'}}>
      <button onClick={handleOpen} style={{position:'relative',background:'rgba(255,255,255,.18)',border:'none',color:'#fff',borderRadius:10,padding:'7px 11px',cursor:'pointer',fontSize:18,lineHeight:1}}>
        🔔

        <div onClick={handleOpen} style={{position:'fixed',inset:0,zIndex:199}}/>
        <div style={{position:'absolute',right:0,top:'110%',width:320,background:B.white,borderRadius:16,boxShadow:'0 12px 40px rgba(0,0,0,.18)',zIndex:200,maxHeight:420,display:'flex',flexDirection:'column',border:`1px solid ${B.line}`}}>

// ── LOGIN (no balloon) ─────────────────────────────────────────────────────
function Login({onLogin}){
  const[em,setEm]=useState('');const[pw,setPw]=useState('');
  const[busy,setBusy]=useState(false);const[err,setErr]=useState('');const[showPw,setShowPw]=useState(false);
  const[forgotMode,setForgotMode]=useState(false);
  const[forgotEmail,setForgotEmail]=useState('');
  const[forgotStatus,setForgotStatus]=useState('');
  const[forgotBusy,setForgotBusy]=useState(false);
  const go=async()=>{
    if(!em.trim()||!pw){setErr('Enter your email and password');return;}
    setBusy(true);setErr('');
    try{
      const cred=await auth.signInWithEmailAndPassword(em.trim(),pw);
      let userData;
      const userDoc=await db.collection('users').doc(cred.user.uid).get();
      if(userDoc.exists){userData=userDoc.data();}
      else{
        const mapped=ROLE_MAP[em.trim().toLowerCase()];
        userData=mapped||{role:'rm',name:em.split('@')[0]};
        await db.collection('users').doc(cred.user.uid).set({email:em.trim().toLowerCase(),...userData,createdAt:new Date().toISOString()});
      }
      onLogin({...userData,uid:cred.user.uid,email:em.trim().toLowerCase()});
    }catch(e){
      setBusy(false);
      const msgs={'auth/wrong-password':'Wrong password.','auth/user-not-found':'No account with this email.','auth/invalid-credential':'Wrong email or password.','auth/too-many-requests':'Too many attempts. Wait and retry.'};
      setErr(msgs[e.code]||'Login failed. Try again.');
    }
  };
  const sendReset=async()=>{
    if(!forgotEmail.trim()){setForgotStatus('Enter your email address.');return;}
    setForgotBusy(true);setForgotStatus('');
    try{
      await auth.sendPasswordResetEmail(forgotEmail.trim());
      setForgotStatus('ok');
    }catch(e){
      const msgs={'auth/user-not-found':'No account found with this email.','auth/invalid-email':'Invalid email address.'};
      setForgotStatus('err:'+(msgs[e.code]||'Could not send email. Try again.'));
    }
    setForgotBusy(false);
  };
  return(
    <div style={{minHeight:'100vh',background:`linear-gradient(160deg,${B.brandDark} 0%,${B.brand} 60%,${B.brandMid} 100%)`,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:380}} className="fade-in">
        <div style={{textAlign:'center',marginBottom:32}}>
          <img src="even-logo.svg" alt="even" style={{height:38,margin:'0 auto 12px',display:'block'}}/>
          <div style={{color:'rgba(255,255,255,.6)',fontSize:13,marginTop:6}}>Evenpay Route Plan</div>
        </div>
        <div style={{background:B.white,borderRadius:20,padding:28,boxShadow:'0 20px 60px rgba(35,80,255,.25)'}}>
          {!forgotMode?(
            <>
              <div style={{fontSize:18,fontWeight:700,color:B.ink,marginBottom:20}}>Welcome back 👋</div>
              {[['Email','email',em,setEm,'you@even.in'],['Password',showPw?'text':'password',pw,setPw,'••••••••']].map(([l,t,v,s,p],i)=>(
                <div key={l} style={{marginBottom:14,position:'relative'}}>
                  <div style={{fontSize:11,fontWeight:600,color:B.muted,marginBottom:5,textTransform:'uppercase',letterSpacing:'.5px'}}>{l}</div>
                  <input value={v} onChange={e=>s(e.target.value)} type={t} placeholder={p} onKeyDown={e=>e.key==='Enter'&&go()}
                    style={{width:'100%',padding:'12px 14px',border:`1.5px solid ${B.line}`,borderRadius:12,fontSize:14,outline:'none',boxSizing:'border-box'}}
                    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
                  {i===1&&<button onClick={()=>setShowPw(!showPw)} style={{position:'absolute',right:12,bottom:12,background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:12,fontWeight:600}}>{showPw?'Hide':'Show'}</button>}
                </div>
              ))}
              {err&&<div style={{color:B.red,fontSize:12,fontWeight:600,marginBottom:12,background:B.redBg,padding:'10px 12px',borderRadius:10}}>⚠️ {err}</div>}
              <button onClick={go} disabled={busy} style={{width:'100%',padding:14,background:busy?B.muted:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:'pointer'}}>
                {busy?'Signing in…':'Sign In →'}
              </button>
              <div style={{marginTop:14,textAlign:'center',fontSize:12}}>
                <button onClick={()=>{setForgotMode(true);setForgotEmail(em);setForgotStatus('');}} style={{background:'none',border:'none',cursor:'pointer',color:B.brand,fontWeight:600,fontSize:12,padding:0}}>
                  Forgot your password?
                </button>
              </div>
            </>
          ):(
            <>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
                <button onClick={()=>setForgotMode(false)} style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:18,padding:0,lineHeight:1}}>←</button>
                <div style={{fontSize:17,fontWeight:700,color:B.ink}}>Reset Password</div>
              </div>
              {forgotStatus==='ok'?(
                <div>
                  <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:12,padding:'14px 16px',marginBottom:16}}>

                    </div>
                  </div>
                  <button onClick={()=>{setForgotMode(false);setForgotStatus('');}} style={{width:'100%',padding:12,background:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>
                    Back to Login

                </div>
              ):(

                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:11,fontWeight:600,color:B.muted,marginBottom:5,textTransform:'uppercase',letterSpacing:'.5px'}}>Email</div>

                      style={{width:'100%',padding:'12px 14px',border:`1.5px solid ${B.line}`,borderRadius:12,fontSize:14,outline:'none',boxSizing:'border-box'}}
                      onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
                  </div>
                  {forgotStatus&&forgotStatus!=='ok'&&<div style={{color:B.red,fontSize:12,fontWeight:600,marginBottom:12,background:B.redBg,padding:'10px 12px',borderRadius:10}}>

                  </div>}
                  <button onClick={sendReset} disabled={forgotBusy} style={{width:'100%',padding:14,background:forgotBusy?B.muted:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:'pointer'}}>
                    {forgotBusy?'Sending…':'Send Reset Link →'}
                  </button>
                  <div style={{marginTop:12,fontSize:11,color:B.muted,textAlign:'center',lineHeight:1.5}}>
                    If the email doesn't arrive in 2 minutes, check your Spam / Junk folder.
                  </div>
                </>
              )}
            </>
          )}
        </div>
        <div style={{marginTop:12,textAlign:'center'}}><span style={{color:'rgba(255,255,255,.4)',fontSize:11}}>🔒 Secured with Firebase</span></div>
      </div>
    </div>
  );
}

// ── FORCE PASSWORD CHANGE ──────────────────────────────────────────────────
function ForcePasswordChange({user,onDone}){
  const[pw,setPw]=useState('');const[pw2,setPw2]=useState('');
  const[busy,setBusy]=useState(false);const[err,setErr]=useState('');const[showPw,setShowPw]=useState(false);
  const submit=async()=>{
    if(pw.length<6){setErr('Password must be at least 6 characters.');return;}
    if(pw!==pw2){setErr('Passwords do not match.');return;}
    setBusy(true);setErr('');
    try{
      await auth.currentUser.updatePassword(pw);
      await db.collection('users').doc(user.uid).update({mustChangePassword:false});
      onDone();
    }catch(e){
      setBusy(false);
      if(e.code==='auth/requires-recent-login'){setErr('Session expired. Please log out and log in again.');}
      else{setErr('Could not update password. Try again.');}
    }
  };
  return(
    <div style={{minHeight:'100vh',background:`linear-gradient(160deg,${B.brandDark} 0%,${B.brand} 60%,${B.brandMid} 100%)`,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:380}} className="fade-in">
        <div style={{textAlign:'center',marginBottom:32}}>
          <img src="even-logo.svg" alt="even" style={{height:38,margin:'0 auto 12px',display:'block'}}/>
          <div style={{color:'rgba(255,255,255,.6)',fontSize:13,marginTop:6}}>Evenpay Route Plan</div>
        </div>
        <div style={{background:B.white,borderRadius:20,padding:28,boxShadow:'0 20px 60px rgba(35,80,255,.25)'}}>
          <div style={{fontSize:18,fontWeight:700,color:B.ink,marginBottom:6}}>Set your password</div>
          <div style={{fontSize:13,color:B.muted,marginBottom:20,lineHeight:1.5}}>
            Hi <strong>{user.name||user.email}</strong>, your account was created by an admin.<br/>
            Please set a personal password before continuing.
          </div>
          {[['New Password',pw,setPw],['Confirm Password',pw2,setPw2]].map(([l,v,s],i)=>(
            <div key={l} style={{marginBottom:14,position:'relative'}}>
              <div style={{fontSize:11,fontWeight:600,color:B.muted,marginBottom:5,textTransform:'uppercase',letterSpacing:'.5px'}}>{l}</div>
              <input value={v} onChange={e=>s(e.target.value)} type={showPw?'text':'password'} placeholder="6+ characters"
                onKeyDown={e=>e.key==='Enter'&&submit()}
                style={{width:'100%',padding:'12px 14px',border:`1.5px solid ${B.line}`,borderRadius:12,fontSize:14,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
              {i===1&&<button onClick={()=>setShowPw(!showPw)} style={{position:'absolute',right:12,bottom:12,background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:12,fontWeight:600}}>{showPw?'Hide':'Show'}</button>}
            </div>
          ))}
          {err&&<div style={{color:B.red,fontSize:12,fontWeight:600,marginBottom:12,background:B.redBg,padding:'10px 12px',borderRadius:10}}>⚠️ {err}</div>}
          <button onClick={submit} disabled={busy} style={{width:'100%',padding:14,background:busy?B.muted:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:'pointer'}}>
            {busy?'Saving…':'Set Password & Continue →'}
          </button>
          <div style={{marginTop:12,fontSize:11,color:B.muted,textAlign:'center'}}>You cannot skip this step.</div>
        </div>
      </div>
    </div>
  );
}

      <div style={{background:B.bg,minHeight:'100vh',paddingBottom:80}}>

              <div style={{color:'rgba(255,255,255,.6)',fontSize:9,fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',marginBottom:5}}>Target</div>

          }).map((r,i)=>{
            const rma=filtData?filtData.rmPayments[r.rm.toLowerCase()]||0:r.achieved;
            const et=effTgtForRange(r,dateRange);
            const p=pct(rma,et);
            const noTgt=et===0;
            const stc=noTgt?B.muted:p>=80?B.green:p>=60?B.amber:B.red;
            const stb=noTgt?B.bg:p>=80?B.greenBg:p>=60?B.amberBg:B.redBg;
            const stl=noTgt?'No target':p>=80?'On Track':p>=60?'At Risk':'Behind';
            return(
              <div key={i} style={{background:B.white,borderRadius:16,boxShadow:'0 1px 8px rgba(0,0,0,.07)',marginBottom:10,padding:'14px 16px',border:`1px solid ${B.line}`}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:36,height:36,background:B.brandLight,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:800,color:B.brand,flexShrink:0}}>{(r.rm[0]||'R').toUpperCase()}</div>
                    <div>
                      <div style={{fontWeight:700,fontSize:14,color:B.ink}}>{r.rm}</div>
                      <div style={{fontSize:11,color:B.muted,marginTop:1}}>{r.city}{r.clinics?.length?` · ${r.clinics.length} clinics`:''}</div>
                    </div>
                  </div>
                  <span style={{background:stb,color:stc,padding:'4px 10px',borderRadius:20,fontSize:10,fontWeight:700,letterSpacing:'.3px',whiteSpace:'nowrap'}}>{stl}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:8}}>
                  <div>
                    <div style={{fontSize:20,fontWeight:800,color:B.ink,letterSpacing:'-.5px'}}>{fmtN(rma)}</div>
                    <div style={{fontSize:11,color:B.muted,marginTop:2}}>{noTgt?'No target set':`of ${fmtN(et)}`}</div>
                  </div>
                  {!noTgt&&<div style={{fontSize:24,fontWeight:800,color:stc,letterSpacing:'-1px'}}>{p}%</div>}
                </div>
                {!noTgt&&<div style={{background:'#EEF2FF',borderRadius:999,height:5,overflow:'hidden'}}>
                  <div style={{width:`${Math.min(p,100)}%`,height:'100%',background:p>=80?B.green:p>=60?B.amber:B.red,borderRadius:999}}/>
                </div>}
              </div>
            );
          })}
        </div>
      </div>
    );
    return(
      <div style={{background:B.bg,minHeight:'100%',paddingTop:0,paddingBottom:24}}>
        <div style={{padding:'24px 28px 0'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <div>
              <div style={{fontSize:22,fontWeight:800,color:B.navy}}>{user.name}'s Team</div>
              <div style={{color:B.muted,fontSize:13,marginTop:3}}>{user.city||'Pune'} · {myRMs.length} RMs · {new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
            </div>
          <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}}>
            <select value={dateRange} onChange={e=>setDateRange(e.target.value)} style={{padding:'8px 14px',border:`1.5px solid ${filtData?B.brand:B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer',fontWeight:600,color:filtData?B.brand:B.ink}}>
              {['All Time','Single Date','This Week','This Month','Last Month','Last 3 Months','Custom'].map(o=><option key={o}>{o}</option>)}
            </select>
            {dateRange==='Single Date'&&<div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{color:B.muted,fontSize:12,fontWeight:600}}>Pick date:</span>
              <input type="date" value={singleDate} onChange={e=>setSingleDate(e.target.value)} style={{padding:'6px 9px',border:`1.5px solid ${B.brand}`,borderRadius:8,fontSize:12,outline:'none'}}/>
            </div>}
            {dateRange==='Custom'&&<div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{padding:'6px 9px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,outline:'none'}}/>
              <span style={{color:B.muted,fontSize:12}}>to</span>
              <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{padding:'6px 9px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,outline:'none'}}/>
            </div>}
          </div>
          </div>
          {filtData&&(_cache.payment_rows||[]).length===0&&<div style={{background:'#fffbea',border:`1px solid #fde68a`,borderRadius:10,padding:'8px 14px',marginBottom:12,fontSize:12,color:B.amber,fontWeight:600}}>
            No payment data loaded yet — run a sync first to enable date filtering.
          </div>}
          {filtData&&(_cache.payment_rows||[]).length>0&&<div style={{background:B.brandLight,border:`1px solid ${B.brand}`,borderRadius:10,padding:'8px 14px',marginBottom:16,fontSize:12,color:B.brand,fontWeight:600}}>
            Showing payments for: <strong>{dateRange==='Custom'?`${customFrom} to ${customTo}`:dateRange}</strong> — Total: <strong>{fmt(filtData.total)}</strong> across {filtData.rows.length} payment{filtData.rows.length!==1?'s':''}
          </div>}
          {behind.length>0&&<div style={{background:B.redBg,borderLeft:`4px solid ${B.red}`,borderRadius:14,padding:'12px 14px',marginBottom:20}}>
            <div style={{color:B.red,fontWeight:700}}>⚠️ Behind target: {behind.map(r=>r.rm).join(', ')}</div>
          </div>}
          <div style={{display:'flex',gap:14,marginBottom:24}}>
            <StatCard title="Team Target" value={fmt(tgt)} icon="🎯"/>
            <StatCard title="Team Achieved" value={fmt(ach)} sub={`${pct(ach,tgt)}% of target`} icon="💰" highlight/>
            <StatCard title="On Track" value={myRMs.filter(r=>pct(r.achieved,r.target)>=80).length+'/'+myRMs.length} icon="✅"/>
            <StatCard title="Behind Target" value={String(behind.length)} icon="⚠️"/>
          </div>
        </div>
        <div style={{padding:'0 28px 24px'}}>
          <div style={{background:B.white,borderRadius:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',overflow:'hidden',border:`1px solid ${B.line}`}}>
            <div style={{padding:'14px 18px',borderBottom:`1px solid ${B.line}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontWeight:700,fontSize:14,color:B.navy}}>{showChart?'Payments Chart':'RM Performance'} — {dateRange}</div>
              <button onClick={()=>setShowChart(s=>!s)} style={{padding:'6px 14px',borderRadius:8,border:`1.5px solid ${B.brand}`,background:showChart?B.brand:B.white,color:showChart?'#fff':B.brand,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                {showChart?'Show Table':'Payments Chart'}
              </button>
            </div>
            {showChart&&<div style={{padding:'20px'}}><MonthlyPaymentsChart rows={(()=>{const rlos=new Set(myRMs.map(r=>r.rm.toLowerCase()));return(_cache.payment_rows||[]).filter(r=>rlos.has(r.rm));})()}/></div>}
            {!showChart&&<div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13,minWidth:700}}>
                <thead>
                  <tr>
                    <th style={th2}>No</th>
                    <th style={th2}>RM</th>
                    <th style={th2}>City</th>
                    <th style={thR2}>Target (₹) ↕</th>
                    <th style={thR2}>Achieved (₹) ↕</th>
                    <th style={thR2}>Target % ↕</th>
                    <th style={thR2}>Mthly Tgt</th>
                    <th style={thR2}>Mthly Achv</th>
                    <th style={thR2}>Daily Tgt</th>
                    <th style={thR2}>Renewal Tgt</th>
                    <th style={thR2}>Renewal Achv</th>
                    <th style={th2}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {myRMs.sort((a,b)=>pct(b.achieved,b.target)-pct(a.achieved,a.target)).map((r,i)=>{
                    const rma=filtData?filtData.rmPayments[r.rm.toLowerCase()]||0:r.achieved;
                    const et=effTgtForRange(r,dateRange);
                    const p=pct(rma,et);
                    const noTgt=et===0;
                    const stc=noTgt?B.muted:p>=80?B.green:p>=60?B.amber:B.red;
                    const stb=noTgt?B.bg:p>=80?B.greenBg:p>=60?B.amberBg:B.redBg;
                    const stl=noTgt?'No target':p>=80?'On Track':p>=60?'At Risk':'Behind';
                    return <tr key={i} style={{background:B.white}} onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'} onMouseLeave={e=>e.currentTarget.style.background=B.white}>
                      <td style={{...td2,color:B.muted,fontWeight:600,width:44}}>{i+1}</td>
                      <td style={td2}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <div style={{width:30,height:30,background:B.brandLight,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:B.brand,flexShrink:0}}>{r.rm[0]}</div>
                          <div><div style={{fontWeight:700,color:B.ink}}>{r.rm}</div><div style={{fontSize:10,color:B.muted}}>{r.clinics?.length||0} clinics</div></div>
                        </div>
                      </td>
                      <td style={td2}>{r.city}</td>
                      <td style={tdR2}>{noTgt?<span style={{color:B.muted,fontSize:11}}>No target</span>:Number(et).toLocaleString('en-IN')}</td>
                      <td style={tdR2}>{Number(rma).toLocaleString('en-IN')}</td>
                      <td style={tdR2}><span style={{color:noTgt?B.muted:pClr(p),fontWeight:700}}>{noTgt?'—':p+'%'}</span></td>
                      <td style={tdR2}>{r.monthlyTgt||'—'}</td>
                      <td style={tdR2}>{r.monthlyAchv}</td>
                      <td style={tdR2}>{r.dailyTgt||'—'}</td>
                      <td style={tdR2}>{r.renewalTgt||'—'}</td>
                      <td style={tdR2}>{r.renewalAchv}</td>
                      <td style={td2}><span style={{background:stb,color:stc,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700}}>{stl}</span></td>
                    </tr>;
                  })}
                </tbody>
                <tfoot>
                  <tr style={{background:B.navy}}>
                    <td colSpan={2} style={{padding:'12px 14px',color:'#fff',fontWeight:800,fontSize:13}}>TOTALS — {myRMs.length} RMs</td>
                    <td style={{padding:'12px'}}></td>
                    <td style={tfC}>{Number(tgt).toLocaleString('en-IN')}</td>
                    <td style={tfC}>{Number(ach).toLocaleString('en-IN')}</td>
                    <td style={tfC}>{pct(ach,tgt)}%</td>
                    <td style={tfC}>{totMthlyTgt}</td>
                    <td style={tfC}>{totMthlyAchv}</td>
                    <td style={tfC}>{totDailyTgt}</td>
                    <td style={tfC}>{totRenTgt}</td>
                    <td style={tfC}>{totRenAchv}</td>
                    <td style={{padding:'12px'}}></td>
                  </tr>
                </tfoot>
              </table>
            </div>}
          </div>
        </div>
      </div>
    );
  };

  if(isMobile) return(
    <div style={{minHeight:'100vh',paddingBottom:80}}>
      {screen==='team'&&<TeamView/>}
      {screen==='zone'&&<ZoneOverviewPanel/>}
      {screen==='route'&&<RoutePlanPanel user={user}/>}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,background:B.white,borderTop:`1px solid ${B.line}`,display:'flex',zIndex:100,boxShadow:'0 -4px 20px rgba(35,80,255,.1)'}}>
        {[['team','👥','My Team'],['zone','📊','Zone'],['route','🗺️','Route Plan']].map(([id,icon,lbl])=>(
          <button key={id} onClick={()=>setScreen(id)} style={{flex:1,padding:'10px 8px 12px',background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer'}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:11,fontWeight:screen===id?700:500,color:screen===id?B.brand:B.muted}}>{lbl}</span>
            {screen===id&&<div style={{width:20,height:3,background:B.brand,borderRadius:2}}/>}
          </button>
        ))}
      </div>
    </div>
  );
  // Desktop: sticky top nav + scrollable content
  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      <div style={{background:B.white,borderBottom:`1px solid ${B.line}`,padding:'0 32px',display:'flex',gap:4,flexShrink:0,boxShadow:'0 2px 8px rgba(0,0,0,.04)',position:'sticky',top:0,zIndex:100}}>
        {[['team','👥 My Team'],['zone','📊 Zone'],['route','🗺️ Route Plan']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setScreen(id)} style={{padding:'14px 18px',background:'none',border:'none',borderBottom:screen===id?`3px solid ${B.brand}`:'3px solid transparent',color:screen===id?B.brand:B.muted,fontWeight:screen===id?700:500,fontSize:13,cursor:'pointer'}}>
            {lbl}
          </button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:13,color:B.muted}}>{user.name}</span>
          <button onClick={onLogout} style={{background:B.redBg,border:'none',color:B.red,borderRadius:8,padding:'6px 12px',fontSize:12,cursor:'pointer',fontWeight:600}}>Logout</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto'}}>
        {screen==='team'&&<TeamView/>}
        {screen==='zone'&&<ZoneOverviewPanel/>}
        {screen==='route'&&<RoutePlanPanel user={user}/>}
      </div>
    </div>
  );
}

// ── TABLE HEADER / CELL helpers (outside component to avoid remount) ─────────
const RPTh=({children,right})=>(
  <th style={{padding:'10px 14px',textAlign:right?'right':'left',fontSize:10,fontWeight:700,color:B.muted,textTransform:'uppercase',letterSpacing:'.5px',whiteSpace:'nowrap',background:'#FAFAFA',borderBottom:`1px solid ${B.line}`}}>{children}</th>
);
const RPTd=({children,right,muted,bold,color})=>(
  <td style={{padding:'11px 14px',borderBottom:`1px solid ${B.line}`,textAlign:right?'right':'left',color:color||(muted?B.muted:B.ink),fontWeight:bold?700:400,fontSize:12,whiteSpace:'nowrap',verticalAlign:'middle'}}>{children==null||children===''?'—':children}</td>
);

// ── ROUTE PLAN ─────────────────────────────────────────────────────────────
function RoutePlanPanel({user}){
  const isMobile=useIsMobile();
  const[view,setView]=useState('plan'); // 'plan' | 'health'
  const[tab,setTab]=useState('live');
  const[cityF,setCityF]=useState('All');
  const[search,setSearch]=useState('');
  const[syncing,setSyncing]=useState(false);
  const[syncMsg,setSyncMsg]=useState('');
  const[data,setData]=useState(()=>({...(_cache.route_plan_data||{live_status:[],needs_action:[],new_onboarded:[],disabled:[],lastFetched:null})}));
  const[expandedRM,setExpandedRM]=useState(null);
  const[notifSentToday,setNotifSentToday]=useState(false);
  const[previewAs,setPreviewAs]=useState('');

  const isAdmin=user.role==='admin'||user.role==='tl';

  useEffect(()=>{
    const h=()=>setData({...(_cache.route_plan_data||{live_status:[],needs_action:[],new_onboarded:[],disabled:[]})});
    window.addEventListener('routePlanUpdated',h);
    return()=>window.removeEventListener('routePlanUpdated',h);
  },[]);

  // Morning notification: once per day per RM
  useEffect(()=>{
    if(view!=='plan')return;
    const todayKey='morningNotif_'+new Date().toISOString().slice(0,10);
    if(localStorage.getItem(todayKey))return;
    const plan=buildRMPlan(data);
    if(!plan.length)return;
    const myRMs=isAdmin?plan:plan.filter(r=>r.rm.toLowerCase()===user.name.toLowerCase());
    if(!myRMs.length)return;
    const msgs=[];
    myRMs.forEach(r=>{
      const todayVisits=r.clinics.filter(c=>isVisitToday(c));
      if(!todayVisits.length)return;
      const lines=[`Today's plan for ${r.rm} (${RP_DAY_NAMES[new Date().getDay()]}):`];
      todayVisits.forEach(c=>lines.push(`• ${c.name} — ${c.frequency}${c.status?' ['+cleanStatus(c.status)+']':''}`));
      msgs.push(lines.join('\n'));
    });
    if(!msgs.length)return;
    const now=new Date().toISOString();
    const notifs=myRMs.map(r=>{
      const todayVisits=r.clinics.filter(c=>isVisitToday(c));
      if(!todayVisits.length)return null;
      return{
        rmName:r.rm,type:'morning_plan',read:false,createdAt:now,
        message:`Today (${RP_DAY_NAMES[new Date().getDay()]}): ${todayVisits.length} clinic${todayVisits.length>1?'s':''} to visit — ${todayVisits.map(c=>c.name).join(', ')}`
      };
    }).filter(Boolean);
    Promise.all(notifs.map(n=>db.collection('notifications').add(n).catch(()=>{})));
    localStorage.setItem(todayKey,'1');
    setNotifSentToday(true);
  },[data,view]);

  const handleSync=async()=>{
    const url=_cache.route_settings?.routePlanScriptUrl;
    if(!url){setSyncMsg('No Apps Script URL configured. Admin must set it in Admin → Route Sync → Clinic Health URL.');return;}
    setSyncing(true);setSyncMsg('');
    try{
      const result=await fetchRoutePlanData(url);
      setData({...result});
      setSyncMsg(`Synced — ${result.live_status.length} live, ${result.needs_action.length} needs action, ${result.new_onboarded.length} new, ${result.disabled.length} disabled`);
    }catch(e){setSyncMsg('Sync failed — check the Apps Script URL');}
    setSyncing(false);
    setTimeout(()=>setSyncMsg(''),8000);
  };

  const liveData=data.live_status||[];
  const actionData=data.needs_action||[];
  const newData=data.new_onboarded||[];
  const disabledData=data.disabled||[];
  const noData=!liveData.length&&!actionData.length&&!newData.length&&!disabledData.length;
  const lastFetch=data.lastFetched;
  const lastFetchStr=lastFetch?new Date(lastFetch).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Never synced';

  // Build RM plan
  const allRMPlanFull=buildRMPlan(data);
  // TLs only see their own team's RMs
  const tlTeamNames=user.role==='tl'?new Set(ALL_RMS.filter(r=>r.tl===user.name).map(r=>r.rm.toLowerCase())):null;
  const allRMPlan=tlTeamNames?allRMPlanFull.filter(r=>tlTeamNames.has(r.rm.toLowerCase())):allRMPlanFull;
  const effectiveName=isAdmin&&previewAs?previewAs:(!isAdmin?user.name:'');
  const rmPlan=effectiveName
    ?allRMPlan.filter(r=>r.rm.toLowerCase()===effectiveName.toLowerCase())
    :(cityF==='All'?allRMPlan:allRMPlan.map(r=>({...r,clinics:r.clinics.filter(c=>c.city===cityF)})).filter(r=>r.clinics.length));

  const allCities=['All',...new Set([...liveData,...actionData,...newData].map(r=>r.City||r.city).filter(Boolean))];

  const todayDow=new Date().getDay();
  const todayName=RP_DAY_NAMES[todayDow];

  // WhatsApp share for one RM
  const shareWhatsApp=(rmData)=>{
    const todayVisits=rmData.clinics.filter(c=>isVisitToday(c));
    if(!todayVisits.length){alert('No visits scheduled for today for '+rmData.rm);return;}
    const lines=[`*Route Plan — ${todayName}, ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}*`,`RM: ${rmData.rm}`,''];
    todayVisits.forEach((c,i)=>{
      lines.push(`${i+1}. ${c.name}`);
      const meta=[];
      if(c.status)meta.push(cleanStatus(c.status));
      if(c.gl)meta.push(`GL: ${c.gl}%`);
      if(c.trend)meta.push(c.trend);
      if(meta.length)lines.push(`   ${meta.join(' | ')}`);
    });
    lines.push('','_via Even Route Plan_');
    window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
  };

  // Clinic status helpers
  const clinicStatusStyle=(c)=>{
    if(c.source==='action')return{bg:c.dormancy&&c.dormancy.includes('14+')?B.redBg:B.amberBg,col:c.dormancy&&c.dormancy.includes('14+')?B.red:B.amber,label:c.dormancy||'Dormant'};
    if(c.source==='new')return{bg:B.blueBg,col:B.blue2,label:'New'};
    const u=(c.status||'').toUpperCase();
    if(u.includes('BELOW'))return{bg:B.redBg,col:B.red,label:'Below Target'};
    if(u.includes('RAMPING'))return{bg:B.amberBg,col:B.amber,label:'Ramping'};
    return{bg:B.greenBg,col:B.green,label:'Live'};
  };

  const FreqBadge=({freq})=>(
    <span style={{
      background:freq==='Daily'?B.redBg:B.blueBg,
      color:freq==='Daily'?B.red:B.blue2,
      padding:'2px 8px',borderRadius:5,fontSize:10,fontWeight:700,
      textTransform:'uppercase',letterSpacing:'.4px',whiteSpace:'nowrap'
    }}>{freq}</span>
  );

  const StatusDot=({c})=>{
    const s=clinicStatusStyle(c);
    return<span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:s.col,marginRight:5,flexShrink:0}}/>;
  };

  // Clinic Health tab helpers (kept for health view)
  const liveStatusStyle=(s='')=>{
    const u=s.toUpperCase();
    if(u.includes('BELOW'))return{bg:B.redBg,c:B.red,label:'BELOW TARGET'};
    if(u.includes('RAMPING'))return{bg:B.amberBg,c:B.amber,label:'RAMPING'};
    if(u.includes('LIVE'))return{bg:B.greenBg,c:B.green,label:'LIVE'};
    return{bg:'#F1F5F9',c:B.muted,label:s||'—'};
  };
  const trendStyle=(t='')=>{
    if(t==='Improving')return{c:B.green,prefix:'↑ '};
    if(t==='Declining')return{c:B.red,prefix:'↓ '};
    if(t==='New')return{c:B.blue2,prefix:'★ '};
    return{c:B.muted,prefix:''};
  };
  const dormancyStyle=(d='')=>{
    if(d==='Active')return{bg:B.greenBg,c:B.green};
    if((d||'').includes('7-14'))return{bg:B.amberBg,c:B.amber};
    if((d||'').includes('14+'))return{bg:B.redBg,c:B.red};
    return{bg:'#F1F5F9',c:B.muted};
  };
  const Badge=({label,bg,c})=>(
    <span style={{background:bg,color:c,padding:'3px 9px',borderRadius:6,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',whiteSpace:'nowrap'}}>{label||'—'}</span>
  );

  // Health view filters
  const allRows=[...liveData,...actionData,...newData,...disabledData];
  const healthCities=['All',...new Set(allRows.map(r=>r.City||r.city).filter(Boolean))];
  const applyHF=(rows)=>rows.filter(r=>{
    const city=r.City||r.city||'';
    const clinic=r.Clinic||r.clinic||'';const rm=r.RM||r.rm||'';
    if(cityF!=='All'&&city!==cityF)return false;
    if(search&&!clinic.toLowerCase().includes(search.toLowerCase())&&!rm.toLowerCase().includes(search.toLowerCase()))return false;

  });
