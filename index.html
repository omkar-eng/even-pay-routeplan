// ── USERS TAB (inside Admin) ───────────────────────────────────────────────
function UsersTab(){
  const[users,setUsers]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[newUser,setNewUser]=useState({name:'',email:'',password:'',role:'rm',tl:'',city:'Pune'});
  const[status,setStatus]=useState('');
  const[userSearch,setUserSearch]=useState('');
  const[bulkBusy,setBulkBusy]=useState(false);
  const[bulkLog,setBulkLog]=useState([]);
  const[showBulkLog,setShowBulkLog]=useState(false);

  const tls=ZONE.tls.map(t=>t.name);
  const rmNames=ALL_RMS.map(r=>r.rm).sort();
  const ROLES=[{v:'rm',l:'RM — Relationship Manager'},{v:'tl',l:'TL — Team Leader'},{v:'zonal',l:'Zonal Head'},{v:'admin',l:'Admin'}];

  useEffect(()=>{
    db.collection('users').get()
      .then(snap=>{setUsers(snap.docs.map(d=>({id:d.id,...d.data()})));})
      .catch(()=>setStatus('Could not load users'))
      .finally(()=>setLoading(false));
  },[]);

  const addUser=async()=>{
    if(!newUser.name.trim()||!newUser.email.trim()||newUser.password.length<6){
      setStatus('Fill all fields. Password must be 6+ characters.');return;
    }
    setStatus('Creating account…');
    try{
      // Use secondary Firebase app instance so we don't log out the admin
      const secondary=firebase.initializeApp(firebaseConfig,'_secondary_'+Date.now());
      const secAuth=secondary.auth();
      const cred=await secAuth.createUserWithEmailAndPassword(newUser.email.trim(),newUser.password);
      const uid=cred.user.uid;
      const userData={name:newUser.name.trim(),email:newUser.email.trim().toLowerCase(),role:newUser.role,
        ...(newUser.role==='rm'||newUser.role==='tl'?{tl:newUser.tl,city:newUser.city}:{}),
        mustChangePassword:true,createdAt:new Date().toISOString()};
      await db.collection('users').doc(uid).set(userData);
      await secAuth.signOut();
      await secondary.delete();
      setUsers(prev=>[...prev,{id:uid,...userData}]);
      setNewUser({name:'',email:'',password:'',role:'rm',tl:'',city:'Pune'});
      setShowAdd(false);
      setStatus('✅ Account created! They can now log in at even-pay-routeplan.vercel.app');
      setTimeout(()=>setStatus(''),6000);
    }catch(e){
      const msgs={'auth/email-already-in-use':'This email already has an account.','auth/invalid-email':'Invalid email address.','auth/weak-password':'Password too weak (6+ chars).'};
      setStatus('❌ '+(msgs[e.code]||e.message));
    }
  };

  const changeRole=async(uid,newRole)=>{
    await db.collection('users').doc(uid).update({role:newRole});
    setUsers(prev=>prev.map(u=>u.id===uid?{...u,role:newRole}:u));
    setStatus('✅ Role updated');setTimeout(()=>setStatus(''),3000);
  };

  const resetPassword=async(email)=>{
    try{
      await auth.sendPasswordResetEmail(email);
      setStatus('✅ Reset link sent to '+email+' — tell them to check Spam / Junk if it doesn\'t arrive.');
    }catch(e){
      const msgs={'auth/user-not-found':'No account found for '+email,'auth/invalid-email':'Invalid email address'};
      setStatus('❌ '+(msgs[e.code]||'Could not send reset email'));
    }
    setTimeout(()=>setStatus(''),9000);
  };

  const removeUser=async(uid,name)=>{
    if(!window.confirm(`Remove ${name}'s access? They won't be able to log in.`))return;
    await db.collection('users').doc(uid).delete();
    setUsers(prev=>prev.filter(u=>u.id!==uid));
    setStatus('✅ Access removed');setTimeout(()=>setStatus(''),3000);
  };

  const BULK_PASSWORD='Even@1234';
  const bulkCreate=async()=>{
    if(!window.confirm(`Create accounts for all TLs and RMs?\n\nEmail: firstname@even.in\nPassword: ${BULK_PASSWORD}\n\nExisting accounts will be skipped.`))return;
    setBulkBusy(true);setShowBulkLog(true);
    const log=[];
    const addLog=(name,email,status,msg)=>{log.push({name,email,status,msg});setBulkLog([...log]);};
    const existingEmails=new Set(users.map(u=>u.email?.toLowerCase()));
    const usedEmails=new Set();
    const toCreate=[];
    for(const tl of ZONE.tls){
      const fn=tl.name.trim().split(/\s+/)[0].toLowerCase();
      toCreate.push({name:tl.name,email:`${fn}@even.in`,role:'tl',tl:tl.name,city:'Pune'});
    }
    for(const rm of ALL_RMS){
      const fn=rm.rm.trim().split(/\s+/)[0].toLowerCase();
      toCreate.push({name:rm.rm,email:`${fn}@even.in`,role:'rm',tl:rm.tl,city:rm.city||'Pune'});
    }
    for(const p of toCreate){
      const emailLo=p.email.toLowerCase();
      if(existingEmails.has(emailLo)){addLog(p.name,p.email,'skip','Already has account');continue;}
      if(usedEmails.has(emailLo)){addLog(p.name,p.email,'skip','Email conflict — create manually with full name');continue;}
      usedEmails.add(emailLo);
      try{
        const secondary=firebase.initializeApp(firebaseConfig,'_bulk_'+Date.now());
        const secAuth=secondary.auth();
        const cred=await secAuth.createUserWithEmailAndPassword(p.email,BULK_PASSWORD);
        const uid=cred.user.uid;
        const userData={name:p.name,email:emailLo,role:p.role,tl:p.tl,city:p.city,mustChangePassword:true,createdAt:new Date().toISOString()};
        await db.collection('users').doc(uid).set(userData);
        await secAuth.signOut();await secondary.delete();
        setUsers(prev=>[...prev,{id:uid,...userData}]);
        existingEmails.add(emailLo);
        addLog(p.name,p.email,'ok','Created');
      }catch(e){
        if(e.code==='auth/email-already-in-use'){existingEmails.add(emailLo);addLog(p.name,p.email,'skip','Already has account');}
        else addLog(p.name,p.email,'err',e.message);
      }
    }
    setBulkBusy(false);
  };

  const inp=(val,set,ph,type='text')=><input value={val} onChange={e=>set(e.target.value)} placeholder={ph} type={type}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>;

  const selEl=(val,set,opts)=><select value={val} onChange={e=>set(e.target.value)}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
    {opts.map(o=>typeof o==='string'?<option key={o}>{o}</option>:<option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;

  const filtered=users.filter(u=>!userSearch||u.name?.toLowerCase().includes(userSearch.toLowerCase())||u.email?.toLowerCase().includes(userSearch.toLowerCase()));
  const roleColors={admin:'#4338CA',zonal:B.brand,tl:B.green,rm:B.muted};

  return(
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:B.ink}}>👤 User Access Management</div>
          <div style={{fontSize:12,color:B.muted,marginTop:2}}>Add team members so they can log in to the app</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {status&&<span style={{fontSize:13,color:status.includes('✅')?B.green:status.includes('❌')?B.red:B.muted,fontWeight:600,maxWidth:300}}>{status}</span>}
          <button onClick={bulkCreate} disabled={bulkBusy}
            style={{padding:'9px 18px',background:bulkBusy?B.muted:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
            {bulkBusy?'Creating…':'⚡ Bulk Create All'}
          </button>
          <button onClick={()=>setShowAdd(!showAdd)}
            style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
            + Add Team Member
          </button>
        </div>
      </div>

      {/* Add user form */}
      {showBulkLog&&bulkLog.length>0&&<Card style={{marginBottom:16,borderLeft:`4px solid ${B.green}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:14,color:B.ink}}>
            Bulk Create Results&nbsp;
            <span style={{color:B.green}}>{bulkLog.filter(l=>l.status==='ok').length} created</span>
            {bulkLog.filter(l=>l.status==='skip').length>0&&<span style={{color:B.muted}}> · {bulkLog.filter(l=>l.status==='skip').length} skipped</span>}
            {bulkLog.filter(l=>l.status==='err').length>0&&<span style={{color:B.red}}> · {bulkLog.filter(l=>l.status==='err').length} failed</span>}
            {bulkBusy&&<span style={{color:B.amber}}> · creating…</span>}
          </div>
          {!bulkBusy&&<button onClick={()=>setShowBulkLog(false)} style={{background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:18}}>×</button>}
        </div>
        <div style={{maxHeight:220,overflowY:'auto',fontSize:12}}>
          {bulkLog.map((l,i)=>(
            <div key={i} style={{display:'flex',gap:8,alignItems:'center',padding:'4px 0',borderBottom:`1px solid ${B.line}`}}>
              <span style={{fontSize:14}}>{l.status==='ok'?'✅':l.status==='skip'?'⏭️':'❌'}</span>
              <span style={{fontWeight:600,minWidth:160,color:B.ink}}>{l.name}</span>
              <span style={{color:B.muted,minWidth:180}}>{l.email}</span>
              <span style={{color:l.status==='ok'?B.green:l.status==='err'?B.red:B.muted}}>{l.msg}</span>
            </div>
          ))}
        </div>
        {!bulkBusy&&<div style={{marginTop:10,padding:'10px 12px',background:'#f0fdf4',borderRadius:10,fontSize:12,color:'#166534'}}>
          Password for all new accounts: <strong>{BULK_PASSWORD}</strong> — share this with each person and ask them to change it after first login.
        </div>}
      </Card>}

      {showAdd&&<Card style={{marginBottom:16,borderLeft:`4px solid ${B.brand}`}}>
        <div style={{fontWeight:700,fontSize:14,color:B.brand,marginBottom:14}}>Add New Team Member</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginBottom:14}}>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>
              {newUser.role==='rm'?'Select RM *':newUser.role==='tl'?'Select TL *':'Full Name *'}
            </div>
            {newUser.role==='rm'
              ? selEl(newUser.name,v=>setNewUser({...newUser,name:v}),[{v:'',l:'Pick RM from list…'},...rmNames])
              : newUser.role==='tl'
                ? selEl(newUser.name,v=>setNewUser({...newUser,name:v}),[{v:'',l:'Pick TL from list…'},...tls])
                : inp(newUser.name,v=>setNewUser({...newUser,name:v}),'e.g. Omkar')}
          </div>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Work Email *</div>
            {inp(newUser.email,v=>setNewUser({...newUser,email:v}),'rohan@even.in','email')}
          </div>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Password * (6+ chars)</div>
            {inp(newUser.password,v=>setNewUser({...newUser,password:v}),'Set their password','password')}
          </div>
          <div>
            <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Role *</div>
            {selEl(newUser.role,v=>setNewUser({...newUser,role:v,name:''}),ROLES)}
          </div>
          {newUser.role==='rm'&&<>
            <div>
              <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Their TL</div>
              {selEl(newUser.tl,v=>setNewUser({...newUser,tl:v}),[{v:'',l:'Select TL…'},...tls])}
            </div>
            <div>
              <div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
              {selEl(newUser.city,v=>setNewUser({...newUser,city:v}),['Pune','Mumbai','Nagpur'])}
            </div>
          </>}
        </div>
        <div style={{background:B.amberBg,border:`1px solid ${B.amber}`,borderRadius:8,padding:'8px 12px',marginBottom:12,fontSize:12,color:B.amber}}>
          Share these credentials with the team member: <strong>{newUser.email||'email'}</strong> / <strong>{newUser.password||'password'}</strong>
          {' '}— Login at even-pay-routeplan.vercel.app
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={addUser} style={{padding:'9px 20px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Create Account</button>
          <button onClick={()=>setShowAdd(false)} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
        </div>
      </Card>}

      {/* Search */}
      <input value={userSearch} onChange={e=>setUserSearch(e.target.value)} placeholder="🔍 Search by name or email…"
        style={{width:'100%',maxWidth:320,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',marginBottom:12,boxSizing:'border-box'}}
        onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>

      {/* Users table */}
      {loading?<div style={{padding:40,textAlign:'center',color:B.muted}}>Loading users…</div>:
      <div className="tbl-wrap">
        <table className="dt">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>TL</th><th>City</th><th>Added</th><th>Change Role</th><th>Action</th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={8} style={{textAlign:'center',color:B.muted,padding:30}}>No users found</td></tr>}
            {filtered.map((u,i)=>(
              <tr key={i}>
                <td><strong>{u.name||'—'}</strong></td>
                <td style={{color:B.muted}}>{u.email}</td>
                <td>
                  <span style={{background:roleColors[u.role]+'18',color:roleColors[u.role]||B.muted,padding:'3px 10px',borderRadius:10,fontSize:11,fontWeight:700,textTransform:'uppercase'}}>
                    {u.role}
                  </span>
                </td>
                <td>{u.tl||'—'}</td>
                <td>{u.city||'—'}</td>
                <td style={{color:B.muted,fontSize:11}}>{u.createdAt?new Date(u.createdAt).toLocaleDateString('en-IN'):'—'}</td>
                <td>
                  <select value={u.role} onChange={e=>changeRole(u.id,e.target.value)}
                    style={{padding:'5px 8px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,background:B.white,outline:'none',cursor:'pointer'}}>
                    {ROLES.map(r=><option key={r.v} value={r.v}>{r.l.split('—')[0].trim()}</option>)}
                  </select>
                </td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button onClick={()=>resetPassword(u.email)}
                      style={{padding:'5px 10px',background:B.amberBg,color:B.amber,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                      Reset Pwd
                    </button>
                    <button onClick={()=>removeUser(u.id,u.name)}
                      style={{padding:'5px 10px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                      Remove
                    </button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>}
      <div style={{fontSize:12,color:B.muted,marginTop:10}}>{filtered.length} user{filtered.length!==1?'s':''} with app access</div>

      {/* Reports section */}
      <div style={{marginTop:28}}>
        <div style={{fontSize:14,fontWeight:700,color:B.ink,marginBottom:10}}>📊 Download Reports</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {[
            {label:'All Targets CSV',fn:()=>downloadCSV(['TL','RM','City','Target','Achieved','Target %'],Object.values(loadStore()).map(e=>[e.tl,e.rm,e.city||'',e.target||0,e.achieved||0,pct(e.netAchieved||0,e.target||0)+'%']),'targets.csv')},
            {label:'City Summary CSV',fn:()=>downloadCSV(['City','RMs','Target','Achieved','Target %'],ZONE.cities.map(c=>[c.name,c.rms,c.target,c.achieved,pct(c.achieved,c.target)+'%']),'city_summary.csv')},
            {label:'TL Summary CSV',fn:()=>downloadCSV(['TL','City','RMs','Target','Achieved','Target %'],ZONE.tls.map(t=>[t.name,t.city,t.rms,t.target,t.achieved,pct(t.achieved,t.target)+'%']),'tl_summary.csv')},
            {label:'RM Individual CSV',fn:()=>downloadCSV(['TL','RM','City','Target','Achieved','Target %','Monthly Tgt','Monthly Achv'],ALL_RMS.map(r=>[r.tl,r.rm,r.city,r.target,r.achieved,pct(r.achieved,r.target)+'%',r.monthlyTgt,r.monthlyAchv]),'rm_individual.csv')},
          ].map(({label,fn})=>(
            <button key={label} onClick={fn}
              style={{padding:'10px 18px',background:B.white,color:B.navy,border:`1.5px solid ${B.navy}`,borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer'}}>
              ↓ {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ADMIN PANEL ────────────────────────────────────────────────────────────
function AdminPanel(){
  const isMobile=useIsMobile();
  const[adminTab,setAdminTab]=useState('targets');

  // ── Targets state ──
  const[targets,setTargets]=useState({});
  const[saving,setSaving]=useState('');
  const[selectedTL,setSelectedTL]=useState('');
  const[selectedRM,setSelectedRM]=useState('');
  const[form,setForm]=useState({target:'',refund:'',monthlyLeads:'',dailyLeads:'',renewalTarget:'',netAchieved:'',monthlyAchieved:'',dailyAchieved:'',renewalAchieved:''});

  // ── RM management state ──
  const[workingRMs,setWorkingRMs]=useState(()=>ALL_RMS.map(r=>({...r})));
  const[workingTLs]=useState(()=>ZONE.tls.map(t=>t.name));
  const[rmSearch,setRmSearch]=useState('');
  const[editRM,setEditRM]=useState(null); // {index, rm, tl, city}
  const[showAddRM,setShowAddRM]=useState(false);
  const[newRM,setNewRM]=useState({rm:'',tl:'',city:'Pune'});
  const[rmSaving,setRmSaving]=useState('');

  // ── Route sync state ──
  const[sheetUrl,setSheetUrl]=useState(_cache.route_settings?.sheetUrl||'');
  const[routeSyncing,setRouteSyncing]=useState(false);
  const[routeSyncMsg,setRouteSyncMsg]=useState('');
  // ── Auto-sync state ──
  const[autoSyncEnabled,setAutoSyncEnabled]=useState(!!_cache.sync_settings?.enabled);
  const[syncIntervalMin,setSyncIntervalMin]=useState(_cache.sync_settings?.intervalMin||30);
  const[autoSyncMsg,setAutoSyncMsg]=useState('');
  const[payDiag,setPayDiag]=useState(null);
  const lastSynced=_cache.sync_settings?.lastSynced
    ?new Date(_cache.sync_settings.lastSynced).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
    :null;

  // ── Clinic management state ──
  const[workingClinics,setWorkingClinics]=useState(()=>ALL_RMS.flatMap(r=>r.clinics.map(c=>({...c,rm:r.rm,tl:r.tl,city:r.city}))));
  const[clinicSearch,setClinicSearch]=useState('');
  const[showAddClinic,setShowAddClinic]=useState(false);
  const[newClinic,setNewClinic]=useState({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});
  const[clinicSaving,setClinicSaving]=useState('');

  useEffect(()=>{setTargets(loadStore());},[]);

  const tls=ZONE.tls.map(t=>t.name);
  const rms=selectedTL?workingRMs.filter(r=>r.tl===selectedTL).map(r=>r.rm):[];

  const loadEntry=(tl,rm)=>{
    const e=targets[safeKey(`${tl}|${rm}`)]||{};
    setForm({target:e.target||'',refund:e.refund||'',monthlyLeads:e.monthlyLeads||'',dailyLeads:e.dailyLeads||'',renewalTarget:e.renewalTarget||'',netAchieved:e.netAchieved||'',monthlyAchieved:e.monthlyAchieved||'',dailyAchieved:e.dailyAchieved||'',renewalAchieved:e.renewalAchieved||''});
  };

  const saveTargets=async()=>{
    if(!selectedTL||!selectedRM){setSaving('Select TL and RM first');return;}
    setSaving('Saving…');
    const key=safeKey(`${selectedTL}|${selectedRM}`);
    const entry={tl:selectedTL,rm:selectedRM,city:workingRMs.find(r=>r.rm===selectedRM)?.city||'',
      ...Object.fromEntries(Object.entries(form).map(([k,v])=>[k,parseFloat(v)||0])),
      updated:new Date().toLocaleString('en-IN'),updatedAt:Date.now()};
    const newT={...targets,[key]:entry};
    await saveStore(newT);setTargets(newT);
    applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
    setSaving('✅ Saved to Firebase!');
    setTimeout(()=>setSaving(''),3000);
  };

  // Write one RM's data directly to targets collection
  const saveRMDoc=async(tl,rm,patch)=>{
    const key=safeKey(`${tl}|${rm}`);
    const doc={...(_cache.targets[key]||{}),tl,rm,...patch,updatedAt:new Date().toISOString()};
    await db.collection('targets').doc(key).set(doc);
    _cache.targets[key]=doc;
  };

  // ── Route Sync actions ──
  const handleSaveSheetUrl=async()=>{
    if(!sheetUrl.trim()){setRouteSyncMsg('Paste the published CSV URL first');return;}
    await saveRouteSettings({sheetUrl:sheetUrl.trim()});
    setRouteSyncMsg('Sheet URL saved');
    setTimeout(()=>setRouteSyncMsg(''),3000);
  };
  const handleSyncNow=async()=>{
    if(!sheetUrl.trim()){setRouteSyncMsg('Save a sheet URL first');return;}
    setRouteSyncing(true);setRouteSyncMsg('');
    try{
      const res=await syncLeadsFromSheet(sheetUrl.trim());
      const n=Object.keys(res).filter(k=>!k.startsWith('_')).length;
      setRouteSyncMsg('Synced '+n+' clinic leads');
    }catch(e){setRouteSyncMsg('Sync failed — verify the URL and that the sheet is published as CSV');}
    setRouteSyncing(false);
    setTimeout(()=>setRouteSyncMsg(''),6000);
  };

  const handleSaveAutoSync=async()=>{
    const settings={..._cache.sync_settings,enabled:autoSyncEnabled,intervalMin:Number(syncIntervalMin)};
    _cache.sync_settings=settings;
    await db.collection('config').doc('sync_settings').set(settings).catch(()=>{});
    setupAutoSync();
    setAutoSyncMsg('✅ Saved!');setTimeout(()=>setAutoSyncMsg(''),3000);
  };

  // ── RM Actions ──
  const handleAddRM=async()=>{
    if(!newRM.rm.trim()||!newRM.tl){setRmSaving('Fill in all fields');return;}
    const rmName=newRM.rm.trim();
    if(workingRMs.find(r=>r.rm.toLowerCase()===rmName.toLowerCase())){setRmSaving('RM already exists');return;}
    setRmSaving('Saving…');
    try{
      await saveRMDoc(newRM.tl,rmName,{city:newRM.city,target:0,netAchieved:0,monthlyLeads:0,clinics:[]});
      const updated=[...workingRMs,{rm:rmName,tl:newRM.tl,city:newRM.city,leads:0,clinics:[],target:0,achieved:0,refund:0,monthlyTgt:0,monthlyAchv:0,dailyTgt:0,dailyAchv:0,renewalTgt:0,renewalAchv:0}];
      setWorkingRMs(updated);
      applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
      setNewRM({rm:'',tl:'',city:'Pune'});setShowAddRM(false);
      setRmSaving('✅ RM added!');setTimeout(()=>setRmSaving(''),3000);
    }catch(e){setRmSaving('❌ Save failed');setTimeout(()=>setRmSaving(''),3000);}
  };

  const handleEditRM=async()=>{
    if(!editRM)return;
    const newName=(editRM.rmName||'').trim();
    if(!newName){setRmSaving('Name cannot be empty');return;}
    setRmSaving('Saving…');
    try{
      const oldRM=workingRMs[editRM.index];
      const oldKey=safeKey(`${oldRM.tl}|${oldRM.rm}`);
      const newKey=safeKey(`${editRM.tl}|${newName}`);
      const existingData=_cache.targets[oldKey]||{};
      // Delete old doc if key changed (name or TL changed)
      if(oldKey!==newKey){
        await db.collection('targets').doc(oldKey).delete();
        delete _cache.targets[oldKey];
      }
      await saveRMDoc(editRM.tl,newName,{city:editRM.city,netAchieved:existingData.netAchieved||0,target:existingData.target||0,monthlyLeads:existingData.monthlyLeads||0,clinics:existingData.clinics||[]});
      applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
      const updated=workingRMs.map((r,i)=>i===editRM.index?{...r,rm:newName,tl:editRM.tl,city:editRM.city}:r);
      setWorkingRMs(updated);
      setEditRM(null);
      setRmSaving('✅ Updated!');setTimeout(()=>setRmSaving(''),3000);
    }catch(e){setRmSaving('❌ Save failed');setTimeout(()=>setRmSaving(''),3000);}
  };

  const handleRemoveRM=async(index)=>{
    const rm=workingRMs[index];
    if(rm.clinics&&rm.clinics.length>0){alert(`${rm.rm} has ${rm.clinics.length} clinic(s). Reassign clinics first.`);return;}
    if(!window.confirm(`Remove ${rm.rm} from the system? This cannot be undone.`))return;
    const key=safeKey(`${rm.tl}|${rm.rm}`);
    await db.collection('targets').doc(key).delete().catch(()=>{});
    delete _cache.targets[key];
    applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
    setWorkingRMs(workingRMs.filter((_,i)=>i!==index));
    setRmSaving('✅ RM removed');setTimeout(()=>setRmSaving(''),3000);
  };

  // ── Clinic Actions ──
  // Helper: persist the clinic list for one RM's targets doc
  const saveClinicList=async(tl,rmName,clinics)=>{
    await saveRMDoc(tl,rmName,{clinics});
  };

  const handleReassignClinic=async(clinicIndex,newRMName)=>{
    if(workingClinics[clinicIndex].rm===newRMName)return;
    const flat=workingClinics[clinicIndex];
    const newRMObj=workingRMs.find(r=>r.rm===newRMName);
    if(!newRMObj)return;
    setClinicSaving('Saving…');
    try{
      const clinicData={name:flat.name,locality:flat.locality||'',status:flat.status,freq:flat.freq,slot:flat.slot||'',leads:flat.leads||0};
      // Remove from old RM's doc
      const oldRMObj=workingRMs.find(r=>r.rm===flat.rm);
      if(oldRMObj){
        const oldKey=safeKey(`${oldRMObj.tl}|${oldRMObj.rm}`);
        const oldClinics=(_cache.targets[oldKey]?.clinics||[]).filter(c=>c.name!==flat.name);
        await saveClinicList(oldRMObj.tl,oldRMObj.rm,oldClinics);
      }
      // Add to new RM's doc
      const newKey=safeKey(`${newRMObj.tl}|${newRMObj.rm}`);
      const newClinics=[...(_cache.targets[newKey]?.clinics||[]).filter(c=>c.name!==flat.name),clinicData];
      await saveClinicList(newRMObj.tl,newRMObj.rm,newClinics);
      applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
      setWorkingClinics(workingClinics.map((c,i)=>i===clinicIndex?{...c,rm:newRMName,tl:newRMObj.tl,city:newRMObj.city}:c));
      setClinicSaving('✅ Reassigned!');setTimeout(()=>setClinicSaving(''),3000);
    }catch(e){setClinicSaving('❌ Save failed');setTimeout(()=>setClinicSaving(''),3000);}
  };

  const handleAddClinic=async()=>{
    if(!newClinic.name.trim()||!newClinic.rm){setClinicSaving('Fill clinic name and assign RM');return;}
    setClinicSaving('Saving…');
    try{
      const rmObj=workingRMs.find(r=>r.rm===newClinic.rm);
      const clinicData={name:newClinic.name.trim(),locality:newClinic.locality||'',status:newClinic.status,freq:newClinic.freq,slot:newClinic.slot||'',leads:newClinic.leads||0};
      const key=safeKey(`${rmObj.tl}|${rmObj.rm}`);
      const existing=(_cache.targets[key]?.clinics||[]);
      await saveClinicList(rmObj.tl,rmObj.rm,[...existing,clinicData]);
      applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
      setWorkingClinics([...workingClinics,{...clinicData,rm:rmObj.rm,tl:rmObj.tl,city:rmObj.city}]);
      setNewClinic({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});
      setShowAddClinic(false);
      setClinicSaving('✅ Clinic added!');setTimeout(()=>setClinicSaving(''),3000);
    }catch(e){setClinicSaving('❌ Save failed');setTimeout(()=>setClinicSaving(''),3000);}
  };

  const handleRemoveClinic=async(index)=>{
    const flat=workingClinics[index];
    if(!window.confirm(`Remove ${flat.name} from route plan?`))return;
    try{
      const rmObj=workingRMs.find(r=>r.rm===flat.rm);
      if(rmObj){
        const key=safeKey(`${rmObj.tl}|${rmObj.rm}`);
        const updated=(_cache.targets[key]?.clinics||[]).filter(c=>c.name!==flat.name);
        await saveClinicList(rmObj.tl,rmObj.rm,updated);
      }
      applyStoreToRMs();window.dispatchEvent(new Event('rmDataUpdated'));
      setWorkingClinics(workingClinics.filter((_,i)=>i!==index));
      setClinicSaving('✅ Clinic removed');setTimeout(()=>setClinicSaving(''),3000);
    }catch(e){setClinicSaving('❌ Save failed');setTimeout(()=>setClinicSaving(''),3000);}
  };

  const filteredRMs=workingRMs.filter(r=>!rmSearch||r.rm.toLowerCase().includes(rmSearch.toLowerCase())||r.tl.toLowerCase().includes(rmSearch.toLowerCase()));
  const filteredClinics=workingClinics.filter(c=>!clinicSearch||c.name.toLowerCase().includes(clinicSearch.toLowerCase())||c.rm.toLowerCase().includes(clinicSearch.toLowerCase()));

  const inp=(val,set,ph,type='text')=><input value={val} onChange={e=>set(e.target.value)} placeholder={ph} type={type}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>;

  const sel=(val,set,opts)=><select value={val} onChange={e=>set(e.target.value)}
    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
    {opts.map(o=>typeof o==='string'?<option key={o}>{o}</option>:<option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;

  const adminTabs=[['targets','🎯 Targets'],['rms','👥 RMs & TLs'],['clinics','🏥 Clinics'],['route','🗺️ Route Sync'],['settings','👤 Users & Reports']];

  return(
    <div style={{background:B.bg,minHeight:'100vh',paddingBottom:isMobile?80:20,padding:isMobile?'0 0 80px 0':'20px 24px'}}>
      {!isMobile&&<div style={{fontSize:24,fontWeight:800,color:B.navy,marginBottom:20}}>⚙️ Admin Panel</div>}
      {isMobile&&<div style={{background:'linear-gradient(135deg,#1E1B4B,#4338CA)',padding:'22px 18px 16px',borderRadius:'0 0 28px 28px',marginBottom:0}}>
        <div style={{color:'rgba(255,255,255,.65)',fontSize:12}}>Admin Panel</div>
        <div style={{color:'#fff',fontSize:20,fontWeight:800,marginTop:2}}>Sales Operations</div>
      </div>}

      {/* Admin tab nav */}
      <div style={{background:B.white,borderBottom:`1px solid ${B.line}`,display:'flex',overflowX:'auto',marginBottom:20}}>
        {adminTabs.map(([id,lbl])=>(
          <button key={id} onClick={()=>setAdminTab(id)}
            style={{padding:'12px 16px',background:'none',border:'none',borderBottom:adminTab===id?`3px solid ${B.brand}`:'3px solid transparent',color:adminTab===id?B.brand:B.muted,fontWeight:adminTab===id?700:500,fontSize:13,cursor:'pointer',whiteSpace:'nowrap'}}>
            {lbl}
          </button>
        ))}
      </div>

      <div style={{maxWidth:1000}}>

        {/* ── TARGETS TAB ── */}
        {adminTab==='targets'&&<Card>
          <div style={{fontWeight:700,fontSize:16,color:B.ink,marginBottom:4}}>🎯 Set Monthly Targets</div>
          <div style={{fontSize:12,color:B.muted,marginBottom:16}}>Saved to Firebase — visible on all devices instantly</div>
          <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
            <select value={selectedTL} onChange={e=>{setSelectedTL(e.target.value);setSelectedRM('');}}
              style={{flex:1,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',minWidth:120}}>
              <option value="">Select TL…</option>{tls.map(t=><option key={t}>{t}</option>)}
            </select>
            <select value={selectedRM} onChange={e=>{setSelectedRM(e.target.value);loadEntry(selectedTL,e.target.value);}}
              style={{flex:1,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',minWidth:120}}>
              <option value="">Select RM…</option>{rms.map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          {selectedRM&&<>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginBottom:14}}>
              {[['target','Target (₹)'],['refund','Refund (₹)'],['monthlyLeads','Monthly Leads Target'],['dailyLeads','Daily Leads Target'],['renewalTarget','Renewal Target'],['netAchieved','Net Achieved (₹)'],['monthlyAchieved','Monthly Leads Achieved'],['dailyAchieved','Daily Leads Achieved'],['renewalAchieved','Renewals Achieved']].map(([k,l])=>(
                <div key={k}>
                  <div style={{fontSize:10,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>{l}</div>
                  <input type="number" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder="0"
                    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:14,outline:'none',boxSizing:'border-box'}}
                    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <button onClick={saveTargets} style={{padding:'11px 24px',background:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>💾 Save to Firebase</button>
              {saving&&<span style={{fontSize:13,color:saving.includes('✅')?B.green:B.muted,fontWeight:600}}>{saving}</span>}
            </div>
          </>}
        </Card>}

        {/* ── RMs & TLs TAB ── */}
        {adminTab==='rms'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <input value={rmSearch} onChange={e=>setRmSearch(e.target.value)} placeholder="🔍 Search RM or TL…"
              style={{flex:1,maxWidth:300,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {rmSaving&&<span style={{fontSize:13,color:rmSaving.includes('✅')?B.green:B.red,fontWeight:600}}>{rmSaving}</span>}
              <button onClick={()=>setShowAddRM(!showAddRM)}
                style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                + Add New RM
              </button>
            </div>
          </div>

          {/* Add RM form */}
          {showAddRM&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.brand}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.brand,marginBottom:12}}>Add New RM</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>RM Name *</div>{inp(newRM.rm,v=>setNewRM({...newRM,rm:v}),'e.g. Rohan Sharma')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Assign TL *</div>
                {sel(newRM.tl,v=>setNewRM({...newRM,tl:v}),[{v:'',l:'Select TL…'},...workingTLs])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
                {sel(newRM.city,v=>setNewRM({...newRM,city:v}),['Pune','Mumbai','Nagpur'])}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleAddRM} style={{padding:'9px 20px',background:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Add RM</button>
              <button onClick={()=>{setShowAddRM(false);setNewRM({rm:'',tl:'',city:'Pune'});}} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* Edit RM modal */}
          {editRM&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.amber}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.amber,marginBottom:12}}>Edit RM: {editRM.rm}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Name</div>
                {inp(editRM.rmName,v=>setEditRM({...editRM,rmName:v}),'RM full name')}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Reassign to TL</div>
                {sel(editRM.tl,v=>setEditRM({...editRM,tl:v}),workingTLs)}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>City</div>
                {sel(editRM.city,v=>setEditRM({...editRM,city:v}),['Pune','Mumbai','Nagpur'])}
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleEditRM} style={{padding:'9px 20px',background:B.amber,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Save Changes</button>
              <button onClick={()=>setEditRM(null)} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* RM Table */}
          <div className="tbl-wrap">
            <table className="dt">
              <thead><tr><th>RM Name</th><th>TL</th><th>City</th><th className="num">Clinics</th><th className="num">Leads</th><th>Actions</th></tr></thead>
              <tbody>
                {filteredRMs.map((r,i)=>(
                  <tr key={i}>
                    <td><strong>{r.rm}</strong></td>
                    <td>{r.tl}</td>
                    <td>{r.city}</td>
                    <td className="num">{r.clinics?.length||0}</td>
                    <td className="num">{r.leads||0}</td>
                    <td>
                      <div style={{display:'flex',gap:6}}>
                        <button onClick={()=>setEditRM({index:i,rm:r.rm,rmName:r.rm,tl:r.tl,city:r.city})}
                          style={{padding:'5px 12px',background:B.brandLight,color:B.brand,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                          ✏️ Edit
                        </button>
                        <button onClick={()=>handleRemoveRM(i)}
                          style={{padding:'5px 12px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',marginLeft:6}}>
                          🗑️ Remove
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:B.muted,marginTop:10}}>Showing {filteredRMs.length} of {workingRMs.length} RMs</div>
        </div>}

        {/* ── CLINICS TAB ── */}
        {adminTab==='clinics'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <input value={clinicSearch} onChange={e=>setClinicSearch(e.target.value)} placeholder="🔍 Search clinic or RM…"
              style={{flex:1,maxWidth:300,padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none'}}
              onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {clinicSaving&&<span style={{fontSize:13,color:clinicSaving.includes('✅')?B.green:B.red,fontWeight:600}}>{clinicSaving}</span>}
              <button onClick={()=>setShowAddClinic(!showAddClinic)}
                style={{padding:'9px 18px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                + Add New Clinic
              </button>
            </div>
          </div>

          {/* Add Clinic form */}
          {showAddClinic&&<Card style={{marginBottom:14,borderLeft:`4px solid ${B.green}`}}>
            <div style={{fontWeight:700,fontSize:14,color:B.green,marginBottom:12}}>Add New Clinic</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10,marginBottom:12}}>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Clinic Name *</div>{inp(newClinic.name,v=>setNewClinic({...newClinic,name:v}),'e.g. Sunrise Clinic')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Locality</div>{inp(newClinic.locality,v=>setNewClinic({...newClinic,locality:v}),'e.g. Aundh')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Assign RM *</div>
                {sel(newClinic.rm,v=>setNewClinic({...newClinic,rm:v}),[{v:'',l:'Select RM…'},...workingRMs.map(r=>r.rm)])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Status</div>
                {sel(newClinic.status,v=>setNewClinic({...newClinic,status:v}),['Growing','Stable','Declining'])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Frequency</div>
                {sel(newClinic.freq,v=>setNewClinic({...newClinic,freq:v}),['Daily','Tri-weekly','Bi-weekly','Weekly'])}
              </div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Timeslot</div>{inp(newClinic.slot,v=>setNewClinic({...newClinic,slot:v}),'e.g. 11:00–1:00')}</div>
              <div><div style={{fontSize:11,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase'}}>Leads</div>{inp(newClinic.leads,v=>setNewClinic({...newClinic,leads:parseInt(v)||0}),'0','number')}</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={handleAddClinic} style={{padding:'9px 20px',background:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>✓ Add Clinic</button>
              <button onClick={()=>{setShowAddClinic(false);setNewClinic({name:'',locality:'',rm:'',city:'Pune',status:'Stable',freq:'Tri-weekly',slot:'',leads:0});}} style={{padding:'9px 16px',background:B.bg,color:B.muted,border:`1px solid ${B.line}`,borderRadius:10,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </Card>}

          {/* Clinic Table */}
          <div className="tbl-wrap">
            <table className="dt">
              <thead><tr><th>Clinic</th><th>Locality</th><th>Current RM</th><th>TL</th><th>City</th><th className="num">Leads</th><th>Status</th><th>Reassign RM</th><th>Action</th></tr></thead>
              <tbody>
                {filteredClinics.map((c,i)=>(
                  <tr key={i}>
                    <td><strong>{c.name}</strong></td>
                    <td style={{color:B.muted}}>{c.locality||'—'}</td>
                    <td>{c.rm}</td>
                    <td>{c.tl}</td>
                    <td>{c.city}</td>
                    <td className="num">{c.leads||0}</td>
                    <td><SBadge status={c.status}/></td>
                    <td>
                      <select defaultValue={c.rm} onChange={e=>handleReassignClinic(i,e.target.value)}
                        style={{padding:'5px 8px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,background:B.white,outline:'none',cursor:'pointer',minWidth:130}}>
                        {workingRMs.map(r=><option key={r.rm} value={r.rm}>{r.rm}</option>)}
                      </select>
                    </td>
                    <td>
                      <button onClick={()=>handleRemoveClinic(i)}
                        style={{padding:'5px 10px',background:B.redBg,color:B.red,border:'none',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                        🗑️
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:B.muted,marginTop:10}}>Showing {filteredClinics.length} of {workingClinics.length} clinics</div>
        </div>}

        {/* ── ROUTE SYNC TAB ── */}
        {adminTab==='route'&&<div>
          <Card style={{marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:16,color:B.ink,marginBottom:4}}>Route Plan — Sheet Sync</div>
            <div style={{fontSize:12,color:B.muted,marginBottom:18}}>Connect a published Google Sheet to update clinic lead counts daily. One sync overwrites all leads with the sheet values.</div>

            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:B.muted,marginBottom:6,fontWeight:600,textTransform:'uppercase'}}>Google Sheet CSV URL</div>
              <input value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)}
                placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"
                style={{width:'100%',padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
              <div style={{fontSize:11,color:B.muted,marginTop:6,lineHeight:1.6}}>
                In Google Sheets: <strong>File → Share → Publish to web</strong> → choose the sheet → select <strong>CSV</strong> → Publish. Copy the URL here.
              </div>
            </div>

            <div style={{background:B.amberBg,border:`1px solid ${B.amber}`,borderRadius:10,padding:'12px 14px',marginBottom:18}}>
              <div style={{fontWeight:700,fontSize:12,color:B.amber,marginBottom:6}}>Required sheet format</div>
              <div style={{fontSize:12,color:B.ink,lineHeight:1.7}}>
                Row 1 (header): <strong>Clinic Name, Leads</strong><br/>
                Row 2+: Exact clinic name as shown in app, today's lead count<br/>
                Example: <code style={{background:'rgba(0,0,0,.06)',padding:'0 4px',borderRadius:4}}>MEDISURE Health Clinic,156</code>
              </div>
            </div>

            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <button onClick={handleSaveSheetUrl}
                style={{padding:'10px 20px',background:B.navy,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save URL
              </button>
              <button onClick={handleSyncNow} disabled={routeSyncing}
                style={{padding:'10px 20px',background:routeSyncing?B.muted:B.green,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:routeSyncing?'default':'pointer'}}>
                {routeSyncing?'Syncing…':'↻ Sync Now'}
              </button>
              {routeSyncMsg&&<span style={{fontSize:13,color:routeSyncMsg.includes('failed')||routeSyncMsg.includes('verify')?B.red:B.green,fontWeight:600}}>{routeSyncMsg}</span>}
            </div>

            {_cache.route_settings?.lastSynced&&(
              <div style={{marginTop:14,fontSize:12,color:B.muted}}>
                Last synced: {new Date(_cache.route_settings.lastSynced).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
              </div>
            )}
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:14,color:B.ink,marginBottom:10}}>How it works</div>
            <div style={{fontSize:13,color:B.muted,lineHeight:1.8}}>
              1. Maintain a Google Sheet with two columns: Clinic Name and today's lead count.<br/>
              2. Each morning, update the counts and click "Sync Now" (or use the button on the Route Plan page).<br/>
              3. Lead counts update instantly for everyone. The previous count shows with a strikethrough.<br/>
              4. Each day's data is stored in history automatically.<br/>
              5. <strong style={{color:B.ink}}>Status is auto-calculated</strong> by comparing this week vs same days last week:<br/>
              &nbsp;&nbsp;&nbsp;• &gt;10% more leads → <span style={{color:B.green,fontWeight:700}}>Growing</span><br/>
              &nbsp;&nbsp;&nbsp;• &gt;10% fewer leads → <span style={{color:B.red,fontWeight:700}}>Declining</span><br/>
              &nbsp;&nbsp;&nbsp;• Within ±10% → <span style={{color:B.blue2,fontWeight:700}}>Stable</span><br/>
              6. When status changes, the RM gets a notification automatically.
            </div>
          </Card>

          <Card style={{borderLeft:'4px solid #1b5e20',marginTop:0}}>
            <div style={{fontWeight:700,fontSize:16,color:'#1b5e20',marginBottom:4}}>Google Sheets Sync</div>
            <div style={{fontSize:13,color:B.muted,marginBottom:0}}>Pull live targets and achievements from your Google Sheet. Updates all RM data for the current month.</div>
            {lastSynced&&<div style={{fontSize:12,color:B.muted,marginTop:6}}>Last synced: {lastSynced}</div>}
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginTop:12}}>
              <button onClick={()=>syncFromGoogleSheet()}
                style={{padding:'10px 20px',background:'#1b5e20',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Pull from Google Sheet
              </button>
              <span id="sheetSyncStatus" style={{fontSize:12.5,color:B.muted}}></span>
            </div>
            <div style={{marginTop:10}}>
              <button onClick={()=>{
                const rows=_cache.payment_rows||[];
                const dated=rows.filter(r=>r.date&&r.date.trim());
                const sample=rows.slice(0,5).map(r=>`"${r.date}" → ${parsePayDate(r.date)?parsePayDate(r.date).toLocaleDateString('en-IN'):'UNPARSEABLE'} | rm:${r.rm} | ₹${r.amount}`);
                setPayDiag({total:rows.length,dated:dated.length,col:_payDateKey||'(none detected)',sample});
              }} style={{padding:'6px 14px',background:'#e8f5e9',color:'#1b5e20',border:'1.5px solid #1b5e20',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                Check Payment Data
              </button>
              {payDiag&&<div style={{marginTop:8,background:'#f8f9fa',border:'1.5px solid #dee2e6',borderRadius:8,padding:'10px 14px',fontSize:12,fontFamily:'monospace'}}>
                <div><b>Rows in cache:</b> {payDiag.total} &nbsp;|&nbsp; <b>With date:</b> {payDiag.dated} &nbsp;|&nbsp; <b>Date column:</b> {payDiag.col}</div>
                <div style={{marginTop:6,color:'#555'}}><b>First 5 rows:</b></div>
                {payDiag.sample.map((s,i)=><div key={i} style={{color:'#333'}}>{s}</div>)}
                {payDiag.total===0&&<div style={{color:'#c62828',marginTop:4,fontFamily:'sans-serif',fontWeight:600}}>No payment rows loaded — run "Pull from Google Sheet" first.</div>}
                {payDiag.total>0&&payDiag.dated===0&&<div style={{color:'#e65100',marginTop:4,fontFamily:'sans-serif',fontWeight:600}}>Rows exist but none have dates — date column not matched. Check column name in sheet.</div>}
              </div>}
            </div>
          </Card>

          <Card style={{borderLeft:`4px solid ${B.brand}`,marginTop:16}}>
            <div style={{fontWeight:700,fontSize:16,color:B.navy,marginBottom:4}}>Auto-sync</div>
            <div style={{fontSize:13,color:B.muted,marginBottom:16}}>Automatically pull the latest data from your Google Sheet at a set interval whenever the app is open.</div>
            <div style={{display:'flex',gap:16,alignItems:'center',marginBottom:14,flexWrap:'wrap'}}>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontWeight:600,fontSize:13}}>
                <input type="checkbox" checked={autoSyncEnabled} onChange={e=>setAutoSyncEnabled(e.target.checked)}
                  style={{width:16,height:16,cursor:'pointer'}}/>
                Enable auto-sync
              </label>
              {autoSyncEnabled&&<div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:13,color:B.muted}}>Sync every</span>
                <select value={syncIntervalMin} onChange={e=>setSyncIntervalMin(Number(e.target.value))}
                  style={{padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,background:B.white,outline:'none',cursor:'pointer'}}>
                  <option value={15}>15 minutes</option>
                  <option value={30}>30 minutes</option>
                  <option value={60}>1 hour</option>
                  <option value={120}>2 hours</option>
                </select>
              </div>}
            </div>
            {autoSyncEnabled&&<div style={{fontSize:12,color:B.muted,background:B.brandLight,borderRadius:8,padding:'8px 12px',marginBottom:14}}>
              The app will silently fetch fresh data from your sheet every {syncIntervalMin} minute{syncIntervalMin>1?'s':''} while it is open. No page reload — views update automatically.
            </div>}
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <button onClick={handleSaveAutoSync}
                style={{padding:'9px 20px',background:B.brand,color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer'}}>
                Save Settings
              </button>
              {autoSyncMsg&&<span style={{fontSize:13,color:autoSyncMsg.includes('✅')?B.green:B.red,fontWeight:600}}>{autoSyncMsg}</span>}
            </div>
          </Card>
        </div>}

        {/* ── USERS TAB ── */}
        {adminTab==='settings'&&<UsersTab/>}


      </div>
    </div>
  );
}

// ── FULL ACCESS VIEW ───────────────────────────────────────────────────────
function FullAccessView({user,onLogout}){
  const[screen,setScreen]=useState('zone');
  const[dataVer,setDataVer]=useState(0);
  const isMobile=useIsMobile();
  const isAdmin=user.role==='admin';
  useEffect(()=>{
    const h=()=>setDataVer(v=>v+1);
    window.addEventListener('rmDataUpdated',h);
    return()=>window.removeEventListener('rmDataUpdated',h);
  },[]);
  const content=<>
    {screen==='zone'&&<ZoneOverviewPanel key={dataVer}/>}
    {screen==='route'&&<RoutePlanPanel user={user}/>}
    {screen==='teams'&&<AllTeamsPanel key={dataVer}/>}
    {screen==='admin'&&<AdminPanel/>}
  </>;
  if(isMobile) return(
    <div style={{maxWidth:600,margin:'0 auto',background:B.bg,minHeight:'100vh'}}>
      <div style={{position:'fixed',top:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,background:isAdmin?'#1E1B4B':B.brandDark,padding:'6px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',zIndex:150}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <img src="even-logo.svg" alt="even" style={{height:18}}/>
          <span style={{color:'rgba(255,255,255,.7)',fontSize:11,fontWeight:600}}>{isAdmin?'⚡ Admin':'🔭 Zonal'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{background:'rgba(255,255,255,.15)',color:'rgba(255,255,255,.8)',fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10}}>FULL ACCESS</span>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.15)',border:'none',color:'rgba(255,255,255,.8)',borderRadius:8,padding:'4px 10px',fontSize:10,cursor:'pointer'}}>Out</button>
        </div>
      </div>
      <div style={{paddingTop:34}}>{content}</div>
      <FullNav screen={screen} setScreen={setScreen}/>
    </div>
  );
  // Desktop
  return(
    <div style={{display:'flex',minHeight:'100vh'}}>
      <DesktopSideNav screen={screen} setScreen={setScreen} user={user} onLogout={onLogout}/>
      <div style={{flex:1,overflow:'auto'}}>{content}</div>
    </div>
  );
}

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);const[loading,setLoading]=useState(true);const[initMsg,setInitMsg]=useState('Starting up…');
  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(fu)=>{
      if(fu){
        setInitMsg('Loading your data…');
        await initFirestore();
        const doc=await db.collection('users').doc(fu.uid).get();
        if(doc.exists){setUser({...doc.data(),uid:fu.uid});}
        else{
          const mapped=ROLE_MAP[fu.email?.toLowerCase()];
          if(mapped){await db.collection('users').doc(fu.uid).set({email:fu.email,...mapped,createdAt:new Date().toISOString()});setUser({...mapped,uid:fu.uid,email:fu.email});}
          else{await auth.signOut();}
        }
      }
      setLoading(false);
    });
    return()=>unsub();
  },[]);
  const handleLogin=async(u)=>{setInitMsg('Loading your data…');setLoading(true);await initFirestore();setUser(u);setLoading(false);};
  const handleLogout=async()=>{
    if(_autoSyncTimer){clearInterval(_autoSyncTimer);_autoSyncTimer=null;}
    if(_sheetPushUnsub){_sheetPushUnsub();_sheetPushUnsub=null;}
    await auth.signOut();setUser(null);
    _cache={targets:{},tl_targets:{},admin_state:null,tl_notes:{},route_settings:{},live_leads:{},clinic_statuses:{},route_assignments:{},tl_achieved:{},sync_settings:{},loaded:false};
  };
  if(loading)return <LoadingScreen message={initMsg}/>;
  if(!user)return <Login onLogin={handleLogin}/>;
  if(user.mustChangePassword)return <ForcePasswordChange user={user} onDone={()=>setUser({...user,mustChangePassword:false})}/>;
  const role=user.role;
  if(role==='zonal'||role==='admin')return <FullAccessView user={user} onLogout={handleLogout}/>;
  if(role==='tl')return <TLView user={user} onLogout={handleLogout}/>;
  return <RMView user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
