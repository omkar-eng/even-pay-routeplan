// Returns the ISO date string (YYYY-MM-DD) of the Monday of the given date
function getMondayStr(d=new Date()){
  const day=new Date(d);day.setHours(0,0,0,0);
  day.setDate(day.getDate()-((day.getDay()+6)%7));
  return day.toISOString().slice(0,10);
}

async function fetchDayLeads(dateStr){
  try{const s=await db.collection('leadHistory').doc(dateStr).get();return(s.exists?s.data():{});}
  catch(e){return {};}
}

// Sums lead history for `dayCount` days starting from the given Monday
async function getWeekTotals(mondayStr,dayCount){
  const mon=new Date(mondayStr);
  const dates=Array.from({length:dayCount},(_,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    return d.toISOString().slice(0,10);
  });
  const snaps=await Promise.all(dates.map(fetchDayLeads));
  const totals={};
  snaps.forEach(data=>{
    Object.entries(data).forEach(([k,v])=>{
      if(!k.startsWith('_')&&typeof v==='number')totals[k]=(totals[k]||0)+v;
    });
  });
  return totals;
}

// Derives Growing / Stable / Declining per clinic using ±10% thresholds
function deriveStatuses(curr,prev){
  const result={};
  ALL_RMS.forEach(r=>r.clinics.forEach(c=>{
    const k=clinicKey(r.rm,c.name);
    const cv=curr[k]||0;const pv=prev[k]||0;
    if(pv===0){result[k]='Stable';return;}
    const chg=(cv-pv)/pv;
    result[k]=chg>0.1?'Growing':chg<-0.1?'Declining':'Stable';
  }));
  return result;
}

async function syncLeadsFromSheet(sheetUrl){
  const resp=await fetch(sheetUrl);
  if(!resp.ok)throw new Error('Fetch failed: '+resp.status);
  const text=await resp.text();
  const lines=text.split('\n').filter(l=>l.trim());
  const rawMap={};
  for(let i=1;i<lines.length;i++){
    const row=lines[i].replace(/\r/,'');
    const m=row.match(/^"?([^",\n]+)"?,\s*(\d+)/);
    if(m)rawMap[m[1].trim()]=parseInt(m[2])||0;
  }

  // Build clinicKey → today's leads map
  const liveLeads={};const todayData={};
  ALL_RMS.forEach(r=>r.clinics.forEach(c=>{
    if(rawMap[c.name]!==undefined){
      const k=clinicKey(r.rm,c.name);
      liveLeads[k]=rawMap[c.name];
      todayData[k]=rawMap[c.name];
    }
  }));

  // Persist today's counts to lead history
  const todayStr=new Date().toISOString().slice(0,10);
  await db.collection('leadHistory').doc(todayStr).set({...todayData,_updatedAt:new Date().toISOString()}).catch(()=>{});

  // Compare this week vs same days last week (apples-to-apples)
  const dayOfWeek=(new Date().getDay()+6)%7; // 0=Mon … 6=Sun
  const daysElapsed=dayOfWeek+1;
  const currMonday=getMondayStr();
  const prevMonday=getMondayStr(new Date(Date.now()-7*86400000));
  const[currTotals,prevTotals]=await Promise.all([
    getWeekTotals(currMonday,daysElapsed),
    getWeekTotals(prevMonday,daysElapsed)
  ]);

  const newStatuses=deriveStatuses(currTotals,prevTotals);

  // Fire notifications for any status that changed
  const existing=_cache.clinic_statuses||{};
  await Promise.all(ALL_RMS.flatMap(r=>r.clinics.map(async c=>{
    const k=clinicKey(r.rm,c.name);
    const oldStatus=existing[k]||c.status;
    const newStatus=newStatuses[k];
    if(newStatus&&oldStatus!==newStatus)await saveStatusNotif(c.name,oldStatus,newStatus,r.rm);
  })));

  // Save auto-derived statuses and live leads
  _cache.clinic_statuses={..._cache.clinic_statuses,...newStatuses};
  await db.collection('config').doc('clinic_statuses').set(_cache.clinic_statuses).catch(()=>{});
  liveLeads._updatedAt=new Date().toISOString();
  await db.collection('config').doc('live_leads').set(liveLeads).catch(()=>{});
  _cache.live_leads=liveLeads;
  await saveRouteSettings({sheetUrl,lastSynced:liveLeads._updatedAt});
  return liveLeads;
}

// Edit distance — catches typos like "Yalaling" vs "Yallaling"
function _editDist(a,b){
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp[i]=new Array(n+1).fill(0);dp[i][0]=i;}
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
// Build two maps from payment rows + target RM list:
//   rmPayments[targetNameLower] = total amount (all name variants summed)
//   rmDisplayName[targetNameLower] = fullest payment-tab name found
function parseDateInput(s){
  // HTML date inputs give "YYYY-MM-DD"; new Date("YYYY-MM-DD") is UTC midnight
  // which in IST = 5:30 AM, causing payments at local midnight to be excluded.
  // Always construct as LOCAL midnight.
  if(!s)return null;
  const p=s.split('-').map(Number);
  return new Date(p[0],p[1]-1,p[2]);
}
function parsePayDate(s){
  if(!s)return null;s=String(s).trim();
  // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(m1)return new Date(+m1[3],+m1[2]-1,+m1[1]);
  // YYYY-MM-DD (ISO, with or without time component)
  const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2){
    if(s.includes('T')){
      // Full ISO timestamp — parse as Date and read LOCAL components.
      // "2026-04-30T18:30:00.000Z" = midnight IST May 1, not April 30.
      const d=new Date(s);
      if(!isNaN(d))return new Date(d.getFullYear(),d.getMonth(),d.getDate());
    }
    return new Date(+m2[1],+m2[2]-1,+m2[3]);
  }
  // MM/DD/YYYY (US format fallback)
  const m3=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m3){const d=new Date(+m3[3],+m3[2]-1,+m3[1]);if(!isNaN(d))return d;}
  const d=new Date(s);return isNaN(d.getTime())?null:d;
}
let _payDateKey=null; // cached column name, reset on each sync
function detectPayDateKey(rows){
  if(!rows||!rows.length)return null;
  const KNOWN=['Date','Payment Date','date','DATE','Pmt Date','PaymentDate','PAYMENT DATE','payment_date','Trans Date','Transaction Date'];
  const first=rows[0];
  for(const k of KNOWN){if(first[k]!==undefined&&parsePayDate(String(first[k]||'').trim()))return k;}
  // fallback: scan all keys for one whose value parses as a date
  for(const k of Object.keys(first)){
    const v=String(first[k]||'').trim();
    if(v&&parsePayDate(v)&&isNaN(Number(v)))return k;
  }
  return null;
}
function getDateRangeFromLabel(label){
  const t=new Date();const y=t.getFullYear(),m=t.getMonth();
  if(label==='This Month')return{from:new Date(y,m,1),to:new Date(y,m+1,0)};
  if(label==='Last Month')return{from:new Date(y,m-1,1),to:new Date(y,m,0)};
  if(label==='This Week'){const dow=(t.getDay()+6)%7;return{from:new Date(y,m,t.getDate()-dow),to:t};}
  if(label==='Last 3 Months')return{from:new Date(y,m-3,1),to:t};
  return null;
}
function computeFilteredPayments(from,to){
  const rows=_cache.payment_rows||[];
  const toEnd=to?new Date(to.getFullYear(),to.getMonth(),to.getDate(),23,59,59,999):null;
  const filtered=rows.filter(r=>{
    const d=parsePayDate(r.date);if(!d)return false;
    if(from&&d<from)return false;
    if(toEnd&&d>toEnd)return false;
    return true;
  });
  const payByRM={},payByTL={};
  filtered.forEach(r=>{
    if(r.rm)payByRM[r.rm]=(payByRM[r.rm]||0)+r.amount;
    if(r.tl)payByTL[r.tl]=(payByTL[r.tl]||0)+r.amount;
  });
  const{rmPayments}=buildRMPayments(payByRM,ALL_RMS.map(r=>r.rm));
  const total=filtered.reduce((s,r)=>s+r.amount,0);
  return{rmPayments,tlPayments:payByTL,total,rows:filtered};
}
function buildRMPayments(payByRM, targetRMNames){
  const rmPayments={}, rmDisplayName={};
  // Pass 1 — exact match (highest confidence, claim these first)
  const claimed=new Set();
  for(const[k,amt]of Object.entries(payByRM)){
    const t=targetRMNames.find(n=>n.toLowerCase()===k);
    if(t){
      const lo=t.toLowerCase();
      rmPayments[lo]=(rmPayments[lo]||0)+amt;
      if(!rmDisplayName[lo]||k.length>rmDisplayName[lo].length)rmDisplayName[lo]=k;
      claimed.add(k);
    }
  }
  // Pass 2 — fuzzy first-word match for unclaimed payment keys
  for(const[k,amt]of Object.entries(payByRM)){
    if(claimed.has(k))continue;
    const kfw=k.split(/\s+/)[0];
    let bestD=Infinity,bestT=null;
    for(const t of targetRMNames){
      const d=_editDist(kfw,t.toLowerCase().split(/\s+/)[0]);
      if(d<=1&&d<bestD){bestD=d;bestT=t;}
    }
    if(bestT){
      const lo=bestT.toLowerCase();
      rmPayments[lo]=(rmPayments[lo]||0)+amt;
      if(!rmDisplayName[lo]||k.length>rmDisplayName[lo].length)rmDisplayName[lo]=k;
      claimed.add(k);
    }
  }
  // Pass 3 — first-word prefix match (e.g. "Rupesh Pendum" → "Rupeshkumar Pendum")
  for(const[k,amt]of Object.entries(payByRM)){
    if(claimed.has(k))continue;
    const kp=k.split(/\s+/);const kfw=kp[0];const klw=kp[kp.length-1];
    let bestT=null,bestD=Infinity;
    for(const t of targetRMNames){
      const tp=t.toLowerCase().split(/\s+/);const tfw=tp[0];const tlw=tp[tp.length-1];
      const prefixOk=kfw.startsWith(tfw)||tfw.startsWith(kfw);
      const lastD=_editDist(klw,tlw);
      if(prefixOk&&lastD<=1&&lastD<bestD){bestD=lastD;bestT=t;}
    }
    if(bestT){
      const lo=bestT.toLowerCase();
      rmPayments[lo]=(rmPayments[lo]||0)+amt;
      if(!rmDisplayName[lo]||k.length>rmDisplayName[lo].length)rmDisplayName[lo]=k;
    }
  }
  return{rmPayments,rmDisplayName};
}

async function syncFromGoogleSheet({silent=false}={}){
  const el=document.getElementById('sheetSyncStatus');
  if(el){el.textContent=silent?'Auto-syncing…':'Syncing…';el.style.color='#64748B';}
  try{
    const bust='&_='+Date.now();
    const [jTargets,jPayments]=await Promise.all([
      fetch(SHEET_SCRIPT_URL+'?tab=targets'+bust,{cache:'no-store'}).then(r=>r.json()),
      fetch(SHEET_SCRIPT_URL+'?tab=payments'+bust,{cache:'no-store'}).then(r=>r.json()),
    ]);
    if(jTargets.status!=='ok')throw new Error('targets: '+(jTargets.message||'error'));
    if(jPayments.status!=='ok')throw new Error('payments: '+(jPayments.message||'error'));
    const rows=jTargets.data.targets||[];
    const paymentRows=jPayments.data.payments||[];

    // Build payment totals by RM and by TL (case-insensitive)
    const payByRM={};const payByTL={};
    paymentRows.forEach(p=>{
      const rm=(p['Rm Name']||'').trim().toLowerCase();
      const tl=(p['ATL/TL Name']||'').trim().toLowerCase();
      const amt=parseFloat(p.Amount)||0;
      if(rm)payByRM[rm]=(payByRM[rm]||0)+amt;
      if(tl)payByTL[tl]=(payByTL[tl]||0)+amt;
    });

    // Attribute payments to target RMs (handles all name variants / typos)
    const targetRMNames=rows.map(r=>(r.RM||'').trim()).filter(Boolean);
    const{rmPayments,rmDisplayName}=buildRMPayments(payByRM,targetRMNames);

    // Build raw-name → matched-target map so we can tag each payment row
    const rawToTarget={};
    for(const k of Object.keys(payByRM)){
      const t=targetRMNames.find(n=>n.toLowerCase()===k);
      if(t){rawToTarget[k]=t.toLowerCase();continue;}
      const kfw=k.split(/\s+/)[0];let bestD=Infinity,bestT=null;
      for(const t2 of targetRMNames){const d=_editDist(kfw,t2.toLowerCase().split(/\s+/)[0]);if(d<=1&&d<bestD){bestD=d;bestT=t2;}}
      if(bestT)rawToTarget[k]=bestT.toLowerCase();
    }
    _payDateKey=detectPayDateKey(paymentRows);
    const rawPayRows=paymentRows.map(p=>({
      date:_payDateKey?String(p[_payDateKey]||'').trim():'',
      rm:rawToTarget[(p['Rm Name']||'').trim().toLowerCase()]||(p['Rm Name']||'').trim().toLowerCase(),
      tl:(p['ATL/TL Name']||'').trim().toLowerCase(),
      amount:parseFloat(p.Amount)||0
    })).filter(r=>r.amount>0);
    _cache.payment_rows=rawPayRows;

    // Preserve existing clinic data keyed by lowercase RM name
    const savedClinics={};
    ALL_RMS.forEach(r=>{if(r.clinics&&r.clinics.length)savedClinics[r.rm.toLowerCase().trim()]=r.clinics;});

    // Rebuild ZONE.tls fresh from sheet (sheet names are source of truth)
    ZONE.tls.splice(0,ZONE.tls.length);
    const tlByName={};
    rows.forEach(r=>{
      const tl=(r['TL/ATL']||'').trim();const city=(r.City||'').trim();
      if(tl&&!tlByName[tl.toLowerCase()]){
        const nt={name:tl,city,rms:0,filledRMs:0,target:0,achieved:0,leads:0,renewals:0,
          monthlyTgt:0,monthlyAchv:0,dailyTgt:0,dailyAchv:0,renewalTgt:0,renewalAchv:0};
        ZONE.tls.push(nt);tlByName[tl.toLowerCase()]=nt;
      }
    });

    // Delete ALL Firestore target docs (fresh query — do not rely on cache)
    const liveSnap=await db.collection('targets').get();
    await Promise.all(liveSnap.docs.map(d=>d.ref.delete().catch(()=>{})));
    _cache.targets={};

    // Rebuild ALL_RMS fresh from sheet — sheet names are the only source of truth
    ALL_RMS.splice(0,ALL_RMS.length);
    const s={};const now=new Date().toISOString();
    rows.forEach(r=>{
      const sheetRM=(r.RM||'').trim();
      const sheetTL=(r['TL/ATL']||'').trim();
      const sheetCity=(r.City||'').trim();
      if(!sheetRM||!sheetTL)return;
      const sheetRMLo=sheetRM.toLowerCase();
      const paid=rmPayments[sheetRMLo]||0;
      const payFull=rmDisplayName[sheetRMLo];
      // Use longer payment-tab name as display if available (it has the full name)
      const displayRM=payFull&&payFull.length>sheetRMLo.length
        ?payFull.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')
        :sheetRM;
      const rmObj={
        rm:displayRM,tl:sheetTL,city:sheetCity,
        target:parseFloat(r['Target (INR)'])||0,
        achieved:paid,
        refund:0,monthlyTgt:parseFloat(r['Monthly Leads Target'])||0,
        monthlyAchv:0,dailyTgt:0,dailyAchv:0,renewalTgt:0,renewalAchv:0,
        leads:0,clinics:savedClinics[sheetRMLo]||savedClinics[displayRM.toLowerCase()]||[]
      };
      ALL_RMS.push(rmObj);
      const key=safeKey(`${sheetTL}|${displayRM}`);
      s[key]={tl:sheetTL,rm:displayRM,city:sheetCity,
        target:rmObj.target,netAchieved:rmObj.achieved,monthlyLeads:rmObj.monthlyTgt,updatedAt:now};
    });

    // Recompute aggregates — use payByTL for TL achieved (avoids RM name mismatch)
    ZONE.tls.forEach(tl=>{
      const n=tl.name.toLowerCase();
      const rms=ALL_RMS.filter(r=>r.tl.toLowerCase()===n);
      tl.target=rms.reduce((s,r)=>s+(r.target||0),0);
      tl.achieved=payByTL[n]!=null?payByTL[n]:rms.reduce((s,r)=>s+(r.achieved||0),0);
      tl.monthlyTgt=rms.reduce((s,r)=>s+(r.monthlyTgt||0),0);
      tl.rms=rms.length;tl.filledRMs=rms.length;
    });
    ZONE.cities.forEach(city=>{
      const ct=ZONE.tls.filter(t=>t.city===city.name);
      city.target=ct.reduce((s,t)=>s+t.target,0);
      city.achieved=ct.reduce((s,t)=>s+t.achieved,0);
      const cn=ALL_RMS.filter(r=>r.city===city.name).length;
      city.rms=cn;city.filledRMs=cn;
    });
    ZONE.target=ZONE.tls.reduce((s,t)=>s+t.target,0);
    ZONE.achieved=ZONE.tls.reduce((s,t)=>s+t.achieved,0);

    const total=Object.values(payByTL).reduce((s,v)=>s+v,0);
    const datedCount=rawPayRows.filter(r=>r.date).length;
    if(el){el.textContent=`💾 Saving ${rows.length} RMs · ${datedCount}/${rawPayRows.length} dated payments${_payDateKey?' (col: '+_payDateKey+')':''}…`;el.style.color='#64748B';}
    const tlAchMap={};
    ZONE.tls.forEach(tl=>{tlAchMap[safeKey(tl.name)]={name:tl.name,city:tl.city,achieved:tl.achieved,target:tl.target};});
    await Promise.all([saveStore(s),db.collection('config').doc('tl_achieved').set(tlAchMap).catch(e=>console.warn('tl_achieved write:',e))]);
    const syncedAt=new Date().toISOString();
    _cache.sync_settings={..._cache.sync_settings,lastSynced:syncedAt};
    await Promise.all([
      saveStore(s),
      db.collection('config').doc('tl_achieved').set(tlAchMap).catch(e=>console.warn('tl_achieved write:',e)),
      db.collection('config').doc('sync_settings').set(_cache.sync_settings).catch(()=>{}),
      db.collection('config').doc('payment_rows').set({rows:rawPayRows}).catch(()=>{}),
    ]);
    if(silent){
      applyStoreToRMs();
      window.dispatchEvent(new Event('rmDataUpdated'));
      const t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      if(el){el.textContent='✅ Auto-synced at '+t+' · ₹'+total.toLocaleString('en-IN');el.style.color='#16A34A';}
    }else{
      const sampleNames=rows.slice(0,3).map(r=>(r.RM||'').trim()).join(', ');
      if(el){el.textContent='✅ Synced '+rows.length+' RMs · ₹'+total.toLocaleString('en-IN')+' | Sheet: '+sampleNames+' … — reloading…';el.style.color='#16A34A';}
      setTimeout(()=>window.location.reload(),1500);
    }
  }catch(e){
    if(el){el.textContent='❌ '+e.message;el.style.color='#DC2626';}
  }
}

// ── APPLY STORE → GLOBALS ─────────────────────────────────────────────────
function applyStoreToRMs(){
  const store=_cache.targets||{};

  // Rebuild ALL_RMS from store — sheet names are source of truth
  ALL_RMS.splice(0,ALL_RMS.length);
  Object.values(store).forEach(e=>{
    if(!e.rm||!e.tl)return;
    ALL_RMS.push({
      rm:e.rm,tl:e.tl,city:e.city||'',
      target:e.target||0,achieved:e.netAchieved||0,refund:e.refund||0,
      monthlyTgt:e.monthlyLeads||0,monthlyAchv:e.monthlyAchieved||0,
      dailyTgt:e.dailyLeads||0,dailyAchv:e.dailyAchieved||0,
      renewalTgt:e.renewalTarget||0,renewalAchv:e.renewalAchieved||0,
      leads:0,clinics:[]
    });
  });

  // Rebuild ZONE.tls from ALL_RMS unique TL names
  ZONE.tls.splice(0,ZONE.tls.length);
  const tlByName={};
  ALL_RMS.forEach(r=>{
    if(!r.tl||tlByName[r.tl.toLowerCase()])return;
    const nt={name:r.tl,city:r.city,rms:0,filledRMs:0,target:0,achieved:0,
      leads:0,renewals:0,monthlyTgt:0,monthlyAchv:0,dailyTgt:0,dailyAchv:0,renewalTgt:0,renewalAchv:0};
    ZONE.tls.push(nt);tlByName[r.tl.toLowerCase()]=nt;
  });

  // Compute TL aggregates
  ZONE.tls.forEach(tl=>{
    const n=tl.name.toLowerCase();
    const rms=ALL_RMS.filter(r=>r.tl.toLowerCase()===n);
    tl.target    =rms.reduce((s,r)=>s+(r.target||0),0);
    tl.achieved  =((_cache.tl_achieved||{})[safeKey(tl.name)]||{}).achieved??rms.reduce((s,r)=>s+(r.achieved||0),0);
    tl.monthlyTgt=rms.reduce((s,r)=>s+(r.monthlyTgt||0),0);
    tl.monthlyAchv=rms.reduce((s,r)=>s+(r.monthlyAchv||0),0);
    tl.dailyTgt  =rms.reduce((s,r)=>s+(r.dailyTgt||0),0);
    tl.renewalTgt=rms.reduce((s,r)=>s+(r.renewalTgt||0),0);
    tl.renewalAchv=rms.reduce((s,r)=>s+(r.renewalAchv||0),0);
    tl.rms=rms.length;tl.filledRMs=rms.length;
  });
  ZONE.cities.forEach(city=>{
    const ct=ZONE.tls.filter(t=>t.city===city.name);
    city.target  =ct.reduce((s,t)=>s+t.target,0);
    city.achieved=ct.reduce((s,t)=>s+t.achieved,0);
    const n=ALL_RMS.filter(r=>r.city===city.name).length;
    city.rms=n;city.filledRMs=n;
  });
  ZONE.target  =ZONE.tls.reduce((s,t)=>s+t.target,0);
  ZONE.achieved=ZONE.tls.reduce((s,t)=>s+t.achieved,0);
}

// ── FORCE PASSWORD CHANGE ──────────────────────────────────────────────────
function ForcePasswordChange({user,onDone}){
  const[pw,setPw]=useState('');const[pw2,setPw2]=useState('');
  const[busy,setBusy]=useState(false);const[err,setErr]=useState('');const[showPw,setShowPw]=useState(false);
  const submit=async()=>{
    if(pw.length<6){setErr('Password must be at least 6 characters.');return;}
    if(pw!==pw2){setErr('Passwords do not match.');return;}
    setBusy(true);setErr('');
    try{
      await auth.currentUser.updatePassword(pw);
      await db.collection('users').doc(user.uid).update({mustChangePassword:false});
      onDone();
    }catch(e){
      setBusy(false);
      if(e.code==='auth/requires-recent-login'){setErr('Session expired. Please log out and log in again.');}
      else{setErr('Could not update password. Try again.');}
    }
  };
  return(
    <div style={{minHeight:'100vh',background:`linear-gradient(160deg,${B.brandDark} 0%,${B.brand} 60%,${B.brandMid} 100%)`,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:380}} className="fade-in">
        <div style={{textAlign:'center',marginBottom:32}}>
          <img src="even-logo.svg" alt="even" style={{height:38,margin:'0 auto 12px',display:'block'}}/>
          <div style={{color:'rgba(255,255,255,.6)',fontSize:13,marginTop:6}}>Sales Operations Platform</div>
        </div>
        <div style={{background:B.white,borderRadius:20,padding:28,boxShadow:'0 20px 60px rgba(35,80,255,.25)'}}>
          <div style={{fontSize:18,fontWeight:700,color:B.ink,marginBottom:6}}>Set your password</div>
          <div style={{fontSize:13,color:B.muted,marginBottom:20,lineHeight:1.5}}>
            Hi <strong>{user.name||user.email}</strong>, your account was created by an admin.<br/>
            Please set a personal password before continuing.
          </div>
          {[['New Password',pw,setPw],['Confirm Password',pw2,setPw2]].map(([l,v,s],i)=>(
            <div key={l} style={{marginBottom:14,position:'relative'}}>
              <div style={{fontSize:11,fontWeight:600,color:B.muted,marginBottom:5,textTransform:'uppercase',letterSpacing:'.5px'}}>{l}</div>
              <input value={v} onChange={e=>s(e.target.value)} type={showPw?'text':'password'} placeholder="6+ characters"
                onKeyDown={e=>e.key==='Enter'&&submit()}
                style={{width:'100%',padding:'12px 14px',border:`1.5px solid ${B.line}`,borderRadius:12,fontSize:14,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
              {i===1&&<button onClick={()=>setShowPw(!showPw)} style={{position:'absolute',right:12,bottom:12,background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:12,fontWeight:600}}>{showPw?'Hide':'Show'}</button>}
            </div>
          ))}
          {err&&<div style={{color:B.red,fontSize:12,fontWeight:600,marginBottom:12,background:B.redBg,padding:'10px 12px',borderRadius:10}}>⚠️ {err}</div>}
          <button onClick={submit} disabled={busy} style={{width:'100%',padding:14,background:busy?B.muted:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:'pointer'}}>
            {busy?'Saving…':'Set Password & Continue →'}
          </button>
          <div style={{marginTop:12,fontSize:11,color:B.muted,textAlign:'center'}}>You cannot skip this step.</div>
        </div>
      </div>
    </div>
  );
}

      <div style={{background:B.bg,minHeight:'100vh',paddingBottom:80}}>
        <div style={{background:`linear-gradient(135deg,${B.brandDark},${B.brand})`,padding:'22px 18px 30px',borderRadius:'0 0 28px 28px'}}>
          <div style={{color:'rgba(255,255,255,.65)',fontSize:12}}>Team Dashboard</div>
          <div style={{color:'#fff',fontSize:21,fontWeight:800,marginTop:2}}>{user.name}'s Team</div>
          <div style={{color:'rgba(255,255,255,.55)',fontSize:11,marginTop:2}}>{user.city||'Pune'} · {myRMs.length} RMs</div>
          <div style={{display:'flex',gap:8,marginTop:14}}>
            <KTile label="Target" value={fmt(tgt)}/>
            <KTile label="Achieved" value={fmt(ach)} pv={pct(ach,tgt)}/>
            <KTile label="On Track" value={myRMs.filter(r=>pct(r.achieved,r.target)>=80).length+'/'+myRMs.length}/>
          </div>
        </div>
        <div style={{padding:'16px'}}>
          {behind.length>0&&<div style={{background:B.redBg,borderLeft:`4px solid ${B.red}`,borderRadius:14,padding:'12px 14px',marginBottom:14}}>
            <div style={{color:B.red,fontWeight:700}}>⚠️ {behind.map(r=>r.rm).join(', ')} behind target</div>
          </div>}
          <STitle>RM Performance</STitle>
          {myRMs.sort((a,b)=>pct(b.achieved,b.target)-pct(a.achieved,a.target)).map((r,i)=>{
            const p=pct(r.achieved,r.target);
            return <Card key={i} style={{marginBottom:10}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
                <div><div style={{fontWeight:700,fontSize:14}}>{r.rm}</div><div style={{color:B.muted,fontSize:11,marginTop:1}}>{fmtN(r.achieved)} of {fmtN(r.target)}</div></div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}><PBadge p={p}/></div>
              </div>
              <MBar p={p}/>
            </Card>;
          })}
        </div>
      </div>
    );
    return(
      <div style={{background:B.bg,minHeight:'100vh',paddingTop:64,paddingBottom:24}}>
        <div style={{padding:'24px 28px 0'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <div>
              <div style={{fontSize:22,fontWeight:800,color:B.navy}}>{user.name}'s Team</div>
              <div style={{color:B.muted,fontSize:13,marginTop:3}}>{user.city||'Pune'} · {myRMs.length} RMs · {new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
            </div>
          <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}}>
            <select value={dateRange} onChange={e=>setDateRange(e.target.value)} style={{padding:'8px 14px',border:`1.5px solid ${filtData?B.brand:B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',cursor:'pointer',fontWeight:600,color:filtData?B.brand:B.ink}}>
              {['All Time','Single Date','This Week','This Month','Last Month','Last 3 Months','Custom'].map(o=><option key={o}>{o}</option>)}
            </select>
            {dateRange==='Single Date'&&<div style={{display:'flex',gap:6,alignItems:'center'}}>
              <span style={{color:B.muted,fontSize:12,fontWeight:600}}>Pick date:</span>
              <input type="date" value={singleDate} onChange={e=>setSingleDate(e.target.value)} style={{padding:'6px 9px',border:`1.5px solid ${B.brand}`,borderRadius:8,fontSize:12,outline:'none'}}/>
            </div>}
            {dateRange==='Custom'&&<div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{padding:'6px 9px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,outline:'none'}}/>
              <span style={{color:B.muted,fontSize:12}}>to</span>
              <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{padding:'6px 9px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:12,outline:'none'}}/>
            </div>}
          </div>
          </div>
          {filtData&&(_cache.payment_rows||[]).length===0&&<div style={{background:'#fffbea',border:`1px solid #fde68a`,borderRadius:10,padding:'8px 14px',marginBottom:12,fontSize:12,color:B.amber,fontWeight:600}}>
            No payment data loaded yet — run a sync first to enable date filtering.
          </div>}
          {filtData&&(_cache.payment_rows||[]).length>0&&<div style={{background:B.brandLight,border:`1px solid ${B.brand}`,borderRadius:10,padding:'8px 14px',marginBottom:16,fontSize:12,color:B.brand,fontWeight:600}}>
            Showing payments for: <strong>{dateRange==='Custom'?`${customFrom} to ${customTo}`:dateRange}</strong> — Total: <strong>{fmt(filtData.total)}</strong> across {filtData.rows.length} payment{filtData.rows.length!==1?'s':''}
          </div>}
          {behind.length>0&&<div style={{background:B.redBg,borderLeft:`4px solid ${B.red}`,borderRadius:14,padding:'12px 14px',marginBottom:20}}>
            <div style={{color:B.red,fontWeight:700}}>⚠️ Behind target: {behind.map(r=>r.rm).join(', ')}</div>
          </div>}
          <div style={{display:'flex',gap:14,marginBottom:24}}>
            <StatCard title="Team Target" value={fmt(tgt)} icon="🎯"/>
            <StatCard title="Team Achieved" value={fmt(ach)} sub={`${pct(ach,tgt)}% of target`} icon="💰" highlight/>
            <StatCard title="On Track" value={myRMs.filter(r=>pct(r.achieved,r.target)>=80).length+'/'+myRMs.length} icon="✅"/>
            <StatCard title="Behind Target" value={String(behind.length)} icon="⚠️"/>
          </div>
        </div>
        <div style={{padding:'0 28px 24px'}}>
          <div style={{background:B.white,borderRadius:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',overflow:'hidden',border:`1px solid ${B.line}`}}>
            <div style={{padding:'14px 18px',borderBottom:`1px solid ${B.line}`,fontWeight:700,fontSize:14,color:B.navy}}>RM Performance — {dateRange}</div>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13,minWidth:700}}>
                <thead>
                  <tr>
                    <th style={th2}>No</th>
                    <th style={th2}>RM</th>
                    <th style={th2}>City</th>
                    <th style={thR2}>Target (₹) ↕</th>
                    <th style={thR2}>Achieved (₹) ↕</th>
                    <th style={thR2}>Target % ↕</th>
                    <th style={thR2}>Mthly Tgt</th>
                    <th style={thR2}>Mthly Achv</th>
                    <th style={thR2}>Daily Tgt</th>
                    <th style={thR2}>Renewal Tgt</th>
                    <th style={thR2}>Renewal Achv</th>
                    <th style={th2}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {myRMs.sort((a,b)=>pct(b.achieved,b.target)-pct(a.achieved,a.target)).map((r,i)=>{
                    const rma=filtData?filtData.rmPayments[r.rm.toLowerCase()]||0:r.achieved;
                    const p=pct(rma,r.target);
                    const stc=p>=80?B.green:p>=60?B.amber:B.red;
                    const stb=p>=80?B.greenBg:p>=60?B.amberBg:B.redBg;
                    const stl=p>=80?'On Track':p>=60?'At Risk':'Behind';
                    return <tr key={i} style={{background:B.white}} onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'} onMouseLeave={e=>e.currentTarget.style.background=B.white}>
                      <td style={{...td2,color:B.muted,fontWeight:600,width:44}}>{i+1}</td>
                      <td style={td2}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <div style={{width:30,height:30,background:B.brandLight,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:B.brand,flexShrink:0}}>{r.rm[0]}</div>
                          <div><div style={{fontWeight:700,color:B.ink}}>{r.rm}</div><div style={{fontSize:10,color:B.muted}}>{r.clinics?.length||0} clinics</div></div>
                        </div>
                      </td>
                      <td style={td2}>{r.city}</td>
                      <td style={tdR2}>{Number(r.target).toLocaleString('en-IN')}</td>
                      <td style={tdR2}>{Number(rma).toLocaleString('en-IN')}</td>
                      <td style={tdR2}><span style={{color:pClr(p),fontWeight:700}}>{p}%</span></td>
                      <td style={tdR2}>{r.monthlyTgt}</td>
                      <td style={tdR2}>{r.monthlyAchv}</td>
                      <td style={tdR2}>{r.dailyTgt}</td>
                      <td style={tdR2}>{r.renewalTgt}</td>
                      <td style={tdR2}>{r.renewalAchv}</td>
                      <td style={td2}><span style={{background:stb,color:stc,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700}}>{stl}</span></td>
                    </tr>;
                  })}
                </tbody>
                <tfoot>
                  <tr style={{background:B.navy}}>
                    <td colSpan={2} style={{padding:'12px 14px',color:'#fff',fontWeight:800,fontSize:13}}>TOTALS — {myRMs.length} RMs</td>
                    <td style={{padding:'12px'}}></td>
                    <td style={tfC}>{Number(tgt).toLocaleString('en-IN')}</td>
                    <td style={tfC}>{Number(ach).toLocaleString('en-IN')}</td>
                    <td style={tfC}>{pct(ach,tgt)}%</td>
                    <td style={tfC}>{totMthlyTgt}</td>
                    <td style={tfC}>{totMthlyAchv}</td>
                    <td style={tfC}>{totDailyTgt}</td>
                    <td style={tfC}>{totRenTgt}</td>
                    <td style={tfC}>{totRenAchv}</td>
                    <td style={{padding:'12px'}}></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>
    );
  };

  return <>
    {screen==='team'&&<TeamView/>}
    {screen==='route'&&<RoutePlanPanel user={user}/>}
    {isMobile&&<div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,background:B.white,borderTop:`1px solid ${B.line}`,display:'flex',zIndex:100,boxShadow:'0 -4px 20px rgba(35,80,255,.1)'}}>
      {[['team','👥','My Team'],['route','🗺️','Route Plan']].map(([id,icon,lbl])=>(
        <button key={id} onClick={()=>setScreen(id)} style={{flex:1,padding:'10px 8px 12px',background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer'}}>
          <span style={{fontSize:22}}>{icon}</span>
          <span style={{fontSize:11,fontWeight:screen===id?700:500,color:screen===id?B.brand:B.muted}}>{lbl}</span>
          {screen===id&&<div style={{width:20,height:3,background:B.brand,borderRadius:2}}/>}
        </button>
      ))}
    </div>}
    {!isMobile&&<div style={{position:'fixed',top:0,left:0,right:0,background:B.white,borderBottom:`1px solid ${B.line}`,padding:'0 32px',display:'flex',gap:4,zIndex:100,boxShadow:'0 2px 8px rgba(0,0,0,.04)'}}>
      {[['team','👥 My Team'],['route','🗺️ Route Plan']].map(([id,lbl])=>(
        <button key={id} onClick={()=>setScreen(id)} style={{padding:'14px 18px',background:'none',border:'none',borderBottom:screen===id?`3px solid ${B.brand}`:'3px solid transparent',color:screen===id?B.brand:B.muted,fontWeight:screen===id?700:500,fontSize:13,cursor:'pointer'}}>
          {lbl}
        </button>
      ))}
      <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:13,color:B.muted}}>{user.name}</span>
        <button onClick={onLogout} style={{background:B.redBg,border:'none',color:B.red,borderRadius:8,padding:'6px 12px',fontSize:12,cursor:'pointer',fontWeight:600}}>Logout</button>
      </div>
    </div>}
  </>;
}

// ── ROUTE PLAN ─────────────────────────────────────────────────────────────
function RoutePlanPanel({user}){
  const isMobile=useIsMobile();
  const[cityF,setCityF]=useState('All');
  const[tlF,setTlF]=useState('All');
  const[search,setSearch]=useState('');
  const[notes,setNotes]=useState({..._clinicNotes});
  const[editingNote,setEditingNote]=useState(null);
  const[statuses,setStatuses]=useState({...(_cache.clinic_statuses||{})});
  const[liveLeads,setLiveLeads]=useState({...(_cache.live_leads||{})});
  const[syncing,setSyncing]=useState(false);
  const[syncMsg,setSyncMsg]=useState('');
  const[assignments,setAssignments]=useState(_cache.route_assignments||{overrides:{},added:{}});
  const[editingSlot,setEditingSlot]=useState(null);
  const[addingTo,setAddingTo]=useState(null);
  const[newClinic,setNewClinic]=useState({name:'',locality:'',slot:'',freq:'Daily',status:'Stable',reason:'',leads:0});

  const isTL=user&&user.role==='tl';
  const canEdit=user&&(user.role==='tl'||user.role==='admin'||user.role==='zonal');

  useEffect(()=>{if(isTL&&user.name)setTlF(user.name);},[isTL]);

  const tls=['All',...new Set(ALL_RMS.map(r=>r.tl))];
  const FREQ_OPTS=['Daily','Tri-weekly','Bi-weekly','Weekly'];

  const getLeads=(rmName,clinicName)=>{const v=liveLeads[clinicKey(rmName,clinicName)];return v!==undefined?v:null;};
  const getStatus=(rmName,clinicName,fallback)=>statuses[clinicKey(rmName,clinicName)]||fallback;

  const saveAssignments=async(a)=>{
    setAssignments(a);_cache.route_assignments=a;
    await db.collection('config').doc('route_assignments').set(a).catch(()=>{});
  };
  const getEffectiveClinics=(r)=>{
    const ovs=assignments.overrides||{};
    const added=(assignments.added||{})[r.rm]||[];
    const base=r.clinics.filter(c=>!ovs[clinicKey(r.rm,c.name)]?.removed).map(c=>{const ov=ovs[clinicKey(r.rm,c.name)]||{};return{...c,...ov};});
    return[...base,...added.map((c,idx)=>({...c,_added:true,_addedIdx:idx}))];
  };
  const getCKey=(r,c)=>c._added?`${clinicKey(r.rm,c.name)}_a${c._addedIdx}`:clinicKey(r.rm,c.name);

  const handleSync=async()=>{
    const url=_cache.route_settings?.sheetUrl;
    if(!url){setSyncMsg('No sheet configured. Admin must set it in Admin > Route Sync.');return;}
    setSyncing(true);setSyncMsg('');
    try{
      const res=await syncLeadsFromSheet(url);
      setLiveLeads({...res});
      const n=Object.keys(res).filter(k=>!k.startsWith('_')).length;
      setSyncMsg('Synced '+n+' clinics');
    }catch(e){setSyncMsg('Sync failed — check sheet URL or publish settings');}
    setSyncing(false);
    setTimeout(()=>setSyncMsg(''),6000);
  };

  const handleSaveNote=async()=>{
    if(!editingNote||!editingNote.text.trim())return;
    const key=clinicKey(editingNote.rmName,editingNote.clinicName);
    await saveClinicNote(key,editingNote.text,user.name,editingNote.rmName);
    setNotes(p=>({...p,[key]:{note:editingNote.text.trim(),tlName:user.name,updatedAt:new Date().toISOString()}}));
    setEditingNote(null);
  };

  const handleStatusChange=async(rmName,clinicName,newStatus,oldStatus)=>{
    const key=clinicKey(rmName,clinicName);
    setStatuses(p=>({...p,[key]:newStatus}));
    await updateClinicStatus(rmName,clinicName,newStatus,oldStatus);
  };

  const handleFreqChange=async(r,c,newFreq)=>{
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex[c._addedIdx]={...ex[c._addedIdx],freq:newFreq};await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],freq:newFreq}}});}
  };
  const handleSlotSave=async(r,c,newSlot)=>{
    if(!newSlot.trim()){setEditingSlot(null);return;}
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex[c._addedIdx]={...ex[c._addedIdx],slot:newSlot.trim()};await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],slot:newSlot.trim()}}});}
    setEditingSlot(null);
  };
  const handleRemoveClinic=async(r,c)=>{
    if(c._added){const ex=[...((assignments.added||{})[r.rm]||[])];ex.splice(c._addedIdx,1);await saveAssignments({...assignments,added:{...(assignments.added||{}),[r.rm]:ex}});}
    else{const key=clinicKey(r.rm,c.name);await saveAssignments({...assignments,overrides:{...(assignments.overrides||{}),[key]:{...(assignments.overrides||{})[key],removed:true}}});}
  };
  const handleAddClinic=async(rmName)=>{
    if(!newClinic.name.trim()||!newClinic.slot.trim())return;
    const ex=(assignments.added||{})[rmName]||[];
    await saveAssignments({...assignments,added:{...(assignments.added||{}),[rmName]:[...ex,{...newClinic,name:newClinic.name.trim(),locality:newClinic.locality.trim(),reason:newClinic.reason.trim()}]}});
    setAddingTo(null);setNewClinic({name:'',locality:'',slot:'',freq:'Daily',status:'Stable',reason:'',leads:0});
  };

  const handleShare=(r)=>{
    const clinics=getEffectiveClinics(r);
    const cluster=[...new Set(clinics.map(c=>c.locality).filter(Boolean))].join(' · ');
    const lines=[`*Route Plan — ${r.rm}*`,`TL: ${r.tl} | City: ${r.city} | Cluster: ${cluster}`,``];
    clinics.forEach(c=>{
      const leads=getLeads(r.rm,c.name)??c.leads;
      const status=getStatus(r.rm,c.name,c.status);
      lines.push(`*${c.name}* (${c.locality})`);
      lines.push(`Leads: ${leads} | ${status} | ${c.freq} | ${c.slot}`);
      if(c.reason)lines.push(c.reason);
      lines.push(``);
    });
    window.open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');
  };

  const lastSync=_cache.route_settings?.lastSynced;
  const lastSyncStr=lastSync?new Date(lastSync).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Never synced';

  const filtered=ALL_RMS.filter(r=>{
    if(cityF!=='All'&&r.city!==cityF)return false;
    if(tlF!=='All'&&r.tl!==tlF)return false;
    if(search&&!r.rm.toLowerCase().includes(search.toLowerCase())&&!r.clinics.some(c=>c.name.toLowerCase().includes(search.toLowerCase())))return false;
    return true;
  });

  const totalClinics=filtered.reduce((s,r)=>s+getEffectiveClinics(r).length,0);
  const cityLabel=cityF!=='All'?cityF:'All Cities';

  const fmtSlot=(slot)=>{
    if(!slot)return '—';
    const m=slot.match(/^(\d+:\d+)\s*[–—]\s*(\d+:\d+)$/);
    if(!m)return slot;
    const fmtTime=(t)=>{
      const[h,min]=t.split(':').map(Number);
      const suffix=(h>=9&&h<=11)?'AM':'PM';
      return `${h}:${min.toString().padStart(2,'0')} ${suffix}`;
    };
    return `${fmtTime(m[1])} – ${fmtTime(m[2])}`;
  };

  const renderDays=(freq)=>{
    const map={'Daily':['Mon','Tue','Wed','Thu','Fri','Sat'],'Tri-weekly':['Mon','Wed','Fri'],'Bi-weekly':['Mon','Thu'],'Weekly':['Mon']};
    const days=map[freq]||[];
    if(!days.length)return <span style={{color:B.muted,fontSize:11}}>—</span>;
    const allDays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const isRange=days.length>2&&days.every((d,i)=>i===0||allDays.indexOf(d)===allDays.indexOf(days[i-1])+1);
    if(isRange)return <span style={{background:'#F1F5F9',color:B.ink,padding:'3px 8px',borderRadius:6,fontSize:11,fontWeight:500}}>{days[0]}–{days[days.length-1]}</span>;
    return <>{days.map(d=><span key={d} style={{background:'#F1F5F9',color:B.ink,padding:'3px 7px',borderRadius:6,fontSize:11,fontWeight:500,marginRight:3}}>{d}</span>)}</>;
  };

  const freqColors={Daily:{b:'#7B1D1D',t:'#7B1D1D'},'Tri-weekly':{b:'#5B21B6',t:'#5B21B6'},'Bi-weekly':{b:'#0E7490',t:'#0E7490'},'Weekly':{b:'#065F46',t:'#065F46'}};
  const freqStyle=(freq)=>{const c=freqColors[freq]||{b:B.muted,t:B.muted};return{border:`1.5px solid ${c.b}`,color:c.t,background:'transparent',padding:'3px 10px',borderRadius:6,fontSize:11,fontWeight:600,whiteSpace:'nowrap',display:'inline-block'};};
  const ss=(status)=>({Growing:{bg:B.greenBg,c:B.green},Stable:{bg:B.blueBg,c:B.blue2},Declining:{bg:B.redBg,c:B.red}}[status]||{bg:'#F1F5F9',c:B.muted});

  return(
    <div style={{background:'#F8F9FB',minHeight:'100vh',paddingBottom:isMobile?80:20}}>
      <div style={{background:B.white,borderBottom:`1px solid ${B.line}`,padding:'20px 20px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12,marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontSize:26,fontWeight:800,color:B.ink}}>{cityLabel}</div>
            <span style={{background:B.brandLight,color:B.brand,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:'.3px'}}>
              {filtered.length} RMS · {totalClinics} CLINICS
            </span>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={handleSync} disabled={syncing}
              style={{background:syncing?B.line:B.brand,border:'none',color:'#fff',borderRadius:8,padding:'7px 14px',fontSize:12,fontWeight:600,cursor:syncing?'default':'pointer'}}>
              {syncing?'Syncing…':'↻ Sync Leads'}
            </button>
            <span style={{color:B.muted,fontSize:11}}>Last sync: {lastSyncStr}</span>
          </div>
        </div>
        {syncMsg&&<div style={{fontSize:12,color:B.green,fontWeight:600,marginBottom:8}}>{syncMsg}</div>}
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search RM or clinic..."
            style={{flex:1,minWidth:140,padding:'7px 12px',border:`1.5px solid ${B.line}`,borderRadius:8,fontSize:13,outline:'none'}}/>
          {[['City',['All','Pune','Mumbai','Nagpur'],cityF,setCityF],['TL',tls,tlF,setTlF]].map(([l,opts,v,s])=>(

                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Frequency</div>

                            {FREQ_OPTS.map(f=><option key={f}>{f}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Status</div>
                          <select value={newClinic.status} onChange={e=>setNewClinic(p=>({...p,status:e.target.value}))}
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,background:B.white,outline:'none',cursor:'pointer'}}>
                            {['Growing','Stable','Declining'].map(s=><option key={s}>{s}</option>)}
                          </select>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:B.muted,marginBottom:3,textTransform:'uppercase'}}>Reason</div>
                          <input value={newClinic.reason} onChange={e=>setNewClinic(p=>({...p,reason:e.target.value}))} placeholder="Why this clinic?"
                            style={{width:'100%',padding:'7px 10px',border:`1.5px solid ${B.line}`,borderRadius:7,fontSize:12,outline:'none',boxSizing:'border-box'}}/>
                        </div>
                      </div>
                      <div style={{display:'flex',gap:8}}>
                        <button onClick={()=>handleAddClinic(r.rm)}
                          disabled={!newClinic.name.trim()||!newClinic.slot.trim()}
                          style={{padding:'7px 18px',background:(!newClinic.name.trim()||!newClinic.slot.trim())?B.muted:B.brand,color:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:700,cursor:(!newClinic.name.trim()||!newClinic.slot.trim())?'default':'pointer'}}>
                          Add Clinic
                        </button>
                        <button onClick={()=>setAddingTo(null)}
                          style={{padding:'7px 14px',background:B.white,color:B.muted,border:`1px solid ${B.line}`,borderRadius:8,fontSize:12,cursor:'pointer'}}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    if(dateRange==='All Time')return null;

    if(dateRange==='Custom'){if(!customFrom||!customTo)return null;return computeFilteredPayments(parseDateInput(customFrom),parseDateInput(customTo));}

                      <td style={tdR}>{r.renewalTgt}</td>
                      <td style={tdR}>{r.renewalAchv}</td>
                      <td style={td}><span style={{background:rb,color:rc,padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:700}}>{rl}</span></td>

            </tbody>
            <tfoot>
              <tr style={{background:B.navy}}>
                <td colSpan={3} style={{padding:'12px 16px',color:'#fff',fontWeight:800,fontSize:13}}>TOTALS — {tls.length} TLs · {totRMs} RMs</td>

  );
}
