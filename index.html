let _cache={targets:{},tl_targets:{},admin_state:null,tl_notes:{},loaded:false};

async function initFirestore(){
  try{
    const[tSnap,cSnap]=await Promise.all([
      db.collection('targets').get(),
      db.collection('config').get()
    ]);
    tSnap.forEach(d=>{_cache.targets[d.id]=d.data();});
    cSnap.forEach(d=>{
      if(d.id==='tl_targets')_cache.tl_targets=d.data()||{};
      if(d.id==='admin_state')_cache.admin_state=d.data()||null;
      if(d.id==='tl_notes')_cache.tl_notes=d.data()||{};
    });
  }catch(e){console.warn('Firestore load error:',e);}
  _cache.loaded=true;
}

const safeKey=k=>k.replace(/[^a-zA-Z0-9_-]/g,'_');

function loadStore(){return _cache.targets||{};}
function saveStore(s){
  _cache.targets=s;
  Object.entries(s).forEach(([k,v])=>{
    db.collection('targets').doc(safeKey(k)).set(v).catch(console.warn);
  });
  return true;
}
function loadTLTargets(){return _cache.tl_targets||{};}
function saveTLTargetsStore(s){
  _cache.tl_targets=s;
  db.collection('config').doc('tl_targets').set(s).catch(console.warn);
  return true;
}
function loadTLNotes(){return _cache.tl_notes||{};}
function saveTLNotes(s){
  _cache.tl_notes=s;

}
function loadAdminState(){return _cache.admin_state;}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[em,setEm]=useState('');
  const[pw,setPw]=useState('');
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState('');
  const[showPw,setShowPw]=useState(false);

  const go=async()=>{
    if(!em.trim()||!pw){setErr('Enter your email and password');return;}
    setBusy(true);setErr('');
    try{
      const cred=await auth.signInWithEmailAndPassword(em.trim(),pw);
      let userData;
      const userDoc=await db.collection('users').doc(cred.user.uid).get();
      if(userDoc.exists){
        userData=userDoc.data();
      } else {
        const mapped=ROLE_MAP[em.trim().toLowerCase()];
        userData=mapped||{role:'rm',name:em.split('@')[0]};
        await db.collection('users').doc(cred.user.uid).set({
          email:em.trim().toLowerCase(),
          ...userData,
          createdAt:new Date().toISOString()
        });
      }
      onLogin({...userData,uid:cred.user.uid,email:em.trim().toLowerCase()});
    }catch(e){
      setBusy(false);
      const msgs={
        'auth/wrong-password':'Wrong password. Try again.',
        'auth/user-not-found':'No account found with this email.',
        'auth/invalid-email':'Please enter a valid email.',
        'auth/invalid-credential':'Wrong email or password.',
        'auth/too-many-requests':'Too many attempts. Wait a moment and try again.',
        'auth/network-request-failed':'Network error. Check your connection.',
      };
      setErr(msgs[e.code]||'Login failed. Please try again.');
    }
  };

  return(
    <div style={{minHeight:'100vh',background:`linear-gradient(160deg,${B.brandDark} 0%,${B.brand} 60%,${B.brandMid} 100%)`,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:360}} className="fade-in">
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:12,background:'rgba(255,255,255,.12)',padding:'12px 24px',borderRadius:20}}>
            <EvenLogo size={38}/><span style={{fontSize:26,fontWeight:800,color:'#fff',letterSpacing:-.5}}>even</span>
          </div>
          <div style={{color:'rgba(255,255,255,.6)',fontSize:13,marginTop:10}}>Sales Operations Platform</div>
        </div>

        <div style={{background:B.white,borderRadius:20,padding:28,boxShadow:'0 20px 60px rgba(35,80,255,.25)'}}>
          <div style={{fontSize:18,fontWeight:700,color:B.ink,marginBottom:6}}>Sign in</div>
          <div style={{fontSize:13,color:B.muted,marginBottom:22}}>Use your work email and password</div>

          {[['Email','email',em,setEm,'you@even.in'],['Password',showPw?'text':'password',pw,setPw,'••••••••']].map(([l,t,v,s,p],i)=>(
            <div key={l} style={{marginBottom:14,position:'relative'}}>
              <div style={{fontSize:11,fontWeight:600,color:B.muted,marginBottom:5,textTransform:'uppercase',letterSpacing:'.5px'}}>{l}</div>
              <input value={v} onChange={e=>s(e.target.value)} type={t} placeholder={p}
                onKeyDown={e=>e.key==='Enter'&&go()}
                style={{width:'100%',padding:'12px 14px',border:`1.5px solid ${B.line}`,borderRadius:12,fontSize:14,outline:'none',boxSizing:'border-box'}}
                onFocus={e=>e.target.style.borderColor=B.brand}
                onBlur={e=>e.target.style.borderColor=B.line}/>
              {i===1&&<button onClick={()=>setShowPw(!showPw)} style={{position:'absolute',right:12,bottom:12,background:'none',border:'none',cursor:'pointer',color:B.muted,fontSize:12,fontWeight:600}}>
                {showPw?'Hide':'Show'}
              </button>}
            </div>
          ))}

          {err&&<div style={{color:B.red,fontSize:12,fontWeight:600,marginBottom:12,background:B.redBg,padding:'10px 12px',borderRadius:10,display:'flex',alignItems:'center',gap:6}}>
            ⚠️ {err}
          </div>}

          <button onClick={go} disabled={busy}
            style={{width:'100%',padding:14,background:busy?B.muted:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:15,fontWeight:700,cursor:busy?'not-allowed':'pointer',transition:'background .2s'}}>
            {busy?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.4)',borderTopColor:'#fff',borderRadius:'50%',display:'inline-block',animation:'spin .6s linear infinite'}}/>
              Signing in…
            </span>:'Sign In →'}
          </button>

          <div style={{marginTop:16,textAlign:'center',fontSize:12,color:B.muted}}>
            Forgot your password? Contact your admin.
          </div>
        </div>

        <div style={{marginTop:14,background:'rgba(255,255,255,.08)',borderRadius:12,padding:'12px 16px',textAlign:'center'}}>
          <div style={{color:'rgba(255,255,255,.5)',fontSize:11}}>🔒 Secured with Firebase Authentication</div>
        </div>
      </div>
    </div>
  );
}

            <div><div style={{color:'#fff',fontSize:13,fontWeight:700}}>{fmt(actual)}</div><div style={{color:'rgba(255,255,255,.55)',fontSize:11}}>of {fmt(ZONE.target)}</div></div>
          </div>
          <div style={{background:'rgba(255,255,255,.2)',borderRadius:6,height:8}}>
            <div style={{width:`${Math.min(zp,100)}%`,height:'100%',background:zp>=90?'#4ADE80':zp>=60?'#FCD34D':'#F87171',borderRadius:6}}/>
          </div>
        </div>
        <div style={{display:'flex',gap:8,marginTop:10}}>
          <KTile label="Leads" value={ZONE.leads.achieved.toLocaleString()} pv={pct(ZONE.leads.achieved,ZONE.leads.target)}/>
          <KTile label="Renewals" value={ZONE.renewal.achieved} pv={pct(ZONE.renewal.achieved,ZONE.renewal.target)}/>
          <KTile label="Refund" value={fmt(ZONE.refund)} sub="deducted"/>
        </div>
      </div>
      <div style={{padding:'14px 16px'}}>
        <STitle>City Performance</STitle>
        {ZONE.cities.map((c,i)=>{const p=pct(c.achieved,c.target);return(
          <Card key={i} style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}><div><div style={{fontWeight:700,fontSize:15}}>{c.name}</div><div style={{color:B.muted,fontSize:11}}>{c.rms} RMs · {c.leads.toLocaleString()} leads</div></div><PBadge p={p}/></div>
            <div style={{display:'flex',alignItems:'center',gap:8}}><Bar p={p} h={8}/><div style={{fontSize:11,color:B.muted,whiteSpace:'nowrap'}}>{fmt(c.achieved)}/{fmt(c.target)}</div></div>
          </Card>
        );})}
        <STitle mt={16}>TL Performance</STitle>
        {[...ZONE.tls].sort((a,b)=>pct(b.achieved,b.target)-pct(a.achieved,a.target)).map((t,i)=>{const p=pct(t.achieved,t.target);return(
          <Card key={i} style={{marginBottom:8,borderLeft:`4px solid ${pClr(p)}`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
              <div><div style={{fontWeight:700,fontSize:13}}>{t.name}</div><div style={{color:B.muted,fontSize:10}}>{t.city} · {t.rms} RMs</div></div>
              <div style={{textAlign:'right'}}><PBadge p={p}/><div style={{fontSize:10,color:B.muted,marginTop:2}}>{fmt(t.achieved)}/{fmt(t.target)}</div></div>
            </div>
            <Bar p={p}/>
          </Card>
        );})}
      </div>
    </div>
  );
}

// ── ADMIN PANEL ────────────────────────────────────────────────────────────
function AdminPanel(){
  const[targets,setTargets]=useState({});
  const[saving,setSaving]=useState('');
  const[selectedTL,setSelectedTL]=useState('');
  const[selectedRM,setSelectedRM]=useState('');
  const[form,setForm]=useState({target:'',refund:'',monthlyLeads:'',dailyLeads:'',renewalTarget:'',netAchieved:'',monthlyAchieved:'',renewalAchieved:''});

  useEffect(()=>{setTargets(loadStore());},[]);

  const tls=ZONE.tls.map(t=>t.name);
  const rms=selectedTL?ALL_RMS.filter(r=>r.tl===selectedTL).map(r=>r.rm):[];

  const loadEntry=(tl,rm)=>{
    const key=`${tl}|${rm}`;
    const e=targets[safeKey(key)]||{};
    setForm({
      target:e.target||'',refund:e.refund||'',monthlyLeads:e.monthlyLeads||'',
      dailyLeads:e.dailyLeads||'',renewalTarget:e.renewalTarget||'',
      netAchieved:e.netAchieved||'',monthlyAchieved:e.monthlyAchieved||'',
      renewalAchieved:e.renewalAchieved||''
    });
  };

  const save=async()=>{
    if(!selectedTL||!selectedRM){setSaving('Select TL and RM first');return;}
    setSaving('Saving…');
    const key=safeKey(`${selectedTL}|${selectedRM}`);
    const entry={tl:selectedTL,rm:selectedRM,city:ALL_RMS.find(r=>r.rm===selectedRM)?.city||'',
      ...Object.fromEntries(Object.entries(form).map(([k,v])=>[k,parseFloat(v)||0])),
      updated:new Date().toLocaleString('en-IN'),updatedAt:Date.now()
    };
    const newTargets={...targets,[key]:entry};
    saveStore(newTargets);
    setTargets(newTargets);
    setSaving('✅ Saved to Firebase!');
    setTimeout(()=>setSaving(''),3000);
  };

  const items=[
    {icon:'📂',title:'Upload Leads CSV',sub:'Refresh clinic data from Even Pay source',color:B.brand,action:null},
    {icon:'🔔',title:'Send Notifications',sub:'Alert RMs and TLs about updates',color:'#DB2777',action:null},
    {icon:'🔒',title:'Manage Permissions',sub:'Control who sees what',color:'#0891B2',action:null},
    {icon:'🔄',title:'Auto-Sync Google Sheets',sub:'Coming soon — leads auto-update',color:B.line,action:null},
  ];

  return(
    <div style={{background:B.bg,minHeight:'100vh',paddingBottom:80}}>
      <div style={{background:'linear-gradient(135deg,#1E1B4B,#4338CA)',padding:'22px 18px 30px',borderRadius:'0 0 28px 28px'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}><EvenLogo size={26}/><span style={{fontSize:18,fontWeight:800,color:'#fff',letterSpacing:-.5}}>even</span></div>
        <div style={{color:'rgba(255,255,255,.65)',fontSize:12}}>Admin Panel</div>
        <div style={{color:'#fff',fontSize:20,fontWeight:800,marginTop:2}}>Sales Operations</div>
        <div style={{color:'rgba(255,255,255,.55)',fontSize:11,marginTop:2}}>Full control · Firebase connected 🔥</div>
      </div>
      <div style={{padding:'16px'}}>

        {/* Set Targets */}
        <Card style={{marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:15,color:B.ink,marginBottom:4}}>🎯 Set Monthly Targets</div>
          <div style={{fontSize:12,color:B.muted,marginBottom:14}}>Saved directly to Firebase — visible to everyone instantly</div>
          <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <select value={selectedTL} onChange={e=>{setSelectedTL(e.target.value);setSelectedRM('');}}
              style={{flex:1,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',minWidth:120}}>
              <option value="">Select TL…</option>
              {tls.map(t=><option key={t}>{t}</option>)}
            </select>
            <select value={selectedRM} onChange={e=>{setSelectedRM(e.target.value);loadEntry(selectedTL,e.target.value);}}
              style={{flex:1,padding:'10px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:13,background:B.white,outline:'none',minWidth:120}}>
              <option value="">Select RM…</option>
              {rms.map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          {selectedRM&&<>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
              {[['target','Target (₹)'],['refund','Refund (₹)'],['monthlyLeads','Monthly Leads Target'],['dailyLeads','Daily Leads Target'],['renewalTarget','Renewal Target'],['netAchieved','Net Achieved (₹)'],['monthlyAchieved','Monthly Leads Achieved'],['renewalAchieved','Renewals Achieved']].map(([k,l])=>(
                <div key={k}>
                  <div style={{fontSize:10,color:B.muted,marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'.4px'}}>{l}</div>
                  <input type="number" value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder="0"
                    style={{width:'100%',padding:'9px 12px',border:`1.5px solid ${B.line}`,borderRadius:10,fontSize:14,outline:'none',boxSizing:'border-box'}}
                    onFocus={e=>e.target.style.borderColor=B.brand} onBlur={e=>e.target.style.borderColor=B.line}/>
                </div>
              ))}
            </div>
            <button onClick={save} style={{width:'100%',padding:12,background:B.brand,color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>
              💾 Save to Firebase
            </button>
            {saving&&<div style={{textAlign:'center',fontSize:12,marginTop:8,color:saving.includes('✅')?B.green:B.muted,fontWeight:600}}>{saving}</div>}
          </>}
        </Card>

        {/* Saved targets list */}
        {Object.keys(targets).length>0&&<Card style={{marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14,color:B.ink,marginBottom:10}}>📊 Saved Targets ({Object.keys(targets).length} entries)</div>
          {Object.values(targets).sort((a,b)=>(a.tl+a.rm).localeCompare(b.tl+b.rm)).slice(0,5).map((e,i)=>{
            const actual=(e.netAchieved||0)-(e.refund||0);
            const p=pct(actual,e.target||0);
            return <div key={i} style={{padding:'8px 0',borderBottom:i<4?`1px solid ${B.line}`:'none',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div><div style={{fontWeight:600,fontSize:13}}>{e.rm}</div><div style={{fontSize:11,color:B.muted}}>TL: {e.tl}</div></div>
              <div style={{textAlign:'right'}}><PBadge p={p}/><div style={{fontSize:10,color:B.muted,marginTop:2}}>{fmt(actual)}/{fmt(e.target||0)}</div></div>
            </div>;
          })}
        </Card>}

        {/* Other actions */}
        {items.map((item,i)=>(
          <Card key={i} style={{marginBottom:10,display:'flex',alignItems:'center',gap:14,opacity:item.color===B.line?.5:1,cursor:'pointer'}}>
            <div style={{width:46,height:46,background:item.color===B.line?B.bg:item.color+'18',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{item.icon}</div>
            <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14,color:item.color===B.line?B.muted:B.ink}}>{item.title}</div><div style={{fontSize:12,color:B.muted,marginTop:2}}>{item.sub}</div></div>
            <div style={{color:B.line,fontSize:20}}>›</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

        <div style={{display:'flex',alignItems:'center',gap:8}}><EvenLogo size={18}/><span style={{color:'rgba(255,255,255,.9)',fontSize:12,fontWeight:700}}>{isAdmin?`⚡ ${user.name}`:'🔭 Zonal Head'}</span></div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{background:'rgba(255,255,255,.15)',color:'rgba(255,255,255,.8)',fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10}}>FULL ACCESS</span>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.15)',border:'none',color:'rgba(255,255,255,.8)',borderRadius:8,padding:'4px 10px',fontSize:10,fontWeight:600,cursor:'pointer'}}>Logout</button>

      <div style={{paddingTop:34}}>
        {screen==='zone'&&<ZoneOverviewPanel/>}
        {screen==='board'&&<LeaderboardPanel/>}
        {screen==='route'&&<RoutePlanPanel/>}

}

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(true);
  const[initMsg,setInitMsg]=useState('Starting up…');

  useEffect(()=>{
    // Check if user is already logged in
    const unsub=auth.onAuthStateChanged(async(firebaseUser)=>{
      if(firebaseUser){
        setInitMsg('Loading your data…');
        await initFirestore();
        const userDoc=await db.collection('users').doc(firebaseUser.uid).get();
        if(userDoc.exists){
          setUser({...userDoc.data(),uid:firebaseUser.uid});
        } else {
          const mapped=ROLE_MAP[firebaseUser.email?.toLowerCase()];
          if(mapped){
            await db.collection('users').doc(firebaseUser.uid).set({email:firebaseUser.email,...mapped,createdAt:new Date().toISOString()});
            setUser({...mapped,uid:firebaseUser.uid});
          } else {
            await auth.signOut();
          }
        }
      }
      setLoading(false);
    });
    return()=>unsub();
  },[]);

  const handleLogin=async(userData)=>{
    setInitMsg('Loading your data…');
    setLoading(true);
    await initFirestore();
    setUser(userData);
    setLoading(false);
  };

  const handleLogout=async()=>{
    await auth.signOut();
    setUser(null);
    _cache={targets:{},tl_targets:{},admin_state:null,tl_notes:{},loaded:false};
  };

  if(loading) return <LoadingScreen message={initMsg}/>;
  if(!user) return <Login onLogin={handleLogin}/>;

  const role=user.role;
  if(role==='zonal'||role==='admin') return <FullAccessView user={user} onLogout={handleLogout}/>;

  return(
    <div style={{maxWidth:600,margin:'0 auto',position:'relative',minHeight:'100vh',background:B.bg}}>
      <div style={{position:'fixed',top:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:600,background:B.brandDark,padding:'6px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',zIndex:150}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}><EvenLogo size={18}/><span style={{color:'rgba(255,255,255,.9)',fontSize:12,fontWeight:700}}>{user.name}</span></div>
        <button onClick={handleLogout} style={{background:'rgba(255,255,255,.15)',border:'none',color:'rgba(255,255,255,.8)',borderRadius:8,padding:'4px 10px',fontSize:10,fontWeight:600,cursor:'pointer'}}>Logout</button>
      </div>
      <div style={{paddingTop:34}}>
        {role==='rm'&&<RMView user={user}/>}
        {role==='tl'&&<TLView user={user}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
